分享 Deep Link，标出缓存和窗口激活时机。\n","text":" 启动、RPC 与 Command Bus 1. 启动链 src/bun/index.ts 先注入登录 shell 环境、监听可能早到的 Deep Link、seed workspace/skills，再调用 startDesktopApp 。 组合根创建 Network、MCP、Models、Skills、Plugins、GitHub Auth、Storage、Trace、Streaming、Tool Host、Local Runtime、Router、Remote Manager、Updater、RPC 与 Window。 窗口开发时加载 Vite，生产时加载 views://mainview/index.html 。Renderer 由 mainview/main.tsx 挂载 React Provider 树。 2. Typed RPC shared/rpc.ts 的 DesktopRPCType 是两侧契约。类型分为： request/response ：模型、文件、设置、MCP、插件等一次性操作。 message ：Agent 流、Command、更新状态、远程连接状态等事件。 Bun 实现在 bun/rpc/index.ts ，Renderer 入口在 lib/electrobun.ts 与 client/ 。 3. 用 message 模拟流 Electrobun RPC 没有原生 AsyncGenerator。 createRpcTransport ： 1. 生成 UUID streamId 。 2. 注册只接收该 ID 的 listener。 3. 发送 start message。 4. 把 event message 放入队列。 5. 用 wake Promise 让 for await 消费。 6. done 结束、error 抛出。 7. Abort 或消费者提前 break 时通知 Bun 取消。 队列消费后清空槽位，并在阈值后 compact，避免长对话一直保留已消费事件引用。 4. RPC 与 Command 的区别 RPC 描述底层能力，如 fsWrite ；Command 描述用户意图，如 deleteFile 、 openSettings 、 runThread 。 shared/commands.ts 使用 discriminated union 定义 type + args， COMMAND META 标记目标是 webview 还是 bun。 text 菜单/快捷键/按钮 → executeCommand command → 当前进程检查 target → 本地执行或转发另一侧 这样原生菜单与 React 按钮共享相同行为，不会形成两套业务逻辑。 5. Command Provider Renderer CommandProvider 维护 handler 注册。具体页面挂载时注册处理器，卸载时 disposer 清理。Bun 侧处理窗口缩放、外链、更新等系统能力，并把 UI Command 转发 Renderer。 6. Deep Link 冷启动 Deep Link 可能早于 Window/RPC，因此入口先缓存；对象图完成后才安装真实 Handler 并 flush。共享 Thread 链接读取 Gist/Storage、写入本地 workspace，再发送 Command 定位文件。 7. 退出握手 Electrobun quit 需要两阶段协调：第一次 before quit 阻止直接退出，等待异步清理；完成后再次允许 app quit。否则 MCP、插件子进程、远程 Server 和 analytics 可能来不及关闭。 8. 实践 1. 新增一个只在 Renderer 处理的 Command，串起类型、metadata、handler 和菜单。 2. 在 RPC 流中模拟消费者提前 break，验证 Bun Abort。 3. 解释为何 DesktopRPCType 必须放 shared，而实现不能放 shared。 4. 跟踪一个冷启动分享 Deep Link，标出缓存和窗口激活时机。 "},{"id":"04-desktop-app/02-tabs-files-persistence","chapterId":"04-desktop-app","kind":"lesson","title":"Thread Tabs、文件树与持久化","description":"Thread Tab 包含 path + runtimeId + paneId：","source":"04-desktop-app/02-tabs-files-persistence.md","level":3,"levelLabel":"进阶","prerequisite":"React、RPC、Runtime","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>Thread Tabs、文件树与持久化</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>Tab 身份</strong><p>Thread Tab 包含 path + runtimeId + paneId：</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>每 Tab 一个 Store</strong><p>ThreadTabPane 为每个打开 Thread 创建独立 Zustand vanilla store。Inactive Pane 只隐藏不卸载，因此：</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>React Query 与 Store 的分工</strong><p>不要把每个 streaming token 放 React Query cache，也不要让全局 Zustand 管所有标签。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>SerializedPersistence</strong><p>编辑后 500ms debounce 并不等于并发安全。SerializedPersistence 保证：</p></div></div></section>","html":"<h1 id=\"s-0-Thread-Tabs-文件树与持久化\">Thread Tabs、文件树与持久化</h1>\n<h2 id=\"s-1-1-Tab-身份\">1. Tab 身份</h2>\n<p>Thread Tab 包含 <code>path + runtimeId + paneId</code>：</p>\n<ul><li>path 是资源位置，可因重命名改变。</li><li>runtimeId 防止本地与远程同路径冲突。</li><li>paneId 是稳定编辑器实例身份，重命名后不变。</li></ul>\n<p>Trace Tab 使用 projectId + traceKey + runtimeId。标签页列表和 active ID 存在 Renderer localStorage，恢复时验证 Runtime 与文件是否仍存在。</p>\n<h2 id=\"s-5-2-每-Tab-一个-Store\">2. 每 Tab 一个 Store</h2>\n<p><code>ThreadTabPane</code> 为每个打开 Thread 创建独立 Zustand vanilla store。Inactive Pane 只隐藏不卸载，因此：</p>\n<ul><li>Undo/Redo 保留。</li><li>编辑状态和选择保留。</li><li>流式运行不会因切换标签中断。</li></ul>\n<p>代价是更多常驻内存，因此历史和图片有预算限制。</p>\n<h2 id=\"s-9-3-React-Query-与-Store-的分工\">3. React Query 与 Store 的分工</h2>\n<ul><li>React Query 负责按 <code>[&quot;thread&quot;, runtimeId, path]</code> 加载服务端/磁盘资源。</li><li>Zustand 负责当前编辑与运行中的高频状态。</li><li>持久化组件监听 Store 变化并写回 Query 对应的资源。</li></ul>\n<p>不要把每个 streaming token 放 React Query cache，也不要让全局 Zustand 管所有标签。</p>\n<h2 id=\"s-12-4-SerializedPersistence\">4. SerializedPersistence</h2>\n<p>编辑后 500ms debounce 并不等于并发安全。SerializedPersistence 保证：</p>\n<ul><li>写入按顺序执行。</li><li>新状态不会被旧的慢写覆盖。</li><li>失败可以重试。</li><li><code>flush()</code> 等待当前和排队写入，是文件操作前的持久化屏障。</li></ul>\n<p>重命名、移动、关闭和切换 Runtime 前必须先 flush。</p>\n<h2 id=\"s-16-5-RuntimeRunTracker\">5. RuntimeRunTracker</h2>\n<p>Tracker 维护运行、保存、路径和 Runtime 租约，阻止：</p>\n<ul><li>运行中关闭/刷新 Pane。</li><li>保存中删除或覆盖文件。</li><li>运行中切断 Remote Runtime。</li><li>对重叠路径执行冲突的移动/删除。</li></ul>\n<p>这是跨组件一致性层，不只是“显示 loading”。</p>\n<h2 id=\"s-20-6-文件树\">6. 文件树</h2>\n<p>文件树映射 workspace：</p>\n<ul><li>新建 Thread/文件夹。</li><li>重命名、复制、移动、删除。</li><li>展开祖先并定位 Deep Link 导入项。</li><li>拖放前用 file mutation guard 检查路径关系和 active leases。</li></ul>\n<p>本地删除注入 OS Trash；远程删除是 server 文件系统语义。UI 文案不能假设二者完全相同。</p>\n<h2 id=\"s-24-7-标题与文件名\">7. 标题与文件名</h2>\n<p>Thread 标题来源与文件名需要同步。重命名路径后，Pane 更新 tab path 并保留 paneId；写入 Thread 时存储层也会规范化 title。处理这类双向关系时必须防止 watch 循环。</p>\n<h2 id=\"s-26-8-导入\">8. 导入</h2>\n<p>外部文件经 Parser Registry 转换成一个或多个 Thread，生成不冲突文件名，写入选定 Runtime 的 workspace，然后打开。剪贴板导入也是虚拟文件，复用相同解析流程。</p>\n<h2 id=\"s-28-9-实践\">9. 实践</h2>\n<ol><li>打开两个同路径但不同 Runtime 的 Thread，验证 ID 不冲突。</li><li>在保存延迟期间重命名文件，解释没有 flush 会发生什么。</li><li>为移动目录构造“目标在源目录内部”的非法案例。</li><li>运行中切换标签，验证 Pane 没有卸载。</li><li>阅读 <code>serialized-persistence.test.ts</code> 和 <code>runtime-run-tracker</code> 相关测试。</li></ol>","markdown":"# Thread Tabs、文件树与持久化\n\n## 1. Tab 身份\n\nThread Tab 包含 `path + runtimeId + paneId`：\n\n- path 是资源位置，可因重命名改变。\n- runtimeId 防止本地与远程同路径冲突。\n- paneId 是稳定编辑器实例身份，重命名后不变。\n\nTrace Tab 使用 projectId + traceKey + runtimeId。标签页列表和 active ID 存在 Renderer localStorage，恢复时验证 Runtime 与文件是否仍存在。\n\n## 2. 每 Tab 一个 Store\n\n`ThreadTabPane` 为每个打开 Thread 创建独立 Zustand vanilla store。Inactive Pane 只隐藏不卸载，因此：\n\n- Undo/Redo 保留。\n- 编辑状态和选择保留。\n- 流式运行不会因切换标签中断。\n\n代价是更多常驻内存，因此历史和图片有预算限制。\n\n## 3. React Query 与 Store 的分工\n\n- React Query 负责按 `[\"thread\", runtimeId, path]` 加载服务端/磁盘资源。\n- Zustand 负责当前编辑与运行中的高频状态。\n- 持久化组件监听 Store 变化并写回 Query 对应的资源。\n\n不要把每个 streaming token 放 React Query cache，也不要让全局 Zustand 管所有标签。\n\n## 4. SerializedPersistence\n\n编辑后 500ms debounce 并不等于并发安全。SerializedPersistence 保证：\n\n- 写入按顺序执行。\n- 新状态不会被旧的慢写覆盖。\n- 失败可以重试。\n- `flush()` 等待当前和排队写入，是文件操作前的持久化屏障。\n\n重命名、移动、关闭和切换 Runtime 前必须先 flush。\n\n## 5. RuntimeRunTracker\n\nTracker 维护运行、保存、路径和 Runtime 租约，阻止：\n\n- 运行中关闭/刷新 Pane。\n- 保存中删除或覆盖文件。\n- 运行中切断 Remote Runtime。\n- 对重叠路径执行冲突的移动/删除。\n\n这是跨组件一致性层，不只是“显示 loading”。\n\n## 6. 文件树\n\n文件树映射 workspace：\n\n- 新建 Thread/文件夹。\n- 重命名、复制、移动、删除。\n- 展开祖先并定位 Deep Link 导入项。\n- 拖放前用 file mutation guard 检查路径关系和 active leases。\n\n本地删除注入 OS Trash；远程删除是 server 文件系统语义。UI 文案不能假设二者完全相同。\n\n## 7. 标题与文件名\n\nThread 标题来源与文件名需要同步。重命名路径后，Pane 更新 tab path 并保留 paneId；写入 Thread 时存储层也会规范化 title。处理这类双向关系时必须防止 watch 循环。\n\n## 8. 导入\n\n外部文件经 Parser Registry 转换成一个或多个 Thread，生成不冲突文件名，写入选定 Runtime 的 workspace，然后打开。剪贴板导入也是虚拟文件，复用相同解析流程。\n\n## 9. 实践\n\n1. 打开两个同路径但不同 Runtime 的 Thread，验证 ID 不冲突。\n2. 在保存延迟期间重命名文件，解释没有 flush 会发生什么。\n3. 为移动目录构造“目标在源目录内部”的非法案例。\n4. 运行中切换标签，验证 Pane 没有卸载。\n5. 阅读 `serialized-persistence.test.ts` 和 `runtime-run-tracker` 相关测试。\n","text":" Thread Tabs、文件树与持久化 1. Tab 身份 Thread Tab 包含 path + runtimeId + paneId ： path 是资源位置，可因重命名改变。 runtimeId 防止本地与远程同路径冲突。 paneId 是稳定编辑器实例身份，重命名后不变。 Trace Tab 使用 projectId + traceKey + runtimeId。标签页列表和 active ID 存在 Renderer localStorage，恢复时验证 Runtime 与文件是否仍存在。 2. 每 Tab 一个 Store ThreadTabPane 为每个打开 Thread 创建独立 Zustand vanilla store。Inactive Pane 只隐藏不卸载，因此： Undo/Redo 保留。 编辑状态和选择保留。 流式运行不会因切换标签中断。 代价是更多常驻内存，因此历史和图片有预算限制。 3. React Query 与 Store 的分工 React Query 负责按 \"thread\", runtimeId, path 加载服务端/磁盘资源。 Zustand 负责当前编辑与运行中的高频状态。 持久化组件监听 Store 变化并写回 Query 对应的资源。 不要把每个 streaming token 放 React Query cache，也不要让全局 Zustand 管所有标签。 4. SerializedPersistence 编辑后 500ms debounce 并不等于并发安全。SerializedPersistence 保证： 写入按顺序执行。 新状态不会被旧的慢写覆盖。 失败可以重试。 flush 等待当前和排队写入，是文件操作前的持久化屏障。 重命名、移动、关闭和切换 Runtime 前必须先 flush。 5. RuntimeRunTracker Tracker 维护运行、保存、路径和 Runtime 租约，阻止： 运行中关闭/刷新 Pane。 保存中删除或覆盖文件。 运行中切断 Remote Runtime。 对重叠路径执行冲突的移动/删除。 这是跨组件一致性层，不只是“显示 loading”。 6. 文件树 文件树映射 workspace： 新建 Thread/文件夹。 重命名、复制、移动、删除。 展开祖先并定位 Deep Link 导入项。 拖放前用 file mutation guard 检查路径关系和 active leases。 本地删除注入 OS Trash；远程删除是 server 文件系统语义。UI 文案不能假设二者完全相同。 7. 标题与文件名 Thread 标题来源与文件名需要同步。重命名路径后，Pane 更新 tab path 并保留 paneId；写入 Thread 时存储层也会规范化 title。处理这类双向关系时必须防止 watch 循环。 8. 导入 外部文件经 Parser Registry 转换成一个或多个 Thread，生成不冲突文件名，写入选定 Runtime 的 workspace，然后打开。剪贴板导入也是虚拟文件，复用相同解析流程。 9. 实践 1. 打开两个同路径但不同 Runtime 的 Thread，验证 ID 不冲突。 2. 在保存延迟期间重命名文件，解释没有 flush 会发生什么。 3. 为移动目录构造“目标在源目录内部”的非法案例。 4. 运行中切换标签，验证 Pane 没有卸载。 5. 阅读 serialized persistence.test.ts 和 runtime run tracker 相关测试。 "},{"id":"04-desktop-app/03-host-settings-lifecycle","chapterId":"04-desktop-app","kind":"lesson","title":"Host Services、设置与生命周期","description":"共享 packages/ui 只依赖 HostServices。桌面实现把接口适配到：","source":"04-desktop-app/03-host-settings-lifecycle.md","level":3,"levelLabel":"进阶","prerequisite":"React、RPC、Runtime","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>Host Services、设置与生命周期</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>DesktopHostProvider</strong><p>共享 packages/ui 只依赖 HostServices。桌面实现把接口适配到：</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>设置的三种所有权</strong><p>主题、主色、侧栏宽度、实验开关等纯显示偏好存 localStorage。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>设置文件所有者</strong><p>Manager 维护内存真相源与原子持久化，React 页面不直接写 JSON。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>文件能力的三条边界</strong><p>它们的安全假设不同，不能为了复用把三者合并为一个“万能文件服务”。</p></div></div></section>","html":"<h1 id=\"s-0-Host-Services-设置与生命周期\">Host Services、设置与生命周期</h1>\n<h2 id=\"s-1-1-DesktopHostProvider\">1. DesktopHostProvider</h2>\n<p>共享 <code>packages/ui</code> 只依赖 HostServices。桌面实现把接口适配到：</p>\n<ul><li><code>createRpcTransport(runtimeId)</code>。</li><li>Built-in/MCP/Plugin Tool 执行。</li><li>Skills、路径与文件客户端。</li><li>Generator 的目录、文件、uv 与环境变量能力。</li><li>Command Bus 的设置、外链、分享、变量和 Run 动作。</li></ul>\n<p>这个 Provider 是共享 UI 和 Electrobun 的唯一主要接缝。</p>\n<h2 id=\"s-5-2-设置的三种所有权\">2. 设置的三种所有权</h2>\n<h3 id=\"s-6-Renderer-本地\">Renderer 本地</h3>\n<p>主题、主色、侧栏宽度、实验开关等纯显示偏好存 localStorage。</p>\n<h3 id=\"s-8-Desktop-Bun\">Desktop Bun</h3>\n<p>账号、更新、analytics、插件、Remote Servers 属于桌面应用自身。</p>\n<h3 id=\"s-10-Runtime-Scoped\">Runtime Scoped</h3>\n<p>模型、MCP、Skills、Search、Network 属于当前 Runtime。设置请求携带 runtimeId，切到远程后写入远程 home。</p>\n<p>插件目前是本地例外，不属于 Remote Runtime。</p>\n<h2 id=\"s-13-3-设置文件所有者\">3. 设置文件所有者</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>文件</th><th>Manager</th></tr></thead><tbody><tr><td><code>settings/models.json</code></td><td>ModelManager</td></tr><tr><td><code>settings/mcp.json</code></td><td>McpManager</td></tr><tr><td><code>settings/skills.json</code></td><td>SkillsManager</td></tr><tr><td><code>settings/search.json</code></td><td>SearchSettingsManager</td></tr><tr><td><code>settings/network.json</code></td><td>NetworkSettingsManager</td></tr><tr><td><code>settings/remote-servers.json</code></td><td>RemoteServerManager</td></tr><tr><td><code>settings/auth.json</code></td><td>GitHubAuthManager</td></tr></tbody></table></div>\n<p>Manager 维护内存真相源与原子持久化，React 页面不直接写 JSON。</p>\n<h2 id=\"s-16-4-文件能力的三条边界\">4. 文件能力的三条边界</h2>\n<ol><li>Workspace API：严格限制在 Runtime workspace。</li><li>Prompt 外部文件：用户通过变量选择任意可读文件。</li><li>Agent 文件工具：按模型参数访问 Runtime 机器路径。</li></ol>\n<p>它们的安全假设不同，不能为了复用把三者合并为一个“万能文件服务”。</p>\n<h2 id=\"s-19-5-Tool-Host-生命周期\">5. Tool Host 生命周期</h2>\n<p><code>DesktopHost</code> 注册可信、打包内置模块。ToolRegistry 在 Window/RPC 启动前完成注册并 freeze；关闭时模块按逆序 best-effort cleanup。</p>\n<p>动态第三方插件不放入这个可信 Host，而由 PluginManager 子进程管理。</p>\n<h2 id=\"s-22-6-窗口与更新\">6. 窗口与更新</h2>\n<p>Window State 保存 frame、zoom、maximized。Updater 后台检查、下载并通过 RPC message 更新 UI；正式构建的 regular 与 Performance 版使用独立 feed，但共享 <code>~/.llm-space</code>。</p>\n<p>开发版只有显式设置 CEF CDP 端口才开放调试，发布包不能常驻远程调试端口。</p>\n<h2 id=\"s-25-7-性能\">7. 性能</h2>\n<p>Renderer 会在 token streaming 时高频渲染：</p>\n<ul><li>列表项按需 <code>memo()</code>。</li><li>Store 使用窄 selector。</li><li>callback 与派生 props 保持稳定。</li><li>Preview 更新按 frame/throttle 合并。</li><li>Inactive Pane 不卸载，但不能让它订阅无关全局变化。</li></ul>\n<h2 id=\"s-28-8-实践\">8. 实践</h2>\n<ol><li>选择一个设置，判断它应属于 Renderer、Desktop 还是 Runtime。</li><li>为 HostServices 新增能力时，同时实现桌面和 Web fallback。</li><li>检查一个组件是否错误直接导入 <code>@/client</code>，应改为 Host 注入。</li><li>用 <code>mise run dev:cef</code> 和项目 CDP skill 检查真实 Renderer，而不是在普通浏览器 mock Electrobun。</li></ol>","markdown":"# Host Services、设置与生命周期\n\n## 1. DesktopHostProvider\n\n共享 `packages/ui` 只依赖 HostServices。桌面实现把接口适配到：\n\n- `createRpcTransport(runtimeId)`。\n- Built-in/MCP/Plugin Tool 执行。\n- Skills、路径与文件客户端。\n- Generator 的目录、文件、uv 与环境变量能力。\n- Command Bus 的设置、外链、分享、变量和 Run 动作。\n\n这个 Provider 是共享 UI 和 Electrobun 的唯一主要接缝。\n\n## 2. 设置的三种所有权\n\n### Renderer 本地\n\n主题、主色、侧栏宽度、实验开关等纯显示偏好存 localStorage。\n\n### Desktop Bun\n\n账号、更新、analytics、插件、Remote Servers 属于桌面应用自身。\n\n### Runtime Scoped\n\n模型、MCP、Skills、Search、Network 属于当前 Runtime。设置请求携带 runtimeId，切到远程后写入远程 home。\n\n插件目前是本地例外，不属于 Remote Runtime。\n\n## 3. 设置文件所有者\n\n| 文件 | Manager |\n| --- | --- |\n| `settings/models.json` | ModelManager |\n| `settings/mcp.json` | McpManager |\n| `settings/skills.json` | SkillsManager |\n| `settings/search.json` | SearchSettingsManager |\n| `settings/network.json` | NetworkSettingsManager |\n| `settings/remote-servers.json` | RemoteServerManager |\n| `settings/auth.json` | GitHubAuthManager |\n\nManager 维护内存真相源与原子持久化，React 页面不直接写 JSON。\n\n## 4. 文件能力的三条边界\n\n1. Workspace API：严格限制在 Runtime workspace。\n2. Prompt 外部文件：用户通过变量选择任意可读文件。\n3. Agent 文件工具：按模型参数访问 Runtime 机器路径。\n\n它们的安全假设不同，不能为了复用把三者合并为一个“万能文件服务”。\n\n## 5. Tool Host 生命周期\n\n`DesktopHost` 注册可信、打包内置模块。ToolRegistry 在 Window/RPC 启动前完成注册并 freeze；关闭时模块按逆序 best-effort cleanup。\n\n动态第三方插件不放入这个可信 Host，而由 PluginManager 子进程管理。\n\n## 6. 窗口与更新\n\nWindow State 保存 frame、zoom、maximized。Updater 后台检查、下载并通过 RPC message 更新 UI；正式构建的 regular 与 Performance 版使用独立 feed，但共享 `~/.llm-space`。\n\n开发版只有显式设置 CEF CDP 端口才开放调试，发布包不能常驻远程调试端口。\n\n## 7. 性能\n\nRenderer 会在 token streaming 时高频渲染：\n\n- 列表项按需 `memo()`。\n- Store 使用窄 selector。\n- callback 与派生 props 保持稳定。\n- Preview 更新按 frame/throttle 合并。\n- Inactive Pane 不卸载，但不能让它订阅无关全局变化。\n\n## 8. 实践\n\n1. 选择一个设置，判断它应属于 Renderer、Desktop 还是 Runtime。\n2. 为 HostServices 新增能力时，同时实现桌面和 Web fallback。\n3. 检查一个组件是否错误直接导入 `@/client`，应改为 Host 注入。\n4. 用 `mise run dev:cef` 和项目 CDP skill 检查真实 Renderer，而不是在普通浏览器 mock Electrobun。\n","text":" Host Services、设置与生命周期 1. DesktopHostProvider 共享 packages/ui 只依赖 HostServices。桌面实现把接口适配到： createRpcTransport runtimeId 。 Built in/MCP/Plugin Tool 执行。 Skills、路径与文件客户端。 Generator 的目录、文件、uv 与环境变量能力。 Command Bus 的设置、外链、分享、变量和 Run 动作。 这个 Provider 是共享 UI 和 Electrobun 的唯一主要接缝。 2. 设置的三种所有权 Renderer 本地 主题、主色、侧栏宽度、实验开关等纯显示偏好存 localStorage。 Desktop Bun 账号、更新、analytics、插件、Remote Servers 属于桌面应用自身。 Runtime Scoped 模型、MCP、Skills、Search、Network 属于当前 Runtime。设置请求携带 runtimeId，切到远程后写入远程 home。 插件目前是本地例外，不属于 Remote Runtime。 3. 设置文件所有者 文件 Manager settings/models.json ModelManager settings/mcp.json McpManager settings/skills.json SkillsManager settings/search.json SearchSettingsManager settings/network.json NetworkSettingsManager settings/remote servers.json RemoteServerManager settings/auth.json GitHubAuthManager Manager 维护内存真相源与原子持久化，React 页面不直接写 JSON。 4. 文件能力的三条边界 1. Workspace API：严格限制在 Runtime workspace。 2. Prompt 外部文件：用户通过变量选择任意可读文件。 3. Agent 文件工具：按模型参数访问 Runtime 机器路径。 它们的安全假设不同，不能为了复用把三者合并为一个“万能文件服务”。 5. Tool Host 生命周期 DesktopHost 注册可信、打包内置模块。ToolRegistry 在 Window/RPC 启动前完成注册并 freeze；关闭时模块按逆序 best effort cleanup。 动态第三方插件不放入这个可信 Host，而由 PluginManager 子进程管理。 6. 窗口与更新 Window State 保存 frame、zoom、maximized。Updater 后台检查、下载并通过 RPC message 更新 UI；正式构建的 regular 与 Performance 版使用独立 feed，但共享 ~/.llm space 。 开发版只有显式设置 CEF CDP 端口才开放调试，发布包不能常驻远程调试端口。 7. 性能 Renderer 会在 token streaming 时高频渲染： 列表项按需 memo 。 Store 使用窄 selector。 callback 与派生 props 保持稳定。 Preview 更新按 frame/throttle 合并。 Inactive Pane 不卸载，但不能让它订阅无关全局变化。 8. 实践 1. 选择一个设置，判断它应属于 Renderer、Desktop 还是 Runtime。 2. 为 HostServices 新增能力时，同时实现桌面和 Web fallback。 3. 检查一个组件是否错误直接导入 @/client ，应改为 Host 注入。 4. 用 mise run dev:cef 和项目 CDP skill 检查真实 Renderer，而不是在普通浏览器 mock Electrobun。 "},{"id":"05-remote-runtime","chapterId":"05-remote-runtime","kind":"chapter","title":"第五章：Remote Runtime 与无头 Server","description":"Remote Runtime 让桌面 UI 留在本机，同时把 workspace、模型、MCP、Tools、Skills、网络和 Trace 放到 Linux 服务器运行。系统通过 RuntimeClient 抹平本地与远程差异。","source":"05-remote-runtime.md","level":3,"levelLabel":"进阶","prerequisite":"HTTP、SSH、流式协议","duration":"10 分钟","visual":"<section class=\"chapter-guide\"><div class=\"chapter-guide-head\"><div><span>章节导读</span><strong>第五章：Remote Runtime 与无头 Server</strong></div><p>按以下顺序完成本章课程。每一项都对应一篇独立学习材料。</p></div><div class=\"chapter-guide-grid\"><a class=\"chapter-guide-card\" href=\"#05-remote-runtime/01-server-protocol\"><span class=\"chapter-guide-number\">01</span><div><strong>Server、RPC、SSE 与兼容协议</strong><p>apps/server/src/index.ts 解析：</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#05-remote-runtime/02-ssh-install-security\"><span class=\"chapter-guide-number\">02</span><div><strong>SSH 安装、Host Key 与安全</strong><p>LLM Space 调用系统 OpenSSH，复用 /.ssh/config。Host、User、IdentityFile、ProxyJump 和 ssh-agent 均由 OpenSSH 管理，应用不保存密码或私钥 passphrase。</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#05-remote-runtime/03-manager-switching-debug\"><span class=\"chapter-guide-number\">03</span><div><strong>连接状态机、切换与诊断</strong><p>Manager 保存服务器配置、串行化操作、管理 Host Key 请求、安装进度、Runtime 注册和默认切换。配置不包含本次连接 Token。</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a></div></section>","html":"<h1 id=\"s-0-第五章-Remote-Runtime-与无头-Server\">第五章：Remote Runtime 与无头 Server</h1>\n<p>Remote Runtime 让桌面 UI 留在本机，同时把 workspace、模型、MCP、Tools、Skills、网络和 Trace 放到 Linux 服务器运行。系统通过 <code>RuntimeClient</code> 抹平本地与远程差异。</p>\n<h2 id=\"s-2-架构\">架构</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">React Renderer\n→ Electrobun RPC\n→ Desktop Bun RuntimeRouter\n→ RemoteRuntimeClient\n→ localhost HTTP\n→ SSH tunnel\n→ remote 127.0.0.1:39123\n→ apps/server\n→ LocalRuntimeClient + Managers</code></pre></div>\n<h2 id=\"s-4-子课程\">子课程</h2>\n<ul><li><a href=\"05-remote-runtime/01-server-protocol.md\" data-wiki-link=\"05-remote-runtime/01-server-protocol.md\">Server、RPC、SSE 与兼容协议</a></li><li><a href=\"05-remote-runtime/02-ssh-install-security.md\" data-wiki-link=\"05-remote-runtime/02-ssh-install-security.md\">SSH 安装、Host Key 与安全</a></li><li><a href=\"05-remote-runtime/03-manager-switching-debug.md\" data-wiki-link=\"05-remote-runtime/03-manager-switching-debug.md\">连接状态机、切换与诊断</a></li></ul>\n<p>远端功能不是“在 URL 前加个 host”。它同时涉及包发布、架构识别、SSH 信任、Token 注入、进程生命周期、隧道、协议兼容和 UI 资源所有权。</p>","markdown":"# 第五章：Remote Runtime 与无头 Server\n\nRemote Runtime 让桌面 UI 留在本机，同时把 workspace、模型、MCP、Tools、Skills、网络和 Trace 放到 Linux 服务器运行。系统通过 `RuntimeClient` 抹平本地与远程差异。\n\n## 架构\n\n```text\nReact Renderer\n→ Electrobun RPC\n→ Desktop Bun RuntimeRouter\n→ RemoteRuntimeClient\n→ localhost HTTP\n→ SSH tunnel\n→ remote 127.0.0.1:39123\n→ apps/server\n→ LocalRuntimeClient + Managers\n```\n\n## 子课程\n\n- [Server、RPC、SSE 与兼容协议](05-remote-runtime/01-server-protocol.md)\n- [SSH 安装、Host Key 与安全](05-remote-runtime/02-ssh-install-security.md)\n- [连接状态机、切换与诊断](05-remote-runtime/03-manager-switching-debug.md)\n\n远端功能不是“在 URL 前加个 host”。它同时涉及包发布、架构识别、SSH 信任、Token 注入、进程生命周期、隧道、协议兼容和 UI 资源所有权。\n","text":" 第五章：Remote Runtime 与无头 Server Remote Runtime 让桌面 UI 留在本机，同时把 workspace、模型、MCP、Tools、Skills、网络和 Trace 放到 Linux 服务器运行。系统通过 RuntimeClient 抹平本地与远程差异。 架构 text React Renderer → Electrobun RPC → Desktop Bun RuntimeRouter → RemoteRuntimeClient → localhost HTTP → SSH tunnel → remote 127.0.0.1:39123 → apps/server → LocalRuntimeClient + Managers 子课程 Server、RPC、SSE 与兼容协议 05 remote runtime/01 server protocol.md SSH 安装、Host Key 与安全 05 remote runtime/02 ssh install security.md 连接状态机、切换与诊断 05 remote runtime/03 manager switching debug.md 远端功能不是“在 URL 前加个 host”。它同时涉及包发布、架构识别、SSH 信任、Token 注入、进程生命周期、隧道、协议兼容和 UI 资源所有权。 "},{"id":"05-remote-runtime/01-server-protocol","chapterId":"05-remote-runtime","kind":"lesson","title":"Server、RPC、SSE 与兼容协议","description":"apps/server/src/index.ts 解析：","source":"05-remote-runtime/01-server-protocol.md","level":3,"levelLabel":"进阶","prerequisite":"HTTP、SSH、流式协议","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>Server、RPC、SSE 与兼容协议</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>Server 启动</strong><p>apps/server/src/index.ts 解析：</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>HTTP 接口</strong><p>所有路由先校验 Authorization: Bearer ，包括 health。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>共享协议</strong><p>packages/runtime/src/remote-protocol.ts 定义协议版本、method union、request/response 和 health shape。桌面连接时校验：</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>RPC Envelope</strong><p>成功：</p></div></div></section>","html":"<h1 id=\"s-0-Server-RPC-SSE-与兼容协议\">Server、RPC、SSE 与兼容协议</h1>\n<h2 id=\"s-1-1-Server-启动\">1. Server 启动</h2>\n<p><code>apps/server/src/index.ts</code> 解析：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">--token &lt;value&gt; | --token-stdin\n--host 127.0.0.1\n--port 39123\n--home ~/.llm-space-server</code></pre></div>\n<p>Token 必须二选一。SSH 管理模式使用 stdin，避免 secret 出现在进程 argv。<code>createServerRuntime()</code> 设置 home、创建 workspace，并组装与本地桌面相同的模型、MCP、Skills、Tools、Trace 与 Streaming。</p>\n<h2 id=\"s-5-2-HTTP-接口\">2. HTTP 接口</h2>\n<p>所有路由先校验 <code>Authorization: Bearer &lt;token&gt;</code>，包括 health。</p>\n<div class=\"table-scroll\"><table><thead><tr><th>路径</th><th>用途</th></tr></thead><tbody><tr><td><code>GET /health</code></td><td>版本、协议、capabilities、路径和平台</td></tr><tr><td><code>POST /rpc</code></td><td>普通 Runtime 方法</td></tr><tr><td><code>POST /stream</code></td><td>Agent Event SSE</td></tr><tr><td><code>POST /shutdown</code></td><td>优雅停止</td></tr></tbody></table></div>\n<p>业务 RPC 错误通常仍是 HTTP 200，通过 envelope <code>ok:false</code> 表达；鉴权、非法 JSON 与未知路由使用 HTTP 状态码。</p>\n<h2 id=\"s-9-3-共享协议\">3. 共享协议</h2>\n<p><code>packages/runtime/src/remote-protocol.ts</code> 定义协议版本、method union、request/response 和 health shape。桌面连接时校验：</p>\n<ul><li>protocolVersion 严格一致。</li><li>Server 版本与 Desktop 版本一致。</li><li>所需 capabilities 全部存在。</li></ul>\n<p>这种严格匹配牺牲部分滚动兼容，换来前后端行为确定性。新增方法要升级协议版本。</p>\n<h2 id=\"s-13-4-RPC-Envelope\">4. RPC Envelope</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-json\">{\n  &quot;id&quot;: &quot;uuid&quot;,\n  &quot;method&quot;: &quot;models.available&quot;,\n  &quot;params&quot;: {}\n}</code></pre></div>\n<p>成功：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-json\">{ &quot;id&quot;: &quot;uuid&quot;, &quot;ok&quot;: true, &quot;result&quot;: [] }</code></pre></div>\n<p>失败：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-json\">{\n  &quot;id&quot;: &quot;uuid&quot;,\n  &quot;ok&quot;: false,\n  &quot;error&quot;: { &quot;code&quot;: &quot;invalid_params&quot;, &quot;message&quot;: &quot;...&quot; }\n}</code></pre></div>\n<p>服务端 dispatcher 把 method 映射回 RuntimeClient。共享 union 让 TypeScript 检查两端 method/params/result。</p>\n<h2 id=\"s-20-5-SSE-Streaming\">5. SSE Streaming</h2>\n<p>这不是浏览器 EventSource，因为请求需要 POST body 和 Bearer Header。客户端用 fetch 读取 response body，手工解析：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">data: [START]\n\ndata: {&quot;type&quot;:&quot;message_update&quot;, ...}\n\ndata: [DONE]</code></pre></div>\n<p>服务端把 Runtime 的 callback event 编码为 SSE。解析器必须处理 chunk 边界不等于行边界、畸形 JSON、非 2xx 和提前关闭。</p>\n<h2 id=\"s-24-6-取消链\">6. 取消链</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">Renderer AbortSignal\n→ Electrobun abort message\n→ RemoteRuntimeClient.abortStream()\n→ fetch AbortController\n→ server request signal\n→ runtime.abortStream(streamId)\n→ StreamThreadController AbortController</code></pre></div>\n<p>任何一层漏传都会造成远端模型继续消耗资源。</p>\n<h2 id=\"s-27-7-实践\">7. 实践</h2>\n<ol><li>手工启动 server，用 curl 携带 Bearer 调 <code>/health</code>。</li><li>发送未知 RPC method，区分 HTTP 与 envelope 错误。</li><li>将 SSE JSON 拆成多个网络 chunk，验证解析器。</li><li>模拟 Server protocolVersion 不同，确认连接在使用能力前失败。</li></ol>","markdown":"# Server、RPC、SSE 与兼容协议\n\n## 1. Server 启动\n\n`apps/server/src/index.ts` 解析：\n\n```text\n--token <value> | --token-stdin\n--host 127.0.0.1\n--port 39123\n--home ~/.llm-space-server\n```\n\nToken 必须二选一。SSH 管理模式使用 stdin，避免 secret 出现在进程 argv。`createServerRuntime()` 设置 home、创建 workspace，并组装与本地桌面相同的模型、MCP、Skills、Tools、Trace 与 Streaming。\n\n## 2. HTTP 接口\n\n所有路由先校验 `Authorization: Bearer <token>`，包括 health。\n\n| 路径 | 用途 |\n| --- | --- |\n| `GET /health` | 版本、协议、capabilities、路径和平台 |\n| `POST /rpc` | 普通 Runtime 方法 |\n| `POST /stream` | Agent Event SSE |\n| `POST /shutdown` | 优雅停止 |\n\n业务 RPC 错误通常仍是 HTTP 200，通过 envelope `ok:false` 表达；鉴权、非法 JSON 与未知路由使用 HTTP 状态码。\n\n## 3. 共享协议\n\n`packages/runtime/src/remote-protocol.ts` 定义协议版本、method union、request/response 和 health shape。桌面连接时校验：\n\n- protocolVersion 严格一致。\n- Server 版本与 Desktop 版本一致。\n- 所需 capabilities 全部存在。\n\n这种严格匹配牺牲部分滚动兼容，换来前后端行为确定性。新增方法要升级协议版本。\n\n## 4. RPC Envelope\n\n```json\n{\n  \"id\": \"uuid\",\n  \"method\": \"models.available\",\n  \"params\": {}\n}\n```\n\n成功：\n\n```json\n{ \"id\": \"uuid\", \"ok\": true, \"result\": [] }\n```\n\n失败：\n\n```json\n{\n  \"id\": \"uuid\",\n  \"ok\": false,\n  \"error\": { \"code\": \"invalid_params\", \"message\": \"...\" }\n}\n```\n\n服务端 dispatcher 把 method 映射回 RuntimeClient。共享 union 让 TypeScript 检查两端 method/params/result。\n\n## 5. SSE Streaming\n\n这不是浏览器 EventSource，因为请求需要 POST body 和 Bearer Header。客户端用 fetch 读取 response body，手工解析：\n\n```text\ndata: [START]\n\ndata: {\"type\":\"message_update\", ...}\n\ndata: [DONE]\n```\n\n服务端把 Runtime 的 callback event 编码为 SSE。解析器必须处理 chunk 边界不等于行边界、畸形 JSON、非 2xx 和提前关闭。\n\n## 6. 取消链\n\n```text\nRenderer AbortSignal\n→ Electrobun abort message\n→ RemoteRuntimeClient.abortStream()\n→ fetch AbortController\n→ server request signal\n→ runtime.abortStream(streamId)\n→ StreamThreadController AbortController\n```\n\n任何一层漏传都会造成远端模型继续消耗资源。\n\n## 7. 实践\n\n1. 手工启动 server，用 curl 携带 Bearer 调 `/health`。\n2. 发送未知 RPC method，区分 HTTP 与 envelope 错误。\n3. 将 SSE JSON 拆成多个网络 chunk，验证解析器。\n4. 模拟 Server protocolVersion 不同，确认连接在使用能力前失败。\n","text":" Server、RPC、SSE 与兼容协议 1. Server 启动 apps/server/src/index.ts 解析： text token <value token stdin host 127.0.0.1 port 39123 home ~/.llm space server Token 必须二选一。SSH 管理模式使用 stdin，避免 secret 出现在进程 argv。 createServerRuntime 设置 home、创建 workspace，并组装与本地桌面相同的模型、MCP、Skills、Tools、Trace 与 Streaming。 2. HTTP 接口 所有路由先校验 Authorization: Bearer <token ，包括 health。 路径 用途 GET /health 版本、协议、capabilities、路径和平台 POST /rpc 普通 Runtime 方法 POST /stream Agent Event SSE POST /shutdown 优雅停止 业务 RPC 错误通常仍是 HTTP 200，通过 envelope ok:false 表达；鉴权、非法 JSON 与未知路由使用 HTTP 状态码。 3. 共享协议 packages/runtime/src/remote protocol.ts 定义协议版本、method union、request/response 和 health shape。桌面连接时校验： protocolVersion 严格一致。 Server 版本与 Desktop 版本一致。 所需 capabilities 全部存在。 这种严格匹配牺牲部分滚动兼容，换来前后端行为确定性。新增方法要升级协议版本。 4. RPC Envelope json { \"id\": \"uuid\", \"method\": \"models.available\", \"params\": {} } 成功： json { \"id\": \"uuid\", \"ok\": true, \"result\": } 失败： json { \"id\": \"uuid\", \"ok\": false, \"error\": { \"code\": \"invalid params\", \"message\": \"...\" } } 服务端 dispatcher 把 method 映射回 RuntimeClient。共享 union 让 TypeScript 检查两端 method/params/result。 5. SSE Streaming 这不是浏览器 EventSource，因为请求需要 POST body 和 Bearer Header。客户端用 fetch 读取 response body，手工解析： text data: START data: {\"type\":\"message update\", ...} data: DONE 服务端把 Runtime 的 callback event 编码为 SSE。解析器必须处理 chunk 边界不等于行边界、畸形 JSON、非 2xx 和提前关闭。 6. 取消链 text Renderer AbortSignal → Electrobun abort message → RemoteRuntimeClient.abortStream → fetch AbortController → server request signal → runtime.abortStream streamId → StreamThreadController AbortController 任何一层漏传都会造成远端模型继续消耗资源。 7. 实践 1. 手工启动 server，用 curl 携带 Bearer 调 /health 。 2. 发送未知 RPC method，区分 HTTP 与 envelope 错误。 3. 将 SSE JSON 拆成多个网络 chunk，验证解析器。 4. 模拟 Server protocolVersion 不同，确认连接在使用能力前失败。 "},{"id":"05-remote-runtime/02-ssh-install-security","chapterId":"05-remote-runtime","kind":"lesson","title":"SSH 安装、Host Key 与安全","description":"LLM Space 调用系统 OpenSSH，复用 /.ssh/config。Host、User、IdentityFile、ProxyJump 和 ssh-agent 均由 OpenSSH 管理，应用不保存密码或私钥 passphrase。","source":"05-remote-runtime/02-ssh-install-security.md","level":3,"levelLabel":"进阶","prerequisite":"HTTP、SSH、流式协议","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>SSH 安装、Host Key 与安全</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>连接前提</strong><p>LLM Space 调用系统 OpenSSH，复用 /.ssh/config。Host、User、IdentityFile、ProxyJump 和 ssh-agent 均由 OpenSSH 管理，应用不保存密码或私钥 passphrase。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>Host Key</strong><p>Host Key 验证服务器身份，阻止中间人攻击。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>平台检测</strong><p>通过 SSH 执行 uname -s 与 uname -m，仅支持 Linux x64/arm64。平台决定下载哪个 Server 包。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>安装布局</strong><p>复用前同时检查 manifest 和可执行文件。仅有 manifest 的残缺安装不会被误认为成功。</p></div></div></section>","html":"<h1 id=\"s-0-SSH-安装-Host-Key-与安全\">SSH 安装、Host Key 与安全</h1>\n<h2 id=\"s-1-1-连接前提\">1. 连接前提</h2>\n<p>LLM Space 调用系统 OpenSSH，复用 <code>~/.ssh/config</code>。Host、User、IdentityFile、ProxyJump 和 ssh-agent 均由 OpenSSH 管理，应用不保存密码或私钥 passphrase。</p>\n<h2 id=\"s-3-2-Host-Key\">2. Host Key</h2>\n<p>Host Key 验证服务器身份，阻止中间人攻击。</p>\n<ul><li>首次连接：展示 key type 与 SHA-256 fingerprint，等待用户确认。</li><li>Key Changed：默认拒绝，要求用户先向管理员确认。</li><li>信任后写入或替换 <code>known_hosts</code>。</li></ul>\n<p>确认请求带 request ID，避免过期弹窗被重放。正式信任前会禁用 multiplexing 并重新建立严格连接，确认当前 key 仍与用户批准的一致。</p>\n<h2 id=\"s-7-3-平台检测\">3. 平台检测</h2>\n<p>通过 SSH 执行 <code>uname -s</code> 与 <code>uname -m</code>，仅支持 Linux x64/arm64。平台决定下载哪个 Server 包。</p>\n<h2 id=\"s-9-4-安装布局\">4. 安装布局</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">~/.llm-space/remote-runtime/\n├── downloads/\n├── versions/&lt;desktop-version&gt;/\n│   ├── server-manifest.json\n│   └── bin/llm-space-server\n└── current -&gt; versions/&lt;desktop-version&gt;</code></pre></div>\n<p>复用前同时检查 manifest 和可执行文件。仅有 manifest 的残缺安装不会被误认为成功。</p>\n<h2 id=\"s-12-5-下载与完整性\">5. 下载与完整性</h2>\n<p>优先让远端直接下载 GitHub Release 的 tar.gz 与 <code>.sha256</code>。失败时：</p>\n<ol><li>桌面本地下载。</li><li>本地校验 SHA-256。</li><li>通过 SSH stdin 上传远端缓存。</li><li>解压到临时目录。</li><li>验证 manifest、平台与 executable。</li><li>原子替换版本目录并更新 current symlink。</li></ol>\n<h2 id=\"s-15-6-启动与-Token\">6. 启动与 Token</h2>\n<p>每次 Managed 连接生成新随机 Token，命令使用：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">llm-space-server\n  --host 127.0.0.1\n  --port &lt;remote-port&gt;\n  --token-stdin\n  --home &lt;remote-home&gt;</code></pre></div>\n<p>Server 只监听远端 loopback；Token 从 stdin 输入，不进入 argv 或持久化配置。</p>\n<h2 id=\"s-19-7-SSH-Tunnel\">7. SSH Tunnel</h2>\n<p>独立进程执行：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-bash\">ssh -N -o ExitOnForwardFailure=yes \\\n  -L 127.0.0.1:&lt;local-port&gt;:127.0.0.1:&lt;remote-port&gt; \\\n  &lt;target&gt;</code></pre></div>\n<p>Desktop 的 RemoteRuntimeClient 只访问本地 loopback URL。远程服务没有直接暴露公网端口。</p>\n<h2 id=\"s-23-8-端口与残留进程\">8. 端口与残留进程</h2>\n<p>Remote 端口冲突时先判断监听者是否属于同一安装目录的旧 LLM Space Server。只有确认归属才停止 stale process；不能确认时拒绝自动 kill。随机端口尝试也有上限。</p>\n<h2 id=\"s-25-9-威胁模型\">9. 威胁模型</h2>\n<ul><li>SSH Host Key 保护服务器身份。</li><li>Tunnel 保护 Bearer Token 与 HTTP 内容。</li><li>Loopback 限制服务暴露面。</li><li>SHA-256 保护下载完整性，但发布账户仍是信任根。</li><li>远端 Agent 文件/shell 工具拥有该 SSH 用户权限，不能视为沙箱。</li></ul>\n<h2 id=\"s-27-10-实践\">10. 实践</h2>\n<ol><li>用 <code>ssh -G alias</code> 查看最终解析配置。</li><li>验证 Server Token 不出现在 <code>ps</code> 命令行。</li><li>模拟下载中断留下半目录，检查下次是否重装。</li><li>模拟 Host Key changed，确认系统不会提供 ignore 按钮。</li></ol>","markdown":"# SSH 安装、Host Key 与安全\n\n## 1. 连接前提\n\nLLM Space 调用系统 OpenSSH，复用 `~/.ssh/config`。Host、User、IdentityFile、ProxyJump 和 ssh-agent 均由 OpenSSH 管理，应用不保存密码或私钥 passphrase。\n\n## 2. Host Key\n\nHost Key 验证服务器身份，阻止中间人攻击。\n\n- 首次连接：展示 key type 与 SHA-256 fingerprint，等待用户确认。\n- Key Changed：默认拒绝，要求用户先向管理员确认。\n- 信任后写入或替换 `known_hosts`。\n\n确认请求带 request ID，避免过期弹窗被重放。正式信任前会禁用 multiplexing 并重新建立严格连接，确认当前 key 仍与用户批准的一致。\n\n## 3. 平台检测\n\n通过 SSH 执行 `uname -s` 与 `uname -m`，仅支持 Linux x64/arm64。平台决定下载哪个 Server 包。\n\n## 4. 安装布局\n\n```text\n~/.llm-space/remote-runtime/\n├── downloads/\n├── versions/<desktop-version>/\n│   ├── server-manifest.json\n│   └── bin/llm-space-server\n└── current -> versions/<desktop-version>\n```\n\n复用前同时检查 manifest 和可执行文件。仅有 manifest 的残缺安装不会被误认为成功。\n\n## 5. 下载与完整性\n\n优先让远端直接下载 GitHub Release 的 tar.gz 与 `.sha256`。失败时：\n\n1. 桌面本地下载。\n2. 本地校验 SHA-256。\n3. 通过 SSH stdin 上传远端缓存。\n4. 解压到临时目录。\n5. 验证 manifest、平台与 executable。\n6. 原子替换版本目录并更新 current symlink。\n\n## 6. 启动与 Token\n\n每次 Managed 连接生成新随机 Token，命令使用：\n\n```text\nllm-space-server\n  --host 127.0.0.1\n  --port <remote-port>\n  --token-stdin\n  --home <remote-home>\n```\n\nServer 只监听远端 loopback；Token 从 stdin 输入，不进入 argv 或持久化配置。\n\n## 7. SSH Tunnel\n\n独立进程执行：\n\n```bash\nssh -N -o ExitOnForwardFailure=yes \\\n  -L 127.0.0.1:<local-port>:127.0.0.1:<remote-port> \\\n  <target>\n```\n\nDesktop 的 RemoteRuntimeClient 只访问本地 loopback URL。远程服务没有直接暴露公网端口。\n\n## 8. 端口与残留进程\n\nRemote 端口冲突时先判断监听者是否属于同一安装目录的旧 LLM Space Server。只有确认归属才停止 stale process；不能确认时拒绝自动 kill。随机端口尝试也有上限。\n\n## 9. 威胁模型\n\n- SSH Host Key 保护服务器身份。\n- Tunnel 保护 Bearer Token 与 HTTP 内容。\n- Loopback 限制服务暴露面。\n- SHA-256 保护下载完整性，但发布账户仍是信任根。\n- 远端 Agent 文件/shell 工具拥有该 SSH 用户权限，不能视为沙箱。\n\n## 10. 实践\n\n1. 用 `ssh -G alias` 查看最终解析配置。\n2. 验证 Server Token 不出现在 `ps` 命令行。\n3. 模拟下载中断留下半目录，检查下次是否重装。\n4. 模拟 Host Key changed，确认系统不会提供 ignore 按钮。\n","text":" SSH 安装、Host Key 与安全 1. 连接前提 LLM Space 调用系统 OpenSSH，复用 ~/.ssh/config 。Host、User、IdentityFile、ProxyJump 和 ssh agent 均由 OpenSSH 管理，应用不保存密码或私钥 passphrase。 2. Host Key Host Key 验证服务器身份，阻止中间人攻击。 首次连接：展示 key type 与 SHA 256 fingerprint，等待用户确认。 Key Changed：默认拒绝，要求用户先向管理员确认。 信任后写入或替换 known hosts 。 确认请求带 request ID，避免过期弹窗被重放。正式信任前会禁用 multiplexing 并重新建立严格连接，确认当前 key 仍与用户批准的一致。 3. 平台检测 通过 SSH 执行 uname s 与 uname m ，仅支持 Linux x64/arm64。平台决定下载哪个 Server 包。 4. 安装布局 text ~/.llm space/remote runtime/ ├── downloads/ ├── versions/<desktop version / │ ├── server manifest.json │ └── bin/llm space server └── current versions/<desktop version 复用前同时检查 manifest 和可执行文件。仅有 manifest 的残缺安装不会被误认为成功。 5. 下载与完整性 优先让远端直接下载 GitHub Release 的 tar.gz 与 .sha256 。失败时： 1. 桌面本地下载。 2. 本地校验 SHA 256。 3. 通过 SSH stdin 上传远端缓存。 4. 解压到临时目录。 5. 验证 manifest、平台与 executable。 6. 原子替换版本目录并更新 current symlink。 6. 启动与 Token 每次 Managed 连接生成新随机 Token，命令使用： text llm space server host 127.0.0.1 port <remote port token stdin home <remote home Server 只监听远端 loopback；Token 从 stdin 输入，不进入 argv 或持久化配置。 7. SSH Tunnel 独立进程执行： bash ssh N o ExitOnForwardFailure=yes \\ L 127.0.0.1:<local port :127.0.0.1:<remote port \\ <target Desktop 的 RemoteRuntimeClient 只访问本地 loopback URL。远程服务没有直接暴露公网端口。 8. 端口与残留进程 Remote 端口冲突时先判断监听者是否属于同一安装目录的旧 LLM Space Server。只有确认归属才停止 stale process；不能确认时拒绝自动 kill。随机端口尝试也有上限。 9. 威胁模型 SSH Host Key 保护服务器身份。 Tunnel 保护 Bearer Token 与 HTTP 内容。 Loopback 限制服务暴露面。 SHA 256 保护下载完整性，但发布账户仍是信任根。 远端 Agent 文件/shell 工具拥有该 SSH 用户权限，不能视为沙箱。 10. 实践 1. 用 ssh G alias 查看最终解析配置。 2. 验证 Server Token 不出现在 ps 命令行。 3. 模拟下载中断留下半目录，检查下次是否重装。 4. 模拟 Host Key changed，确认系统不会提供 ignore 按钮。 "},{"id":"05-remote-runtime/03-manager-switching-debug","chapterId":"05-remote-runtime","kind":"lesson","title":"连接状态机、切换与诊断","description":"Manager 保存服务器配置、串行化操作、管理 Host Key 请求、安装进度、Runtime 注册和默认切换。配置不包含本次连接 Token。","source":"05-remote-runtime/03-manager-switching-debug.md","level":3,"levelLabel":"进阶","prerequisite":"HTTP、SSH、流式协议","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>连接状态机、切换与诊断</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>RemoteServerManager</strong><p>Manager 保存服务器配置、串行化操作、管理 Host Key 请求、安装进度、Runtime 注册和默认切换。配置不包含本次连接 Token。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>连接状态机</strong><p>UI 展示每一步及错误详情。把过程做成状态机比一个“Connecting...” spinner 更容易定位认证、下载、启动还是协议问题。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>切换策略</strong><p>RuntimeRouter 中 local 始终存在。连接成功后注册 remote: 并可设为 default。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>无损切换</strong><p>如果新连接与旧连接不是同 endpoint，Manager 先保留旧连接，待新连接 health 成功才清理旧连接。连接失败时用户仍能继续使用当前工作区。</p></div></div></section>","html":"<h1 id=\"s-0-连接状态机-切换与诊断\">连接状态机、切换与诊断</h1>\n<h2 id=\"s-1-1-RemoteServerManager\">1. RemoteServerManager</h2>\n<p>Manager 保存服务器配置、串行化操作、管理 Host Key 请求、安装进度、Runtime 注册和默认切换。配置不包含本次连接 Token。</p>\n<h2 id=\"s-3-2-连接状态机\">2. 连接状态机</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">ssh-check\n→ host-key-check\n→ platform-detect\n→ server-install\n→ server-start\n→ tunnel-start\n→ health-check\n→ connected</code></pre></div>\n<p>UI 展示每一步及错误详情。把过程做成状态机比一个“Connecting...” spinner 更容易定位认证、下载、启动还是协议问题。</p>\n<h2 id=\"s-6-3-切换策略\">3. 切换策略</h2>\n<p>RuntimeRouter 中 local 始终存在。连接成功后注册 <code>remote:&lt;server-id&gt;</code> 并可设为 default。</p>\n<p>资源必须携带 runtimeId：</p>\n<ul><li>文件树。</li><li>Thread Tab。</li><li>Model/MCP/Skills 设置。</li><li>Agent Run。</li><li>Tool execution。</li></ul>\n<p>Run 开始后绑定 owner Runtime，用户后来切 workspace 也不能把 in-flight stream 改路由。</p>\n<h2 id=\"s-11-4-无损切换\">4. 无损切换</h2>\n<p>如果新连接与旧连接不是同 endpoint，Manager 先保留旧连接，待新连接 health 成功才清理旧连接。连接失败时用户仍能继续使用当前工作区。</p>\n<p>断开前检查 RuntimeRunTracker：</p>\n<ul><li>是否有 active run。</li><li>是否有 save/persistence。</li><li>是否有文件 mutation lease。</li></ul>\n<p>通过后注销 Runtime、关闭 Client/隧道/Server、移除对应 Tabs 和 Query Cache，再回到 local。</p>\n<h2 id=\"s-16-5-常见故障定位\">5. 常见故障定位</h2>\n<h3 id=\"s-17-SSH-check\">SSH check</h3>\n<p>先在终端执行 <code>ssh alias</code>、<code>ssh -vvv alias</code>。</p>\n<h3 id=\"s-19-Host-Key\">Host Key</h3>\n<p>用 <code>ssh-keygen -F</code> 检查 known_hosts，不要未确认就删除。</p>\n<h3 id=\"s-21-Platform\">Platform</h3>\n<p>确认 Linux 架构在支持列表，远端 shell 可运行基本命令。</p>\n<h3 id=\"s-23-Install\">Install</h3>\n<p>检查磁盘、目录权限、tar、GitHub 网络、SHA 文件和 executable bit。</p>\n<h3 id=\"s-25-Server-start\">Server start</h3>\n<p>检查远程端口、home 展开、manifest 与二进制；注意不能创建字面量 <code>~/</code> 目录。</p>\n<h3 id=\"s-27-Tunnel\">Tunnel</h3>\n<p>检查本地端口、ProxyJump 与 <code>ExitOnForwardFailure</code> 输出。</p>\n<h3 id=\"s-29-Health\">Health</h3>\n<p>检查 Bearer、版本、protocol 与 capabilities。不要把不兼容误报为普通网络失败。</p>\n<h2 id=\"s-31-6-Source-模式\">6. Source 模式</h2>\n<p><code>LLM_SPACE_REMOTE_SERVER_MODE=source</code> 可在远端仓库直接运行 Bun 源码，适合开发协议；生产连接使用已打包二进制，确保版本精确一致。</p>\n<h2 id=\"s-33-7-测试重点\">7. 测试重点</h2>\n<p>Remote 测试覆盖 Host Key、shell quoting、Token stdin、平台、SHA、上传 fallback、端口冲突、状态机、协议检查、并发流与取消。新增阶段时应补：</p>\n<ul><li>happy path。</li><li>用户取消。</li><li>timeout。</li><li>资源清理。</li><li>重连幂等。</li></ul>\n<h2 id=\"s-36-8-实践\">8. 实践</h2>\n<ol><li>从 UI 一条进度记录反查到 Manager phase 与 SSH 命令。</li><li>模拟 health 成功但少一个 capability。</li><li>在旧 Runtime 有未保存 Thread 时尝试断开，验证阻止逻辑。</li><li>画出连接失败时应释放的 Server process、Tunnel、Client 与 Registry 项。</li></ol>","markdown":"# 连接状态机、切换与诊断\n\n## 1. RemoteServerManager\n\nManager 保存服务器配置、串行化操作、管理 Host Key 请求、安装进度、Runtime 注册和默认切换。配置不包含本次连接 Token。\n\n## 2. 连接状态机\n\n```text\nssh-check\n→ host-key-check\n→ platform-detect\n→ server-install\n→ server-start\n→ tunnel-start\n→ health-check\n→ connected\n```\n\nUI 展示每一步及错误详情。把过程做成状态机比一个“Connecting...” spinner 更容易定位认证、下载、启动还是协议问题。\n\n## 3. 切换策略\n\nRuntimeRouter 中 local 始终存在。连接成功后注册 `remote:<server-id>` 并可设为 default。\n\n资源必须携带 runtimeId：\n\n- 文件树。\n- Thread Tab。\n- Model/MCP/Skills 设置。\n- Agent Run。\n- Tool execution。\n\nRun 开始后绑定 owner Runtime，用户后来切 workspace 也不能把 in-flight stream 改路由。\n\n## 4. 无损切换\n\n如果新连接与旧连接不是同 endpoint，Manager 先保留旧连接，待新连接 health 成功才清理旧连接。连接失败时用户仍能继续使用当前工作区。\n\n断开前检查 RuntimeRunTracker：\n\n- 是否有 active run。\n- 是否有 save/persistence。\n- 是否有文件 mutation lease。\n\n通过后注销 Runtime、关闭 Client/隧道/Server、移除对应 Tabs 和 Query Cache，再回到 local。\n\n## 5. 常见故障定位\n\n### SSH check\n\n先在终端执行 `ssh alias`、`ssh -vvv alias`。\n\n### Host Key\n\n用 `ssh-keygen -F` 检查 known_hosts，不要未确认就删除。\n\n### Platform\n\n确认 Linux 架构在支持列表，远端 shell 可运行基本命令。\n\n### Install\n\n检查磁盘、目录权限、tar、GitHub 网络、SHA 文件和 executable bit。\n\n### Server start\n\n检查远程端口、home 展开、manifest 与二进制；注意不能创建字面量 `~/` 目录。\n\n### Tunnel\n\n检查本地端口、ProxyJump 与 `ExitOnForwardFailure` 输出。\n\n### Health\n\n检查 Bearer、版本、protocol 与 capabilities。不要把不兼容误报为普通网络失败。\n\n## 6. Source 模式\n\n`LLM_SPACE_REMOTE_SERVER_MODE=source` 可在远端仓库直接运行 Bun 源码，适合开发协议；生产连接使用已打包二进制，确保版本精确一致。\n\n## 7. 测试重点\n\nRemote 测试覆盖 Host Key、shell quoting、Token stdin、平台、SHA、上传 fallback、端口冲突、状态机、协议检查、并发流与取消。新增阶段时应补：\n\n- happy path。\n- 用户取消。\n- timeout。\n- 资源清理。\n- 重连幂等。\n\n## 8. 实践\n\n1. 从 UI 一条进度记录反查到 Manager phase 与 SSH 命令。\n2. 模拟 health 成功但少一个 capability。\n3. 在旧 Runtime 有未保存 Thread 时尝试断开，验证阻止逻辑。\n4. 画出连接失败时应释放的 Server process、Tunnel、Client 与 Registry 项。\n","text":" 连接状态机、切换与诊断 1. RemoteServerManager Manager 保存服务器配置、串行化操作、管理 Host Key 请求、安装进度、Runtime 注册和默认切换。配置不包含本次连接 Token。 2. 连接状态机 text ssh check → host key check → platform detect → server install → server start → tunnel start → health check → connected UI 展示每一步及错误详情。把过程做成状态机比一个“Connecting...” spinner 更容易定位认证、下载、启动还是协议问题。 3. 切换策略 RuntimeRouter 中 local 始终存在。连接成功后注册 remote:<server id 并可设为 default。 资源必须携带 runtimeId： 文件树。 Thread Tab。 Model/MCP/Skills 设置。 Agent Run。 Tool execution。 Run 开始后绑定 owner Runtime，用户后来切 workspace 也不能把 in flight stream 改路由。 4. 无损切换 如果新连接与旧连接不是同 endpoint，Manager 先保留旧连接，待新连接 health 成功才清理旧连接。连接失败时用户仍能继续使用当前工作区。 断开前检查 RuntimeRunTracker： 是否有 active run。 是否有 save/persistence。 是否有文件 mutation lease。 通过后注销 Runtime、关闭 Client/隧道/Server、移除对应 Tabs 和 Query Cache，再回到 local。 5. 常见故障定位 SSH check 先在终端执行 ssh alias 、 ssh vvv alias 。 Host Key 用 ssh keygen F 检查 known hosts，不要未确认就删除。 Platform 确认 Linux 架构在支持列表，远端 shell 可运行基本命令。 Install 检查磁盘、目录权限、tar、GitHub 网络、SHA 文件和 executable bit。 Server start 检查远程端口、home 展开、manifest 与二进制；注意不能创建字面量 ~/ 目录。 Tunnel 检查本地端口、ProxyJump 与 ExitOnForwardFailure 输出。 Health 检查 Bearer、版本、protocol 与 capabilities。不要把不兼容误报为普通网络失败。 6. Source 模式 LLM SPACE REMOTE SERVER MODE=source 可在远端仓库直接运行 Bun 源码，适合开发协议；生产连接使用已打包二进制，确保版本精确一致。 7. 测试重点 Remote 测试覆盖 Host Key、shell quoting、Token stdin、平台、SHA、上传 fallback、端口冲突、状态机、协议检查、并发流与取消。新增阶段时应补： happy path。 用户取消。 timeout。 资源清理。 重连幂等。 8. 实践 1. 从 UI 一条进度记录反查到 Manager phase 与 SSH 命令。 2. 模拟 health 成功但少一个 capability。 3. 在旧 Runtime 有未保存 Thread 时尝试断开，验证阻止逻辑。 4. 画出连接失败时应释放的 Server process、Tunnel、Client 与 Registry 项。 "},{"id":"06-ui-engineering","chapterId":"06-ui-engineering","kind":"chapter","title":"第六章：共享 UI、Web 与工程实践","description":"最后一章把共享 React UI、Web Viewer、测试、构建、发布和扩展开发放在一起。目标不是记住脚本，而是能独立完成一次从需求到发布的改动。","source":"06-ui-engineering.md","level":2,"levelLabel":"实践","prerequisite":"React、状态管理、构建工具","duration":"10 分钟","visual":"<section class=\"chapter-guide\"><div class=\"chapter-guide-head\"><div><span>章节导读</span><strong>第六章：共享 UI、Web 与工程实践</strong></div><p>按以下顺序完成本章课程。每一项都对应一篇独立学习材料。</p></div><div class=\"chapter-guide-grid\"><a class=\"chapter-guide-card\" href=\"#06-ui-engineering/01-shared-ui-host-state\"><span class=\"chapter-guide-number\">01</span><div><strong>共享 UI、Host 抽象与状态管理</strong><p>包直接导出 TypeScript 源码，不单独 build。内部使用相对 import，避免宿主的 @/ alias 把路径解析到 apps/desktop/src。</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#06-ui-engineering/02-web-sharing\"><span class=\"chapter-guide-number\">02</span><div><strong>Web Viewer、分享与静态站点</strong><p>apps/web 同时包含：</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#06-ui-engineering/03-quality-release-practicum\"><span class=\"chapter-guide-number\">03</span><div><strong>测试、发布与毕业开发任务</strong><p>一次完整验证：</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a></div></section>","html":"<h1 id=\"s-0-第六章-共享-UI-Web-与工程实践\">第六章：共享 UI、Web 与工程实践</h1>\n<p>最后一章把共享 React UI、Web Viewer、测试、构建、发布和扩展开发放在一起。目标不是记住脚本，而是能独立完成一次从需求到发布的改动。</p>\n<h2 id=\"s-2-子课程\">子课程</h2>\n<ul><li><a href=\"06-ui-engineering/01-shared-ui-host-state.md\" data-wiki-link=\"06-ui-engineering/01-shared-ui-host-state.md\">共享 UI、Host 抽象与状态管理</a></li><li><a href=\"06-ui-engineering/02-web-sharing.md\" data-wiki-link=\"06-ui-engineering/02-web-sharing.md\">Web Viewer、分享与静态站点</a></li><li><a href=\"06-ui-engineering/03-quality-release-practicum.md\" data-wiki-link=\"06-ui-engineering/03-quality-release-practicum.md\">测试、发布与毕业开发任务</a></li></ul>\n<h2 id=\"s-4-贯穿原则\">贯穿原则</h2>\n<ul><li>共享 UI 不知道 Electrobun。</li><li>每个 Thread 有独立 Store。</li><li>Web Viewer 用同一 Thread Playground，但注入只读 Host。</li><li>测试范围随边界风险扩大。</li><li>发布版本以 Desktop package 为唯一来源。</li><li>任何跨 Runtime、跨进程或跨持久化边界的改动都要验证失败路径。</li></ul>","markdown":"# 第六章：共享 UI、Web 与工程实践\n\n最后一章把共享 React UI、Web Viewer、测试、构建、发布和扩展开发放在一起。目标不是记住脚本，而是能独立完成一次从需求到发布的改动。\n\n## 子课程\n\n- [共享 UI、Host 抽象与状态管理](06-ui-engineering/01-shared-ui-host-state.md)\n- [Web Viewer、分享与静态站点](06-ui-engineering/02-web-sharing.md)\n- [测试、发布与毕业开发任务](06-ui-engineering/03-quality-release-practicum.md)\n\n## 贯穿原则\n\n- 共享 UI 不知道 Electrobun。\n- 每个 Thread 有独立 Store。\n- Web Viewer 用同一 Thread Playground，但注入只读 Host。\n- 测试范围随边界风险扩大。\n- 发布版本以 Desktop package 为唯一来源。\n- 任何跨 Runtime、跨进程或跨持久化边界的改动都要验证失败路径。\n","text":" 第六章：共享 UI、Web 与工程实践 最后一章把共享 React UI、Web Viewer、测试、构建、发布和扩展开发放在一起。目标不是记住脚本，而是能独立完成一次从需求到发布的改动。 子课程 共享 UI、Host 抽象与状态管理 06 ui engineering/01 shared ui host state.md Web Viewer、分享与静态站点 06 ui engineering/02 web sharing.md 测试、发布与毕业开发任务 06 ui engineering/03 quality release practicum.md 贯穿原则 共享 UI 不知道 Electrobun。 每个 Thread 有独立 Store。 Web Viewer 用同一 Thread Playground，但注入只读 Host。 测试范围随边界风险扩大。 发布版本以 Desktop package 为唯一来源。 任何跨 Runtime、跨进程或跨持久化边界的改动都要验证失败路径。 "},{"id":"06-ui-engineering/01-shared-ui-host-state","chapterId":"06-ui-engineering","kind":"lesson","title":"共享 UI、Host 抽象与状态管理","description":"包直接导出 TypeScript 源码，不单独 build。内部使用相对 import，避免宿主的 @/ alias 把路径解析到 apps/desktop/src。","source":"06-ui-engineering/01-shared-ui-host-state.md","level":2,"levelLabel":"实践","prerequisite":"React、状态管理、构建工具","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>共享 UI、Host 抽象与状态管理</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>packages/ui 分层</strong><p>包直接导出 TypeScript 源码，不单独 build。内部使用相对 import，避免宿主的 @/ alias 把路径解析到 apps/desktop/src。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>ThreadPlayground</strong><p>这是核心共享业务 UI，包含 Model、Prompt、Variables、Messages、Tools、Run History、Evaluation 与 Generator。它通过 Props 和 Context 接收 Thread 初值、只读状态、Header action、HostServices 与 ModelClient。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>每 Thread 一个 Zustand Store</strong><p>createThreadStore() 创建 vanilla Store，再由 Context 提供给组件。State 包含：</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>run() 的职责</strong><p>Store Run：</p></div></div></section>","html":"<h1 id=\"s-0-共享-UI-Host-抽象与状态管理\">共享 UI、Host 抽象与状态管理</h1>\n<h2 id=\"s-1-1-packages-ui-分层\">1. packages/ui 分层</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">src/ui/          shadcn 生成原语\nsrc/components/  业务组件\nsrc/host/        宿主能力接口与 Context\nsrc/lib/         纯工具\nsrc/styles/      Tailwind v4 与设计 Token</code></pre></div>\n<p>包直接导出 TypeScript 源码，不单独 build。内部使用相对 import，避免宿主的 <code>@/</code> alias 把路径解析到 <code>apps/desktop/src</code>。</p>\n<h2 id=\"s-4-2-ThreadPlayground\">2. ThreadPlayground</h2>\n<p>这是核心共享业务 UI，包含 Model、Prompt、Variables、Messages、Tools、Run History、Evaluation 与 Generator。它通过 Props 和 Context 接收 Thread 初值、只读状态、Header action、HostServices 与 ModelClient。</p>\n<h2 id=\"s-6-3-每-Thread-一个-Zustand-Store\">3. 每 Thread 一个 Zustand Store</h2>\n<p><code>createThreadStore()</code> 创建 vanilla Store，再由 Context 提供给组件。State 包含：</p>\n<ul><li>thread / streamingMessage / status。</li><li>AbortController 与 activeRunId。</li><li>tool execution IDs。</li><li>changeHistory / runHistory / evaluations。</li><li>所有编辑、运行、Undo、工具结果操作。</li></ul>\n<p>每标签一个 Store 避免全局状态互相污染，也让 inactive Pane 保持现场。</p>\n<h2 id=\"s-10-4-run-的职责\">4. <code>run()</code> 的职责</h2>\n<p>Store Run：</p>\n<ol><li>校验模型和消息。</li><li>解析 Skills、文件与 Prompt Variables。</li><li>固定 Runtime Transport 与 Provider Profile。</li><li>调 <code>streamThread()</code> 并 reduce events。</li><li>可选自动执行工具。</li><li>ReAct 开启时继续下一模型轮次。</li><li>最多 50 轮。</li><li>完成后记录 Run History。</li><li>Abort/Error 时恢复一致状态。</li></ol>\n<p>流式 chunk 不进入 Undo，整个 Run 折叠成有意义的状态变化。</p>\n<h2 id=\"s-14-5-HostServices\">5. HostServices</h2>\n<p>接口包含 presentational、Transport、Tool execution、Skills、MCP、Built-ins、Plugins、Paths、Files、Generator 和 Actions。</p>\n<p>ModelClient 单独注入，负责 Provider/Model 查询与修改。分开是因为模型 Context 有自己的缓存与 UI 生命周期。</p>\n<h2 id=\"s-17-6-Desktop-与-Web\">6. Desktop 与 Web</h2>\n<ul><li>DesktopHostProvider 提供真实 RPC、Command、文件和 Generator。</li><li>webHost 设置 <code>presentational:true</code>，Transport/Tool/Generator 不可用，文件读取为空。</li></ul>\n<p>共享组件必须对不可用能力有明确 UI，而不是依赖调用后抛错。</p>\n<h2 id=\"s-20-7-React-性能\">7. React 性能</h2>\n<p>Message 和 ToolCall 列表是热路径：</p>\n<ul><li>selector 只订阅需要字段。</li><li>高频子组件使用 <code>memo(_Foo)</code>。</li><li>useMemo/useCallback 稳定引用。</li><li>frame throttle 合并 preview 更新。</li><li>不对廉价且低频组件盲目 memo。</li></ul>\n<h2 id=\"s-23-8-组件约定\">8. 组件约定</h2>\n<ul><li>业务层优先使用 app-level wrapper。</li><li>Tooltip 使用共享 wrapper。</li><li>破坏性操作用 ConfirmDialog。</li><li>列表必须有空状态与 filtered-empty 状态。</li><li>菜单文字 Title Case，普通 UI sentence case。</li></ul>\n<h2 id=\"s-25-9-实践\">9. 实践</h2>\n<ol><li>为 Thread Store 新增一个纯编辑 action，并补 Undo 测试。</li><li>检查一个组件的 selector 是否订阅整个 Store。</li><li>在 Web Host 下渲染同组件，确保不显示运行按钮。</li><li>为 HostServices 增加 capability 时实现桌面与只读 fallback。</li></ol>","markdown":"# 共享 UI、Host 抽象与状态管理\n\n## 1. packages/ui 分层\n\n```text\nsrc/ui/          shadcn 生成原语\nsrc/components/  业务组件\nsrc/host/        宿主能力接口与 Context\nsrc/lib/         纯工具\nsrc/styles/      Tailwind v4 与设计 Token\n```\n\n包直接导出 TypeScript 源码，不单独 build。内部使用相对 import，避免宿主的 `@/` alias 把路径解析到 `apps/desktop/src`。\n\n## 2. ThreadPlayground\n\n这是核心共享业务 UI，包含 Model、Prompt、Variables、Messages、Tools、Run History、Evaluation 与 Generator。它通过 Props 和 Context 接收 Thread 初值、只读状态、Header action、HostServices 与 ModelClient。\n\n## 3. 每 Thread 一个 Zustand Store\n\n`createThreadStore()` 创建 vanilla Store，再由 Context 提供给组件。State 包含：\n\n- thread / streamingMessage / status。\n- AbortController 与 activeRunId。\n- tool execution IDs。\n- changeHistory / runHistory / evaluations。\n- 所有编辑、运行、Undo、工具结果操作。\n\n每标签一个 Store 避免全局状态互相污染，也让 inactive Pane 保持现场。\n\n## 4. `run()` 的职责\n\nStore Run：\n\n1. 校验模型和消息。\n2. 解析 Skills、文件与 Prompt Variables。\n3. 固定 Runtime Transport 与 Provider Profile。\n4. 调 `streamThread()` 并 reduce events。\n5. 可选自动执行工具。\n6. ReAct 开启时继续下一模型轮次。\n7. 最多 50 轮。\n8. 完成后记录 Run History。\n9. Abort/Error 时恢复一致状态。\n\n流式 chunk 不进入 Undo，整个 Run 折叠成有意义的状态变化。\n\n## 5. HostServices\n\n接口包含 presentational、Transport、Tool execution、Skills、MCP、Built-ins、Plugins、Paths、Files、Generator 和 Actions。\n\nModelClient 单独注入，负责 Provider/Model 查询与修改。分开是因为模型 Context 有自己的缓存与 UI 生命周期。\n\n## 6. Desktop 与 Web\n\n- DesktopHostProvider 提供真实 RPC、Command、文件和 Generator。\n- webHost 设置 `presentational:true`，Transport/Tool/Generator 不可用，文件读取为空。\n\n共享组件必须对不可用能力有明确 UI，而不是依赖调用后抛错。\n\n## 7. React 性能\n\nMessage 和 ToolCall 列表是热路径：\n\n- selector 只订阅需要字段。\n- 高频子组件使用 `memo(_Foo)`。\n- useMemo/useCallback 稳定引用。\n- frame throttle 合并 preview 更新。\n- 不对廉价且低频组件盲目 memo。\n\n## 8. 组件约定\n\n- 业务层优先使用 app-level wrapper。\n- Tooltip 使用共享 wrapper。\n- 破坏性操作用 ConfirmDialog。\n- 列表必须有空状态与 filtered-empty 状态。\n- 菜单文字 Title Case，普通 UI sentence case。\n\n## 9. 实践\n\n1. 为 Thread Store 新增一个纯编辑 action，并补 Undo 测试。\n2. 检查一个组件的 selector 是否订阅整个 Store。\n3. 在 Web Host 下渲染同组件，确保不显示运行按钮。\n4. 为 HostServices 增加 capability 时实现桌面与只读 fallback。\n","text":" 共享 UI、Host 抽象与状态管理 1. packages/ui 分层 text src/ui/ shadcn 生成原语 src/components/ 业务组件 src/host/ 宿主能力接口与 Context src/lib/ 纯工具 src/styles/ Tailwind v4 与设计 Token 包直接导出 TypeScript 源码，不单独 build。内部使用相对 import，避免宿主的 @/ alias 把路径解析到 apps/desktop/src 。 2. ThreadPlayground 这是核心共享业务 UI，包含 Model、Prompt、Variables、Messages、Tools、Run History、Evaluation 与 Generator。它通过 Props 和 Context 接收 Thread 初值、只读状态、Header action、HostServices 与 ModelClient。 3. 每 Thread 一个 Zustand Store createThreadStore 创建 vanilla Store，再由 Context 提供给组件。State 包含： thread / streamingMessage / status。 AbortController 与 activeRunId。 tool execution IDs。 changeHistory / runHistory / evaluations。 所有编辑、运行、Undo、工具结果操作。 每标签一个 Store 避免全局状态互相污染，也让 inactive Pane 保持现场。 4. run 的职责 Store Run： 1. 校验模型和消息。 2. 解析 Skills、文件与 Prompt Variables。 3. 固定 Runtime Transport 与 Provider Profile。 4. 调 streamThread 并 reduce events。 5. 可选自动执行工具。 6. ReAct 开启时继续下一模型轮次。 7. 最多 50 轮。 8. 完成后记录 Run History。 9. Abort/Error 时恢复一致状态。 流式 chunk 不进入 Undo，整个 Run 折叠成有意义的状态变化。 5. HostServices 接口包含 presentational、Transport、Tool execution、Skills、MCP、Built ins、Plugins、Paths、Files、Generator 和 Actions。 ModelClient 单独注入，负责 Provider/Model 查询与修改。分开是因为模型 Context 有自己的缓存与 UI 生命周期。 6. Desktop 与 Web DesktopHostProvider 提供真实 RPC、Command、文件和 Generator。 webHost 设置 presentational:true ，Transport/Tool/Generator 不可用，文件读取为空。 共享组件必须对不可用能力有明确 UI，而不是依赖调用后抛错。 7. React 性能 Message 和 ToolCall 列表是热路径： selector 只订阅需要字段。 高频子组件使用 memo Foo 。 useMemo/useCallback 稳定引用。 frame throttle 合并 preview 更新。 不对廉价且低频组件盲目 memo。 8. 组件约定 业务层优先使用 app level wrapper。 Tooltip 使用共享 wrapper。 破坏性操作用 ConfirmDialog。 列表必须有空状态与 filtered empty 状态。 菜单文字 Title Case，普通 UI sentence case。 9. 实践 1. 为 Thread Store 新增一个纯编辑 action，并补 Undo 测试。 2. 检查一个组件的 selector 是否订阅整个 Store。 3. 在 Web Host 下渲染同组件，确保不显示运行按钮。 4. 为 HostServices 增加 capability 时实现桌面与只读 fallback。 "},{"id":"06-ui-engineering/02-web-sharing","chapterId":"06-ui-engineering","kind":"lesson","title":"Web Viewer、分享与静态站点","description":"apps/web 同时包含：","source":"06-ui-engineering/02-web-sharing.md","level":2,"levelLabel":"实践","prerequisite":"React、状态管理、构建工具","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>Web Viewer、分享与静态站点</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>一个 Vite 应用，两类页面</strong><p>apps/web 同时包含：</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>为什么使用 HashRouter</strong><p>GitHub Pages 对任意深层 URL 不提供 SPA server fallback。Hash 部分不发送给服务器，因此：</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>Viewer 数据链</strong><p>ThreadConnector 抽象资源来源。Gist Reader 返回作者、描述、文件名、raw URL 等 metadata。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>Presentational Host</strong><p>Viewer 使用：</p></div></div></section>","html":"<h1 id=\"s-0-Web-Viewer-分享与静态站点\">Web Viewer、分享与静态站点</h1>\n<h2 id=\"s-1-1-一个-Vite-应用-两类页面\">1. 一个 Vite 应用，两类页面</h2>\n<p><code>apps/web</code> 同时包含：</p>\n<ul><li>Landing：产品介绍与下载。</li><li>Shared Thread Viewer：只读展示 Gist 等连接器中的 Thread。</li></ul>\n<p>Provider 树复用 Theme、ModelProvider、HostServices、Tooltip 与 I18n。</p>\n<h2 id=\"s-5-2-为什么使用-HashRouter\">2. 为什么使用 HashRouter</h2>\n<p>GitHub Pages 对任意深层 URL 不提供 SPA server fallback。Hash 部分不发送给服务器，因此：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">/llm-space/#/shared/gist/threads/&lt;id&gt;</code></pre></div>\n<p>HTTP 始终请求存在的 <code>/llm-space/</code>，React 再解析 hash。</p>\n<h2 id=\"s-9-3-Viewer-数据链\">3. Viewer 数据链</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">route connectorId/threadId\n→ CONNECTORS 查找实现\n→ readShared() 或 readLatestThread()\n→ { thread, meta }\n→ ThreadPlayground readonly</code></pre></div>\n<p><code>ThreadConnector</code> 抽象资源来源。Gist Reader 返回作者、描述、文件名、raw URL 等 metadata。</p>\n<h2 id=\"s-12-4-Presentational-Host\">4. Presentational Host</h2>\n<p>Viewer 使用：</p>\n<ul><li><code>presentational: true</code></li><li>无 Transport</li><li>无 Tool execution</li><li>空 ModelClient</li><li>无文件和 Generator</li><li><code>openLink</code> 仍可安全打开外链</li></ul>\n<p>ThreadPlayground 因此只展示保存证据，不尝试重新运行。</p>\n<h2 id=\"s-16-5-Embedded-与-Fullscreen\">5. Embedded 与 Fullscreen</h2>\n<p>Hash query 的 <code>?embedded</code> 或窄 viewport 进入 chrome-free 模式，适合 iframe。Embedded 决策在打开时固定，避免加载后随 resize 反复闪动图片和布局。</p>\n<h2 id=\"s-18-6-Open-in-App\">6. Open in App</h2>\n<p>Web 构造：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">llm-space://shared/&lt;connectorId&gt;/threads/&lt;threadId&gt;</code></pre></div>\n<p>尝试交给桌面应用；超时则回 Landing 下载页。桌面 Deep Link Handler 读取连接器、写入本地 workspace 并打开。</p>\n<h2 id=\"s-22-7-Landing\">7. Landing</h2>\n<p>Landing 自带 i18n 和发布下载逻辑。<code>useReleases</code> 先展示内置 fallback，再请求 GitHub Releases，网络失败或 rate limit 时仍可下载。部署 base 是 <code>/llm-space/</code>，公共资源路径应使用 <code>import.meta.env.BASE_URL</code>。</p>\n<h2 id=\"s-24-8-GitHub-Pages-发布\">8. GitHub Pages 发布</h2>\n<p><code>.github/workflows/pages.yml</code> 在 main push 后：</p>\n<ol><li>安装锁定依赖。</li><li>build web。</li><li>upload <code>apps/web/dist</code>。</li><li>deploy-pages。</li></ol>\n<p>CI 也 build web，防止合并后才发现 Vite 问题。</p>\n<h2 id=\"s-28-9-安全\">9. 安全</h2>\n<ul><li>外链使用 <code>noopener,noreferrer</code>。</li><li>Viewer 不注入本地文件能力。</li><li>Gist 网络错误与“资源不存在”分开展示。</li><li>Thread 内容按应用现有 Markdown/代码渲染安全策略处理。</li></ul>\n<h2 id=\"s-30-10-实践\">10. 实践</h2>\n<ol><li>本地运行 Viewer，测试正常、rate limit 与不存在三种状态。</li><li>验证直接刷新 hash deep link 返回 HTTP 200。</li><li>新增静态图片并验证 <code>/llm-space/</code> base path。</li><li>从 Web 点击 Open in App，跟踪到桌面 workspace 文件。</li></ol>","markdown":"# Web Viewer、分享与静态站点\n\n## 1. 一个 Vite 应用，两类页面\n\n`apps/web` 同时包含：\n\n- Landing：产品介绍与下载。\n- Shared Thread Viewer：只读展示 Gist 等连接器中的 Thread。\n\nProvider 树复用 Theme、ModelProvider、HostServices、Tooltip 与 I18n。\n\n## 2. 为什么使用 HashRouter\n\nGitHub Pages 对任意深层 URL 不提供 SPA server fallback。Hash 部分不发送给服务器，因此：\n\n```text\n/llm-space/#/shared/gist/threads/<id>\n```\n\nHTTP 始终请求存在的 `/llm-space/`，React 再解析 hash。\n\n## 3. Viewer 数据链\n\n```text\nroute connectorId/threadId\n→ CONNECTORS 查找实现\n→ readShared() 或 readLatestThread()\n→ { thread, meta }\n→ ThreadPlayground readonly\n```\n\n`ThreadConnector` 抽象资源来源。Gist Reader 返回作者、描述、文件名、raw URL 等 metadata。\n\n## 4. Presentational Host\n\nViewer 使用：\n\n- `presentational: true`\n- 无 Transport\n- 无 Tool execution\n- 空 ModelClient\n- 无文件和 Generator\n- `openLink` 仍可安全打开外链\n\nThreadPlayground 因此只展示保存证据，不尝试重新运行。\n\n## 5. Embedded 与 Fullscreen\n\nHash query 的 `?embedded` 或窄 viewport 进入 chrome-free 模式，适合 iframe。Embedded 决策在打开时固定，避免加载后随 resize 反复闪动图片和布局。\n\n## 6. Open in App\n\nWeb 构造：\n\n```text\nllm-space://shared/<connectorId>/threads/<threadId>\n```\n\n尝试交给桌面应用；超时则回 Landing 下载页。桌面 Deep Link Handler 读取连接器、写入本地 workspace 并打开。\n\n## 7. Landing\n\nLanding 自带 i18n 和发布下载逻辑。`useReleases` 先展示内置 fallback，再请求 GitHub Releases，网络失败或 rate limit 时仍可下载。部署 base 是 `/llm-space/`，公共资源路径应使用 `import.meta.env.BASE_URL`。\n\n## 8. GitHub Pages 发布\n\n`.github/workflows/pages.yml` 在 main push 后：\n\n1. 安装锁定依赖。\n2. build web。\n3. upload `apps/web/dist`。\n4. deploy-pages。\n\nCI 也 build web，防止合并后才发现 Vite 问题。\n\n## 9. 安全\n\n- 外链使用 `noopener,noreferrer`。\n- Viewer 不注入本地文件能力。\n- Gist 网络错误与“资源不存在”分开展示。\n- Thread 内容按应用现有 Markdown/代码渲染安全策略处理。\n\n## 10. 实践\n\n1. 本地运行 Viewer，测试正常、rate limit 与不存在三种状态。\n2. 验证直接刷新 hash deep link 返回 HTTP 200。\n3. 新增静态图片并验证 `/llm-space/` base path。\n4. 从 Web 点击 Open in App，跟踪到桌面 workspace 文件。\n","text":" Web Viewer、分享与静态站点 1. 一个 Vite 应用，两类页面 apps/web 同时包含： Landing：产品介绍与下载。 Shared Thread Viewer：只读展示 Gist 等连接器中的 Thread。 Provider 树复用 Theme、ModelProvider、HostServices、Tooltip 与 I18n。 2. 为什么使用 HashRouter GitHub Pages 对任意深层 URL 不提供 SPA server fallback。Hash 部分不发送给服务器，因此： text /llm space/ /shared/gist/threads/<id HTTP 始终请求存在的 /llm space/ ，React 再解析 hash。 3. Viewer 数据链 text route connectorId/threadId → CONNECTORS 查找实现 → readShared 或 readLatestThread → { thread, meta } → ThreadPlayground readonly ThreadConnector 抽象资源来源。Gist Reader 返回作者、描述、文件名、raw URL 等 metadata。 4. Presentational Host Viewer 使用： presentational: true 无 Transport 无 Tool execution 空 ModelClient 无文件和 Generator openLink 仍可安全打开外链 ThreadPlayground 因此只展示保存证据，不尝试重新运行。 5. Embedded 与 Fullscreen Hash query 的 ?embedded 或窄 viewport 进入 chrome free 模式，适合 iframe。Embedded 决策在打开时固定，避免加载后随 resize 反复闪动图片和布局。 6. Open in App Web 构造： text llm space://shared/<connectorId /threads/<threadId 尝试交给桌面应用；超时则回 Landing 下载页。桌面 Deep Link Handler 读取连接器、写入本地 workspace 并打开。 7. Landing Landing 自带 i18n 和发布下载逻辑。 useReleases 先展示内置 fallback，再请求 GitHub Releases，网络失败或 rate limit 时仍可下载。部署 base 是 /llm space/ ，公共资源路径应使用 import.meta.env.BASE URL 。 8. GitHub Pages 发布 .github/workflows/pages.yml 在 main push 后： 1. 安装锁定依赖。 2. build web。 3. upload apps/web/dist 。 4. deploy pages。 CI 也 build web，防止合并后才发现 Vite 问题。 9. 安全 外链使用 noopener,noreferrer 。 Viewer 不注入本地文件能力。 Gist 网络错误与“资源不存在”分开展示。 Thread 内容按应用现有 Markdown/代码渲染安全策略处理。 10. 实践 1. 本地运行 Viewer，测试正常、rate limit 与不存在三种状态。 2. 验证直接刷新 hash deep link 返回 HTTP 200。 3. 新增静态图片并验证 /llm space/ base path。 4. 从 Web 点击 Open in App，跟踪到桌面 workspace 文件。 "},{"id":"06-ui-engineering/03-quality-release-practicum","chapterId":"06-ui-engineering","kind":"lesson","title":"测试、发布与毕业开发任务","description":"一次完整验证：","source":"06-ui-engineering/03-quality-release-practicum.md","level":2,"levelLabel":"实践","prerequisite":"React、状态管理、构建工具","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>测试、发布与毕业开发任务</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>质量门禁</strong><p>一次完整验证：</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>测试策略</strong><p>使用小型单测覆盖 schema、normalizer、reducer、模板和历史不变量。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>发布链</strong><p>版本唯一来源是 apps/desktop/package.json。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>两个桌面版本</strong><p>二者不同 bundle ID 与 update feed，但共享 /.llm-space。x64 签名前有 headerpad 修复 Hook；不要在未验证 Mach-O 的情况下扩大扫描范围。</p></div></div></section>","html":"<h1 id=\"s-0-测试-发布与毕业开发任务\">测试、发布与毕业开发任务</h1>\n<h2 id=\"s-1-1-质量门禁\">1. 质量门禁</h2>\n<p>一次完整验证：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-bash\">mise run test\nmise run lint\nmise run typecheck\nmise run build:web</code></pre></div>\n<p>桌面相关改动还应执行 Renderer build；发布前 Lint 必须零 warning。</p>\n<h2 id=\"s-5-2-测试策略\">2. 测试策略</h2>\n<h3 id=\"s-6-纯领域逻辑\">纯领域逻辑</h3>\n<p>使用小型单测覆盖 schema、normalizer、reducer、模板和历史不变量。</p>\n<h3 id=\"s-8-Manager-Registry\">Manager/Registry</h3>\n<p>用临时目录与 fake dependency 覆盖配置损坏、冲突、缓存失效和 shutdown。</p>\n<h3 id=\"s-10-跨边界协议\">跨边界协议</h3>\n<p>覆盖 request/response shape、错误 envelope、事件顺序、Abort、版本不兼容。</p>\n<h3 id=\"s-12-React\">React</h3>\n<p>关注用户可观察行为、Store 生命周期、竞态与 Runtime ownership，不对实现细节做脆弱 snapshot。</p>\n<h3 id=\"s-14-构建\">构建</h3>\n<p>Web/Electrobun bundling 问题可能不被 TypeScript 发现，因此 CI 必须实际生产构建。</p>\n<h2 id=\"s-16-3-发布链\">3. 发布链</h2>\n<p>版本唯一来源是 <code>apps/desktop/package.json</code>。</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">mise run release\n→ 检查 main/clean/sync\n→ conventional version + tag\n→ 原子 push\n→ release workflow\n→ arm64/x64 × regular/performance\n→ 签名、公证、smoke\n→ rolling update feed + versioned release</code></pre></div>\n<p>稳定版需要手工维护 <code>CHANGELOG.md</code> 对应版本。Rolling <code>updates</code> release 的 patch 文件不能删除，旧客户端可能依赖增量升级链。</p>\n<h2 id=\"s-20-4-两个桌面版本\">4. 两个桌面版本</h2>\n<ul><li>Regular 使用系统 WebView，体积小。</li><li>Performance 内嵌 CEF，渲染一致。</li></ul>\n<p>二者不同 bundle ID 与 update feed，但共享 <code>~/.llm-space</code>。x64 签名前有 headerpad 修复 Hook；不要在未验证 Mach-O 的情况下扩大扫描范围。</p>\n<h2 id=\"s-23-5-一次合格改动的流程\">5. 一次合格改动的流程</h2>\n<ol><li>从用户行为写出验收标准。</li><li>找到边界类型和组合根。</li><li>先补最靠近不变量的测试。</li><li>做最小实现，不跨层偷依赖。</li><li>运行 focused tests。</li><li>运行 typecheck/lint/build。</li><li>用真实桌面 Renderer 验证。</li><li>更新用户文档、AGENTS/RFC/CHANGELOG 中受影响事实。</li></ol>\n<h2 id=\"s-25-6-毕业任务-新增-Runtime-Scoped-工具能力\">6. 毕业任务：新增 Runtime Scoped 工具能力</h2>\n<p>建议实现一个只读的“项目信息” Built-in Tool：</p>\n<ol><li>在 Runtime Tool Module 定义 schema 与 handler。</li><li>通过 ToolRegistry 注册并测试重复名/freeze。</li><li>在 Host Tool 列表中可导入 Thread。</li><li>执行路径携带 runtimeId。</li><li>本地返回本机信息，Remote 返回远端信息。</li><li>Tool Call Output 可持久化、回放和分享。</li><li>添加权限/错误/超长输出处理。</li><li>补 Registry、RPC、Remote contract 与 UI 测试。</li></ol>\n<p>这个任务会迫使你贯穿 Core Tool 类型、Runtime Registry、Desktop RPC、HostServices、Thread Store、Remote Server 与 UI。</p>\n<h2 id=\"s-29-7-备选毕业任务\">7. 备选毕业任务</h2>\n<ul><li>新增一个 Parser，并导入第三方对话格式。</li><li>新增一个只读 Thread Storage Connector。</li><li>新增一个 Trace 导入来源。</li><li>为现有 Runtime capability 增加 Remote 支持。</li></ul>\n<h2 id=\"s-31-8-最终掌握检查表\">8. 最终掌握检查表</h2>\n<ul><li>能从 <code>startDesktopApp()</code> 解释完整对象图和关闭顺序。</li><li>能从 Run 按钮追到 Provider Event 再返回 React。</li><li>能解释 Thread JSON 的兼容、恢复、图片与原子写入。</li><li>能区分五类工具的执行所有权。</li><li>能新增 Runtime 方法并同步协议。</li><li>能定位 Remote 连接每个阶段。</li><li>能在共享 UI 中不引入 Electrobun。</li><li>能选择正确测试层并完成发布前门禁。</li></ul>\n<p>达到这些标准后，你已经具备独立开发 LLM Space 主流程功能的能力。</p>","markdown":"# 测试、发布与毕业开发任务\n\n## 1. 质量门禁\n\n一次完整验证：\n\n```bash\nmise run test\nmise run lint\nmise run typecheck\nmise run build:web\n```\n\n桌面相关改动还应执行 Renderer build；发布前 Lint 必须零 warning。\n\n## 2. 测试策略\n\n### 纯领域逻辑\n\n使用小型单测覆盖 schema、normalizer、reducer、模板和历史不变量。\n\n### Manager/Registry\n\n用临时目录与 fake dependency 覆盖配置损坏、冲突、缓存失效和 shutdown。\n\n### 跨边界协议\n\n覆盖 request/response shape、错误 envelope、事件顺序、Abort、版本不兼容。\n\n### React\n\n关注用户可观察行为、Store 生命周期、竞态与 Runtime ownership，不对实现细节做脆弱 snapshot。\n\n### 构建\n\nWeb/Electrobun bundling 问题可能不被 TypeScript 发现，因此 CI 必须实际生产构建。\n\n## 3. 发布链\n\n版本唯一来源是 `apps/desktop/package.json`。\n\n```text\nmise run release\n→ 检查 main/clean/sync\n→ conventional version + tag\n→ 原子 push\n→ release workflow\n→ arm64/x64 × regular/performance\n→ 签名、公证、smoke\n→ rolling update feed + versioned release\n```\n\n稳定版需要手工维护 `CHANGELOG.md` 对应版本。Rolling `updates` release 的 patch 文件不能删除，旧客户端可能依赖增量升级链。\n\n## 4. 两个桌面版本\n\n- Regular 使用系统 WebView，体积小。\n- Performance 内嵌 CEF，渲染一致。\n\n二者不同 bundle ID 与 update feed，但共享 `~/.llm-space`。x64 签名前有 headerpad 修复 Hook；不要在未验证 Mach-O 的情况下扩大扫描范围。\n\n## 5. 一次合格改动的流程\n\n1. 从用户行为写出验收标准。\n2. 找到边界类型和组合根。\n3. 先补最靠近不变量的测试。\n4. 做最小实现，不跨层偷依赖。\n5. 运行 focused tests。\n6. 运行 typecheck/lint/build。\n7. 用真实桌面 Renderer 验证。\n8. 更新用户文档、AGENTS/RFC/CHANGELOG 中受影响事实。\n\n## 6. 毕业任务：新增 Runtime Scoped 工具能力\n\n建议实现一个只读的“项目信息” Built-in Tool：\n\n1. 在 Runtime Tool Module 定义 schema 与 handler。\n2. 通过 ToolRegistry 注册并测试重复名/freeze。\n3. 在 Host Tool 列表中可导入 Thread。\n4. 执行路径携带 runtimeId。\n5. 本地返回本机信息，Remote 返回远端信息。\n6. Tool Call Output 可持久化、回放和分享。\n7. 添加权限/错误/超长输出处理。\n8. 补 Registry、RPC、Remote contract 与 UI 测试。\n\n这个任务会迫使你贯穿 Core Tool 类型、Runtime Registry、Desktop RPC、HostServices、Thread Store、Remote Server 与 UI。\n\n## 7. 备选毕业任务\n\n- 新增一个 Parser，并导入第三方对话格式。\n- 新增一个只读 Thread Storage Connector。\n- 新增一个 Trace 导入来源。\n- 为现有 Runtime capability 增加 Remote 支持。\n\n## 8. 最终掌握检查表\n\n- 能从 `startDesktopApp()` 解释完整对象图和关闭顺序。\n- 能从 Run 按钮追到 Provider Event 再返回 React。\n- 能解释 Thread JSON 的兼容、恢复、图片与原子写入。\n- 能区分五类工具的执行所有权。\n- 能新增 Runtime 方法并同步协议。\n- 能定位 Remote 连接每个阶段。\n- 能在共享 UI 中不引入 Electrobun。\n- 能选择正确测试层并完成发布前门禁。\n\n达到这些标准后，你已经具备独立开发 LLM Space 主流程功能的能力。\n","text":" 测试、发布与毕业开发任务 1. 质量门禁 一次完整验证： bash mise run test mise run lint mise run typecheck mise run build:web 桌面相关改动还应执行 Renderer build；发布前 Lint 必须零 warning。 2. 测试策略 纯领域逻辑 使用小型单测覆盖 schema、normalizer、reducer、模板和历史不变量。 Manager/Registry 用临时目录与 fake dependency 覆盖配置损坏、冲突、缓存失效和 shutdown。 跨边界协议 覆盖 request/response shape、错误 envelope、事件顺序、Abort、版本不兼容。 React 关注用户可观察行为、Store 生命周期、竞态与 Runtime ownership，不对实现细节做脆弱 snapshot。 构建 Web/Electrobun bundling 问题可能不被 TypeScript 发现，因此 CI 必须实际生产构建。 3. 发布链 版本唯一来源是 apps/desktop/package.json 。 text mise run release → 检查 main/clean/sync → conventional version + tag → 原子 push → release workflow → arm64/x64 × regular/performance → 签名、公证、smoke → rolling update feed + versioned release 稳定版需要手工维护 CHANGELOG.md 对应版本。Rolling updates release 的 patch 文件不能删除，旧客户端可能依赖增量升级链。 4. 两个桌面版本 Regular 使用系统 WebView，体积小。 Performance 内嵌 CEF，渲染一致。 二者不同 bundle ID 与 update feed，但共享 ~/.llm space 。x64 签名前有 headerpad 修复 Hook；不要在未验证 Mach O 的情况下扩大扫描范围。 5. 一次合格改动的流程 1. 从用户行为写出验收标准。 2. 找到边界类型和组合根。 3. 先补最靠近不变量的测试。 4. 做最小实现，不跨层偷依赖。 5. 运行 focused tests。 6. 运行 typecheck/lint/build。 7. 用真实桌面 Renderer 验证。 8. 更新用户文档、AGENTS/RFC/CHANGELOG 中受影响事实。 6. 毕业任务：新增 Runtime Scoped 工具能力 建议实现一个只读的“项目信息” Built in Tool： 1. 在 Runtime Tool Module 定义 schema 与 handler。 2. 通过 ToolRegistry 注册并测试重复名/freeze。 3. 在 Host Tool 列表中可导入 Thread。 4. 执行路径携带 runtimeId。 5. 本地返回本机信息，Remote 返回远端信息。 6. Tool Call Output 可持久化、回放和分享。 7. 添加权限/错误/超长输出处理。 8. 补 Registry、RPC、Remote contract 与 UI 测试。 这个任务会迫使你贯穿 Core Tool 类型、Runtime Registry、Desktop RPC、HostServices、Thread Store、Remote Server 与 UI。 7. 备选毕业任务 新增一个 Parser，并导入第三方对话格式。 新增一个只读 Thread Storage Connector。 新增一个 Trace 导入来源。 为现有 Runtime capability 增加 Remote 支持。 8. 最终掌握检查表 能从 startDesktopApp 解释完整对象图和关闭顺序。 能从 Run 按钮追到 Provider Event 再返回 React。 能解释 Thread JSON 的兼容、恢复、图片与原子写入。 能区分五类工具的执行所有权。 能新增 Runtime 方法并同步协议。 能定位 Remote 连接每个阶段。 能在共享 UI 中不引入 Electrobun。 能选择正确测试层并完成发布前门禁。 达到这些标准后，你已经具备独立开发 LLM Space 主流程功能的能力。 "}],"chapters":[["00-foundations","零基础预备","程序、前端、异步与 Agent 基础"],["01-learning-map","全局地图","从产品概念到完整调用链"],["02-core-domain","Core 领域层","Thread、流式协议、模板与存储"],["03-agent-runtime","Agent Runtime","模型、工具、MCP、Skills 与插件"],["04-deskto
