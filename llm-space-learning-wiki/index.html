\"\n        transform=\"translate(690 48)\">\n        <rect width=\"120\" height=\"80\" rx=\"8\"></rect>\n        <circle cx=\"20\" cy=\"20\" r=\"8\"></circle>\n        <text class=\"node-title\" text-anchor=\"middle\"><tspan x=\"60\" y=\"41\">Core</tspan></text>\n      </g>\n    </svg>\n    <div class=\"visual-legend\"><button class=\"visual-legend-button active\" data-title=\"UI\" data-description=\"接收用户操作\"><span>1</span>UI</button><button class=\"visual-legend-button\" data-title=\"Transport\" data-description=\"跨边界传递请求\"><span>2</span>Transport</button><button class=\"visual-legend-button\" data-title=\"Runtime\" data-description=\"管理真实能力\"><span>3</span>Runtime</button><button class=\"visual-legend-button\" data-title=\"Core\" data-description=\"执行与持久化\"><span>4</span>Core</button></div>\n    <div class=\"visual-detail\"><strong>UI：</strong><span>接收用户操作</span></div>\n  </div>","html":"<h1 id=\"s-0-LLM-Space-4-完全开发课程\">LLM Space 4 完全开发课程</h1>\n<h2 id=\"s-1-你将学到什么\">你将学到什么</h2>\n<p>这不是 API 清单，而是一条可执行的分级学习路径。没有开发经验的读者先完成零基础预备课；初级开发者可以从全局地图开始，再逐步进入 Agent 流式运行、工具执行、桌面双进程、SSH Remote Runtime 与工程发布。每节均提供概念图、类比、关键源码位置、常见误区和动手练习。</p>\n<h2 id=\"s-3-推荐学习顺序\">推荐学习顺序</h2>\n<ol><li><strong>补齐基础</strong>：程序、JSON、TypeScript、React、异步、Agent 和 MCP。</li><li><strong>建立地图</strong>：理解 Thread、Runtime 和三大边界接口。</li><li><strong>掌握 Core</strong>：阅读数据模型、流式 reducer、模板和原子存储。</li><li><strong>进入 Runtime</strong>：掌握模型、MCP、Tools、Skills、Plugins 与 Trace。</li><li><strong>拆解桌面端与远程端</strong>：跟踪 RPC、Tabs、SSH、Server 和持久化。</li><li><strong>独立交付功能</strong>：完成共享 UI、测试、构建和发布实践。</li></ol>\n<h2 id=\"s-5-如何使用本课程\">如何使用本课程</h2>\n<ul><li>从左侧按顺序阅读，完成专题后点击“标记完成”。</li><li>使用顶部全文搜索定位函数、类型、协议或开发流程。</li><li>每节可在页面内查看对应 Markdown 源文档。</li><li>先完成章节练习，再进入下一章；遇到概念时返回全局地图复习主链路。</li></ul>\n<h2 id=\"s-7-掌握标准\">掌握标准</h2>\n<p>最终你应能从 Run 按钮完整追踪到 Provider Event，再返回 React UI；能安全修改 Thread schema 和 Remote protocol；能新增 Runtime Scoped 能力，并为本地、远程、共享 UI 和发布链补齐验证。</p>","markdown":"# LLM Space 4 完全开发课程\n\n## 你将学到什么\n\n这不是 API 清单，而是一条可执行的分级学习路径。没有开发经验的读者先完成零基础预备课；初级开发者可以从全局地图开始，再逐步进入 Agent 流式运行、工具执行、桌面双进程、SSH Remote Runtime 与工程发布。每节均提供概念图、类比、关键源码位置、常见误区和动手练习。\n\n## 推荐学习顺序\n\n1. **补齐基础**：程序、JSON、TypeScript、React、异步、Agent 和 MCP。\n2. **建立地图**：理解 Thread、Runtime 和三大边界接口。\n3. **掌握 Core**：阅读数据模型、流式 reducer、模板和原子存储。\n4. **进入 Runtime**：掌握模型、MCP、Tools、Skills、Plugins 与 Trace。\n5. **拆解桌面端与远程端**：跟踪 RPC、Tabs、SSH、Server 和持久化。\n6. **独立交付功能**：完成共享 UI、测试、构建和发布实践。\n\n## 如何使用本课程\n\n- 从左侧按顺序阅读，完成专题后点击“标记完成”。\n- 使用顶部全文搜索定位函数、类型、协议或开发流程。\n- 每节可在页面内查看对应 Markdown 源文档。\n- 先完成章节练习，再进入下一章；遇到概念时返回全局地图复习主链路。\n\n## 掌握标准\n\n最终你应能从 Run 按钮完整追踪到 Provider Event，再返回 React UI；能安全修改 Thread schema 和 Remote protocol；能新增 Runtime Scoped 能力，并为本地、远程、共享 UI 和发布链补齐验证。","text":"LLM Space 完全开发课程 Thread Runtime Agent Electrobun Remote Runtime UI 测试 发布 学习路径"},{"id":"00-foundations","chapterId":"00-foundations","kind":"chapter","title":"第零章：零基础预备课","description":"这一章专门服务没有编程经验或刚入门的读者。你不需要先记住所有语法，只需要建立几个能反复使用的心智模型：程序如何保存数据、模块如何协作、异步任务为什么需要等待和取消、界面如何随状态变化，以及 AI Agent 如何在模型与工具之间循环。","source":"00-foundations.md","level":0,"levelLabel":"零基础","prerequisite":"无","duration":"10 分钟","visual":"<section class=\"chapter-guide\"><div class=\"chapter-guide-head\"><div><span>章节导读</span><strong>第零章：零基础预备课</strong></div><p>按以下顺序完成本章课程。每一项都对应一篇独立学习材料。</p></div><div class=\"chapter-guide-grid\"><a class=\"chapter-guide-card\" href=\"#00-foundations/01-programs-files-json\"><span class=\"chapter-guide-number\">01</span><div><strong>程序、文件与 JSON</strong><p>程序可以理解为一份非常精确的操作说明。代码是说明书，运行时负责照着执行，数据是执行过程中读取和产生的内容。</p></div><span class=\"chapter-guide-action\">35 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#00-foundations/02-javascript-typescript-modules\"><span class=\"chapter-guide-number\">02</span><div><strong>JavaScript、TypeScript 与模块</strong><p>JavaScript 是运行时真正执行的语言。TypeScript 在 JavaScript 上增加类型标注和开发工具，帮助编辑器和编译器提前发现错误，最终仍转换为 JavaScript。</p></div><span class=\"chapter-guide-action\">35 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#00-foundations/03-react-state-ui\"><span class=\"chapter-guide-number\">03</span><div><strong>React、状态与界面更新</strong><p>React 把界面拆成组件。组件接收 Props，并返回界面描述：</p></div><span class=\"chapter-guide-action\">35 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#00-foundations/04-async-network-streams\"><span class=\"chapter-guide-number\">04</span><div><strong>异步、网络、RPC 与流</strong><p>同步像在柜台排队：前一件事结束，才处理下一件。异步像取号：提交任务后可以做别的，结果准备好再回来处理。</p></div><span class=\"chapter-guide-action\">35 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#00-foundations/05-llm-agent-mcp\"><span class=\"chapter-guide-number\">05</span><div><strong>LLM、Agent、Tools 与 MCP</strong><p>大语言模型接收一串上下文 token，并预测接下来最合适的输出。它没有自动访问本机文件、数据库或浏览器的能力；这些能力必须由应用通过工具接入。</p></div><span class=\"chapter-guide-action\">35 分钟 · 进入课程 →</span></a></div></section>","html":"<h1 id=\"s-0-第零章-零基础预备课\">第零章：零基础预备课</h1>\n<p>这一章专门服务没有编程经验或刚入门的读者。你不需要先记住所有语法，只需要建立几个能反复使用的心智模型：程序如何保存数据、模块如何协作、异步任务为什么需要等待和取消、界面如何随状态变化，以及 AI Agent 如何在模型与工具之间循环。</p>\n<h2 id=\"s-2-先选你的起点\">先选你的起点</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>你的情况</th><th>建议</th></tr></thead><tbody><tr><td>没写过代码</td><td>按顺序完成本章五节，再进入第一章</td></tr><tr><td>写过少量 JavaScript</td><td>快速完成第 1、2、4、5 节</td></tr><tr><td>熟悉前端但不了解 Agent</td><td>重点学习第 4、5 节</td></tr><tr><td>已有项目开发经验</td><td>用本章作术语表，直接从第一章开始</td></tr></tbody></table></div>\n<h2 id=\"s-4-本章学习目标\">本章学习目标</h2>\n<ul><li>看懂变量、对象、数组、函数、模块和 JSON 的基本形式。</li><li>理解 TypeScript 类型是“开发期检查”，磁盘和网络数据仍需运行时校验。</li><li>理解 React 组件、Props、State、Context 与 Store 的分工。</li><li>理解 Promise、异步迭代、HTTP、RPC、SSE 和取消。</li><li>理解 LLM、Prompt、Token、Tool Call、ReAct、MCP 和 Agent Runtime。</li></ul>\n<h2 id=\"s-6-学习方法\">学习方法</h2>\n<p>每节先看图和类比，再运行最小示例。第一次阅读不要求记住 API 名称；当后续源码再次出现这些词时，回来复习对应卡片即可。</p>\n<h2 id=\"s-8-子课程\">子课程</h2>\n<ul><li><a href=\"00-foundations/01-programs-files-json.md\" data-wiki-link=\"00-foundations/01-programs-files-json.md\">程序、文件与 JSON</a></li><li><a href=\"00-foundations/02-javascript-typescript-modules.md\" data-wiki-link=\"00-foundations/02-javascript-typescript-modules.md\">JavaScript、TypeScript 与模块</a></li><li><a href=\"00-foundations/03-react-state-ui.md\" data-wiki-link=\"00-foundations/03-react-state-ui.md\">React、状态与界面更新</a></li><li><a href=\"00-foundations/04-async-network-streams.md\" data-wiki-link=\"00-foundations/04-async-network-streams.md\">异步、网络、RPC 与流</a></li><li><a href=\"00-foundations/05-llm-agent-mcp.md\" data-wiki-link=\"00-foundations/05-llm-agent-mcp.md\">LLM、Agent、Tools 与 MCP</a></li></ul>","markdown":"# 第零章：零基础预备课\n\n这一章专门服务没有编程经验或刚入门的读者。你不需要先记住所有语法，只需要建立几个能反复使用的心智模型：程序如何保存数据、模块如何协作、异步任务为什么需要等待和取消、界面如何随状态变化，以及 AI Agent 如何在模型与工具之间循环。\n\n## 先选你的起点\n\n| 你的情况 | 建议 |\n| --- | --- |\n| 没写过代码 | 按顺序完成本章五节，再进入第一章 |\n| 写过少量 JavaScript | 快速完成第 1、2、4、5 节 |\n| 熟悉前端但不了解 Agent | 重点学习第 4、5 节 |\n| 已有项目开发经验 | 用本章作术语表，直接从第一章开始 |\n\n## 本章学习目标\n\n- 看懂变量、对象、数组、函数、模块和 JSON 的基本形式。\n- 理解 TypeScript 类型是“开发期检查”，磁盘和网络数据仍需运行时校验。\n- 理解 React 组件、Props、State、Context 与 Store 的分工。\n- 理解 Promise、异步迭代、HTTP、RPC、SSE 和取消。\n- 理解 LLM、Prompt、Token、Tool Call、ReAct、MCP 和 Agent Runtime。\n\n## 学习方法\n\n每节先看图和类比，再运行最小示例。第一次阅读不要求记住 API 名称；当后续源码再次出现这些词时，回来复习对应卡片即可。\n\n## 子课程\n\n- [程序、文件与 JSON](00-foundations/01-programs-files-json.md)\n- [JavaScript、TypeScript 与模块](00-foundations/02-javascript-typescript-modules.md)\n- [React、状态与界面更新](00-foundations/03-react-state-ui.md)\n- [异步、网络、RPC 与流](00-foundations/04-async-network-streams.md)\n- [LLM、Agent、Tools 与 MCP](00-foundations/05-llm-agent-mcp.md)\n","text":" 第零章：零基础预备课 这一章专门服务没有编程经验或刚入门的读者。你不需要先记住所有语法，只需要建立几个能反复使用的心智模型：程序如何保存数据、模块如何协作、异步任务为什么需要等待和取消、界面如何随状态变化，以及 AI Agent 如何在模型与工具之间循环。 先选你的起点 你的情况 建议 没写过代码 按顺序完成本章五节，再进入第一章 写过少量 JavaScript 快速完成第 1、2、4、5 节 熟悉前端但不了解 Agent 重点学习第 4、5 节 已有项目开发经验 用本章作术语表，直接从第一章开始 本章学习目标 看懂变量、对象、数组、函数、模块和 JSON 的基本形式。 理解 TypeScript 类型是“开发期检查”，磁盘和网络数据仍需运行时校验。 理解 React 组件、Props、State、Context 与 Store 的分工。 理解 Promise、异步迭代、HTTP、RPC、SSE 和取消。 理解 LLM、Prompt、Token、Tool Call、ReAct、MCP 和 Agent Runtime。 学习方法 每节先看图和类比，再运行最小示例。第一次阅读不要求记住 API 名称；当后续源码再次出现这些词时，回来复习对应卡片即可。 子课程 程序、文件与 JSON 00 foundations/01 programs files json.md JavaScript、TypeScript 与模块 00 foundations/02 javascript typescript modules.md React、状态与界面更新 00 foundations/03 react state ui.md 异步、网络、RPC 与流 00 foundations/04 async network streams.md LLM、Agent、Tools 与 MCP 00 foundations/05 llm agent mcp.md "},{"id":"00-foundations/01-programs-files-json","chapterId":"00-foundations","kind":"lesson","title":"程序、文件与 JSON","description":"程序可以理解为一份非常精确的操作说明。代码是说明书，运行时负责照着执行，数据是执行过程中读取和产生的内容。","source":"00-foundations/01-programs-files-json.md","level":0,"levelLabel":"零基础","prerequisite":"无","duration":"35 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>程序、文件与 JSON</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>程序到底是什么</strong><p>程序可以理解为一份非常精确的操作说明。代码是说明书，运行时负责照着执行，数据是执行过程中读取和产生的内容。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>值、变量与对象</strong><p>变量是给一个值起名字：</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>JSON 是数据交换格式</strong><p>JSON 只描述数据，不描述函数和行为：</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>内存状态与磁盘状态</strong><p>用户编辑 Thread 时，React Store 先更新内存；稍后持久化层再写磁盘。两者不是同一件事：</p></div></div></section>","html":"<h1 id=\"s-0-程序-文件与-JSON\">程序、文件与 JSON</h1>\n<aside class=\"callout\">难度：零基础 · 建议用时：25 分钟 · 不要求编程经验</aside>\n<h2 id=\"s-2-1-程序到底是什么\">1. 程序到底是什么</h2>\n<p>程序可以理解为一份非常精确的操作说明。代码是说明书，运行时负责照着执行，数据是执行过程中读取和产生的内容。</p>\n<p>用餐厅类比：</p>\n<ul><li><strong>代码</strong>像菜谱，描述步骤。</li><li><strong>运行时</strong>像厨房，真正执行步骤。</li><li><strong>数据</strong>像食材和订单。</li><li><strong>文件</strong>像仓库中的长期记录，厨房关闭后仍存在。</li><li><strong>内存</strong>像操作台，速度快，但程序退出后内容通常消失。</li></ul>\n<p>LLM Space 使用 TypeScript 编写；Bun 和浏览器分别执行其中不同部分。</p>\n<h2 id=\"s-7-2-值-变量与对象\">2. 值、变量与对象</h2>\n<p>变量是给一个值起名字：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">const title = &quot;我的第一个 Thread&quot;;\nconst messageCount = 3;\nconst isRunning = false;</code></pre></div>\n<p>对象把有关联的值放在一起：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">const thread = {\n  title: &quot;我的第一个 Thread&quot;,\n  model: &quot;gpt-4.1&quot;,\n  messages: [],\n};</code></pre></div>\n<p>数组是有顺序的一组值。<code>messages: []</code> 表示消息列表暂时为空。</p>\n<h2 id=\"s-13-3-JSON-是数据交换格式\">3. JSON 是数据交换格式</h2>\n<p>JSON 只描述数据，不描述函数和行为：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-json\">{\n  &quot;title&quot;: &quot;我的第一个 Thread&quot;,\n  &quot;messages&quot;: [\n    { &quot;role&quot;: &quot;user&quot;, &quot;text&quot;: &quot;你好&quot; }\n  ]\n}</code></pre></div>\n<p>它像跨语言都能看懂的标准表格。LLM Space 用 JSON 保存 Thread 和设置，也用 JSON-RPC 在进程或机器间发送请求。</p>\n<h2 id=\"s-17-4-内存状态与磁盘状态\">4. 内存状态与磁盘状态</h2>\n<p>用户编辑 Thread 时，React Store 先更新内存；稍后持久化层再写磁盘。两者不是同一件事：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">用户输入\n→ 内存中的 Thread 更新\n→ 界面立即变化\n→ 防抖与串行保存\n→ workspace/*.json</code></pre></div>\n<p>如果写盘过程中突然断电，文件可能只写了一半。因此项目采用“写临时文件，再原子重命名”的方式。</p>\n<h2 id=\"s-21-5-路径与目录\">5. 路径与目录</h2>\n<p>路径描述文件位置：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">~/.llm-space/workspace/demo.json</code></pre></div>\n<ul><li><code>~</code> 表示当前用户主目录。</li><li><code>/</code> 分隔目录。</li><li><code>demo.json</code> 是文件名。</li><li>相对路径从某个已知根目录开始，绝对路径从文件系统根开始。</li></ul>\n<p>Workspace API 限制在工作区内，Agent 文件工具则可能访问更广范围，所以权限和确认非常重要。</p>\n<h2 id=\"s-26-6-在源码中找到它们\">6. 在源码中找到它们</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>概念</th><th>项目位置</th></tr></thead><tbody><tr><td>Thread 数据结构</td><td><code>packages/core/src/types/threads/thread.ts</code></td></tr><tr><td>磁盘读写</td><td><code>packages/core/src/server/storage/local/file-system.ts</code></td></tr><tr><td>内存 Store</td><td><code>packages/ui/.../stores/thread-store.ts</code></td></tr><tr><td>工作区目录</td><td><code>~/.llm-space/workspace/</code></td></tr></tbody></table></div>\n<h2 id=\"s-28-7-动手练习\">7. 动手练习</h2>\n<ol><li>在文本编辑器中新建一个合法 JSON 对象。</li><li>故意删除一个逗号，观察 JSON 校验器报错。</li><li>在 LLM Space 工作区找到一个 Thread 文件，辨认 title、model、context 和 messages。</li></ol>\n<h2 id=\"s-30-8-理解自测\">8. 理解自测</h2>\n<p><strong>问题：为什么 TypeScript 类型不能保证磁盘 JSON 一定正确？</strong></p>\n<p>答案：类型检查发生在开发和构建阶段；用户文件、旧版本文件或损坏文件是在运行时进入程序的，因此还需要 Zod/TypeBox 等运行时校验。</p>\n<p><strong>问题：为什么界面已经变化，不代表文件一定保存成功？</strong></p>\n<p>答案：界面读取的是内存状态，磁盘写入是稍后发生的异步副作用。</p>","markdown":"# 程序、文件与 JSON\n\n> 难度：零基础 · 建议用时：25 分钟 · 不要求编程经验\n\n## 1. 程序到底是什么\n\n程序可以理解为一份非常精确的操作说明。代码是说明书，运行时负责照着执行，数据是执行过程中读取和产生的内容。\n\n用餐厅类比：\n\n- **代码**像菜谱，描述步骤。\n- **运行时**像厨房，真正执行步骤。\n- **数据**像食材和订单。\n- **文件**像仓库中的长期记录，厨房关闭后仍存在。\n- **内存**像操作台，速度快，但程序退出后内容通常消失。\n\nLLM Space 使用 TypeScript 编写；Bun 和浏览器分别执行其中不同部分。\n\n## 2. 值、变量与对象\n\n变量是给一个值起名字：\n\n```ts\nconst title = \"我的第一个 Thread\";\nconst messageCount = 3;\nconst isRunning = false;\n```\n\n对象把有关联的值放在一起：\n\n```ts\nconst thread = {\n  title: \"我的第一个 Thread\",\n  model: \"gpt-4.1\",\n  messages: [],\n};\n```\n\n数组是有顺序的一组值。`messages: []` 表示消息列表暂时为空。\n\n## 3. JSON 是数据交换格式\n\nJSON 只描述数据，不描述函数和行为：\n\n```json\n{\n  \"title\": \"我的第一个 Thread\",\n  \"messages\": [\n    { \"role\": \"user\", \"text\": \"你好\" }\n  ]\n}\n```\n\n它像跨语言都能看懂的标准表格。LLM Space 用 JSON 保存 Thread 和设置，也用 JSON-RPC 在进程或机器间发送请求。\n\n## 4. 内存状态与磁盘状态\n\n用户编辑 Thread 时，React Store 先更新内存；稍后持久化层再写磁盘。两者不是同一件事：\n\n```text\n用户输入\n→ 内存中的 Thread 更新\n→ 界面立即变化\n→ 防抖与串行保存\n→ workspace/*.json\n```\n\n如果写盘过程中突然断电，文件可能只写了一半。因此项目采用“写临时文件，再原子重命名”的方式。\n\n## 5. 路径与目录\n\n路径描述文件位置：\n\n```text\n~/.llm-space/workspace/demo.json\n```\n\n- `~` 表示当前用户主目录。\n- `/` 分隔目录。\n- `demo.json` 是文件名。\n- 相对路径从某个已知根目录开始，绝对路径从文件系统根开始。\n\nWorkspace API 限制在工作区内，Agent 文件工具则可能访问更广范围，所以权限和确认非常重要。\n\n## 6. 在源码中找到它们\n\n| 概念 | 项目位置 |\n| --- | --- |\n| Thread 数据结构 | `packages/core/src/types/threads/thread.ts` |\n| 磁盘读写 | `packages/core/src/server/storage/local/file-system.ts` |\n| 内存 Store | `packages/ui/.../stores/thread-store.ts` |\n| 工作区目录 | `~/.llm-space/workspace/` |\n\n## 7. 动手练习\n\n1. 在文本编辑器中新建一个合法 JSON 对象。\n2. 故意删除一个逗号，观察 JSON 校验器报错。\n3. 在 LLM Space 工作区找到一个 Thread 文件，辨认 title、model、context 和 messages。\n\n## 8. 理解自测\n\n**问题：为什么 TypeScript 类型不能保证磁盘 JSON 一定正确？**\n\n答案：类型检查发生在开发和构建阶段；用户文件、旧版本文件或损坏文件是在运行时进入程序的，因此还需要 Zod/TypeBox 等运行时校验。\n\n**问题：为什么界面已经变化，不代表文件一定保存成功？**\n\n答案：界面读取的是内存状态，磁盘写入是稍后发生的异步副作用。\n","text":" 程序、文件与 JSON 难度：零基础 · 建议用时：25 分钟 · 不要求编程经验 1. 程序到底是什么 程序可以理解为一份非常精确的操作说明。代码是说明书，运行时负责照着执行，数据是执行过程中读取和产生的内容。 用餐厅类比： 代码 像菜谱，描述步骤。 运行时 像厨房，真正执行步骤。 数据 像食材和订单。 文件 像仓库中的长期记录，厨房关闭后仍存在。 内存 像操作台，速度快，但程序退出后内容通常消失。 LLM Space 使用 TypeScript 编写；Bun 和浏览器分别执行其中不同部分。 2. 值、变量与对象 变量是给一个值起名字： ts const title = \"我的第一个 Thread\"; const messageCount = 3; const isRunning = false; 对象把有关联的值放在一起： ts const thread = { title: \"我的第一个 Thread\", model: \"gpt 4.1\", messages: , }; 数组是有顺序的一组值。 messages: 表示消息列表暂时为空。 3. JSON 是数据交换格式 JSON 只描述数据，不描述函数和行为： json { \"title\": \"我的第一个 Thread\", \"messages\": { \"role\": \"user\", \"text\": \"你好\" } } 它像跨语言都能看懂的标准表格。LLM Space 用 JSON 保存 Thread 和设置，也用 JSON RPC 在进程或机器间发送请求。 4. 内存状态与磁盘状态 用户编辑 Thread 时，React Store 先更新内存；稍后持久化层再写磁盘。两者不是同一件事： text 用户输入 → 内存中的 Thread 更新 → 界面立即变化 → 防抖与串行保存 → workspace/ .json 如果写盘过程中突然断电，文件可能只写了一半。因此项目采用“写临时文件，再原子重命名”的方式。 5. 路径与目录 路径描述文件位置： text ~/.llm space/workspace/demo.json ~ 表示当前用户主目录。 / 分隔目录。 demo.json 是文件名。 相对路径从某个已知根目录开始，绝对路径从文件系统根开始。 Workspace API 限制在工作区内，Agent 文件工具则可能访问更广范围，所以权限和确认非常重要。 6. 在源码中找到它们 概念 项目位置 Thread 数据结构 packages/core/src/types/threads/thread.ts 磁盘读写 packages/core/src/server/storage/local/file system.ts 内存 Store packages/ui/.../stores/thread store.ts 工作区目录 ~/.llm space/workspace/ 7. 动手练习 1. 在文本编辑器中新建一个合法 JSON 对象。 2. 故意删除一个逗号，观察 JSON 校验器报错。 3. 在 LLM Space 工作区找到一个 Thread 文件，辨认 title、model、context 和 messages。 8. 理解自测 问题：为什么 TypeScript 类型不能保证磁盘 JSON 一定正确？ 答案：类型检查发生在开发和构建阶段；用户文件、旧版本文件或损坏文件是在运行时进入程序的，因此还需要 Zod/TypeBox 等运行时校验。 问题：为什么界面已经变化，不代表文件一定保存成功？ 答案：界面读取的是内存状态，磁盘写入是稍后发生的异步副作用。 "},{"id":"00-foundations/02-javascript-typescript-modules","chapterId":"00-foundations","kind":"lesson","title":"JavaScript、TypeScript 与模块","description":"JavaScript 是运行时真正执行的语言。TypeScript 在 JavaScript 上增加类型标注和开发工具，帮助编辑器和编译器提前发现错误，最终仍转换为 JavaScript。","source":"00-foundations/02-javascript-typescript-modules.md","level":0,"levelLabel":"零基础","prerequisite":"无","duration":"35 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>JavaScript、TypeScript 与模块</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>JavaScript 与 TypeScript 的关系</strong><p>JavaScript 是运行时真正执行的语言。TypeScript 在 JavaScript 上增加类型标注和开发工具，帮助编辑器和编译器提前发现错误，最终仍转换为 JavaScript。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>类型像合同</strong><p>interface 像表格模板；联合类型 &quot;local&quot; | &quot;remote&quot; 表示只允许有限选项。这类带固定字段的联合在项目中常用来描述消息和事件。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>函数与依赖注入</strong><p>函数接收输入并产生输出：</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>模块</strong><p>大型程序必须拆成文件。模块用 export 暴露能力，用 import 引入：</p></div></div></section>","html":"<h1 id=\"s-0-JavaScript-TypeScript-与模块\">JavaScript、TypeScript 与模块</h1>\n<aside class=\"callout\">难度：零基础 · 建议用时：35 分钟 · 前置：程序、文件与 JSON</aside>\n<h2 id=\"s-2-1-JavaScript-与-TypeScript-的关系\">1. JavaScript 与 TypeScript 的关系</h2>\n<p>JavaScript 是运行时真正执行的语言。TypeScript 在 JavaScript 上增加类型标注和开发工具，帮助编辑器和编译器提前发现错误，最终仍转换为 JavaScript。</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">function formatTitle(title: string): string {\n  return title.trim();\n}</code></pre></div>\n<p><code>: string</code> 告诉工具“这里应当是文本”。它不会自动验证网络返回的数据。</p>\n<h2 id=\"s-6-2-类型像合同\">2. 类型像合同</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">interface RuntimeInfo {\n  id: string;\n  kind: &quot;local&quot; | &quot;remote&quot;;\n  status: &quot;connected&quot; | &quot;disconnected&quot; | &quot;error&quot;;\n}</code></pre></div>\n<p><code>interface</code> 像表格模板；联合类型 <code>&quot;local&quot; | &quot;remote&quot;</code> 表示只允许有限选项。这类带固定字段的联合在项目中常用来描述消息和事件。</p>\n<h2 id=\"s-9-3-函数与依赖注入\">3. 函数与依赖注入</h2>\n<p>函数接收输入并产生输出：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">function createGreeting(name: string) {\n  return `你好，${name}`;\n}</code></pre></div>\n<p>依赖注入是把函数需要的外部能力从参数传进来，而不是在内部偷偷创建：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">function saveThread(storage: Storage, thread: Thread) {\n  return storage.write(thread);\n}</code></pre></div>\n<p>这样本地存储、远程存储和测试假实现都能复用同一逻辑。</p>\n<h2 id=\"s-15-4-模块\">4. 模块</h2>\n<p>大型程序必须拆成文件。模块用 <code>export</code> 暴露能力，用 <code>import</code> 引入：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">// math.ts\nexport function add(a: number, b: number) {\n  return a + b;\n}\n\n// app.ts\nimport { add } from &quot;./math&quot;;</code></pre></div>\n<p>Monorepo 再把多个模块组织成 Package。LLM Space 的 <code>packages/core</code>、<code>packages/runtime</code>、<code>packages/ui</code> 是共享包，<code>apps/*</code> 是可运行应用。</p>\n<h2 id=\"s-19-5-Package-exports\">5. Package exports</h2>\n<p><code>package.json</code> 的 <code>exports</code> 是包对外开放的门：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-json\">{\n  &quot;exports&quot;: {\n    &quot;.&quot;: &quot;./src/index.ts&quot;,\n    &quot;./server&quot;: &quot;./src/server/index.ts&quot;\n  }\n}</code></pre></div>\n<p>浏览器代码只能使用安全入口；Bun 主进程才能引入 <code>./server</code>。这不是命名习惯，而是运行环境边界。</p>\n<h2 id=\"s-23-6-Monorepo-与-workspace\">6. Monorepo 与 workspace</h2>\n<p>Monorepo 把多个相关包放在一个仓库。<code>workspace:*</code> 表示依赖当前仓库中的版本：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">apps/desktop\n├── @llm-space/core\n├── @llm-space/runtime\n└── @llm-space/ui</code></pre></div>\n<p>修改共享包后，应用能立即消费源码，不需要先发布 npm。</p>\n<h2 id=\"s-27-7-常见语法地图\">7. 常见语法地图</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>语法</th><th>含义</th></tr></thead><tbody><tr><td><code>const</code></td><td>声明不会重新赋值的变量</td></tr><tr><td><code>type</code> / <code>interface</code></td><td>描述数据形状</td></tr><tr><td><code>class</code></td><td>把状态和方法组合为实例</td></tr><tr><td><code>async</code> / <code>await</code></td><td>等待异步结果</td></tr><tr><td><code>T[]</code></td><td>T 类型的数组</td></tr><tr><td>`T \\</td><td>null`</td><td>可能是 T，也可能为空</td></tr><tr><td><code>?.</code></td><td>值存在时才继续访问</td></tr><tr><td><code>...value</code></td><td>展开数组或对象</td></tr></tbody></table></div>\n<h2 id=\"s-29-8-官方延伸阅读\">8. 官方延伸阅读</h2>\n<ul><li>MDN JavaScript 基础课程：https://developer.mozilla.org/en-US/curriculum/core/javascript-fundamentals/</li><li>MDN JavaScript 模块：https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules</li><li>TypeScript Handbook：https://www.typescriptlang.org/docs/handbook/intro.html</li></ul>\n<h2 id=\"s-31-9-理解自测\">9. 理解自测</h2>\n<p><strong>为什么 <code>packages/ui</code> 不能直接导入 Electrobun？</strong></p>\n<p>因为同一 UI 还要在普通 Web 浏览器运行；Electrobun 只存在于桌面宿主。</p>\n<p><strong>为什么根入口没有导出所有源码？</strong></p>\n<p>Package exports 用来明确公共 API，并防止浏览器意外打包 Bun-only 模块。</p>","markdown":"# JavaScript、TypeScript 与模块\n\n> 难度：零基础 · 建议用时：35 分钟 · 前置：程序、文件与 JSON\n\n## 1. JavaScript 与 TypeScript 的关系\n\nJavaScript 是运行时真正执行的语言。TypeScript 在 JavaScript 上增加类型标注和开发工具，帮助编辑器和编译器提前发现错误，最终仍转换为 JavaScript。\n\n```ts\nfunction formatTitle(title: string): string {\n  return title.trim();\n}\n```\n\n`: string` 告诉工具“这里应当是文本”。它不会自动验证网络返回的数据。\n\n## 2. 类型像合同\n\n```ts\ninterface RuntimeInfo {\n  id: string;\n  kind: \"local\" | \"remote\";\n  status: \"connected\" | \"disconnected\" | \"error\";\n}\n```\n\n`interface` 像表格模板；联合类型 `\"local\" | \"remote\"` 表示只允许有限选项。这类带固定字段的联合在项目中常用来描述消息和事件。\n\n## 3. 函数与依赖注入\n\n函数接收输入并产生输出：\n\n```ts\nfunction createGreeting(name: string) {\n  return `你好，${name}`;\n}\n```\n\n依赖注入是把函数需要的外部能力从参数传进来，而不是在内部偷偷创建：\n\n```ts\nfunction saveThread(storage: Storage, thread: Thread) {\n  return storage.write(thread);\n}\n```\n\n这样本地存储、远程存储和测试假实现都能复用同一逻辑。\n\n## 4. 模块\n\n大型程序必须拆成文件。模块用 `export` 暴露能力，用 `import` 引入：\n\n```ts\n// math.ts\nexport function add(a: number, b: number) {\n  return a + b;\n}\n\n// app.ts\nimport { add } from \"./math\";\n```\n\nMonorepo 再把多个模块组织成 Package。LLM Space 的 `packages/core`、`packages/runtime`、`packages/ui` 是共享包，`apps/*` 是可运行应用。\n\n## 5. Package exports\n\n`package.json` 的 `exports` 是包对外开放的门：\n\n```json\n{\n  \"exports\": {\n    \".\": \"./src/index.ts\",\n    \"./server\": \"./src/server/index.ts\"\n  }\n}\n```\n\n浏览器代码只能使用安全入口；Bun 主进程才能引入 `./server`。这不是命名习惯，而是运行环境边界。\n\n## 6. Monorepo 与 workspace\n\nMonorepo 把多个相关包放在一个仓库。`workspace:*` 表示依赖当前仓库中的版本：\n\n```text\napps/desktop\n├── @llm-space/core\n├── @llm-space/runtime\n└── @llm-space/ui\n```\n\n修改共享包后，应用能立即消费源码，不需要先发布 npm。\n\n## 7. 常见语法地图\n\n| 语法 | 含义 |\n| --- | --- |\n| `const` | 声明不会重新赋值的变量 |\n| `type` / `interface` | 描述数据形状 |\n| `class` | 把状态和方法组合为实例 |\n| `async` / `await` | 等待异步结果 |\n| `T[]` | T 类型的数组 |\n| `T \\| null` | 可能是 T，也可能为空 |\n| `?.` | 值存在时才继续访问 |\n| `...value` | 展开数组或对象 |\n\n## 8. 官方延伸阅读\n\n- MDN JavaScript 基础课程：https://developer.mozilla.org/en-US/curriculum/core/javascript-fundamentals/\n- MDN JavaScript 模块：https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules\n- TypeScript Handbook：https://www.typescriptlang.org/docs/handbook/intro.html\n\n## 9. 理解自测\n\n**为什么 `packages/ui` 不能直接导入 Electrobun？**\n\n因为同一 UI 还要在普通 Web 浏览器运行；Electrobun 只存在于桌面宿主。\n\n**为什么根入口没有导出所有源码？**\n\nPackage exports 用来明确公共 API，并防止浏览器意外打包 Bun-only 模块。\n","text":" JavaScript、TypeScript 与模块 难度：零基础 · 建议用时：35 分钟 · 前置：程序、文件与 JSON 1. JavaScript 与 TypeScript 的关系 JavaScript 是运行时真正执行的语言。TypeScript 在 JavaScript 上增加类型标注和开发工具，帮助编辑器和编译器提前发现错误，最终仍转换为 JavaScript。 ts function formatTitle title: string : string { return title.trim ; } : string 告诉工具“这里应当是文本”。它不会自动验证网络返回的数据。 2. 类型像合同 ts interface RuntimeInfo { id: string; kind: \"local\" \"remote\"; status: \"connected\" \"disconnected\" \"error\"; } interface 像表格模板；联合类型 \"local\" \"remote\" 表示只允许有限选项。这类带固定字段的联合在项目中常用来描述消息和事件。 3. 函数与依赖注入 函数接收输入并产生输出： ts function createGreeting name: string { return 你好，${name} ; } 依赖注入是把函数需要的外部能力从参数传进来，而不是在内部偷偷创建： ts function saveThread storage: Storage, thread: Thread { return storage.write thread ; } 这样本地存储、远程存储和测试假实现都能复用同一逻辑。 4. 模块 大型程序必须拆成文件。模块用 export 暴露能力，用 import 引入： ts // math.ts export function add a: number, b: number { return a + b; } // app.ts import { add } from \"./math\"; Monorepo 再把多个模块组织成 Package。LLM Space 的 packages/core 、 packages/runtime 、 packages/ui 是共享包， apps/ 是可运行应用。 5. Package exports package.json 的 exports 是包对外开放的门： json { \"exports\": { \".\": \"./src/index.ts\", \"./server\": \"./src/server/index.ts\" } } 浏览器代码只能使用安全入口；Bun 主进程才能引入 ./server 。这不是命名习惯，而是运行环境边界。 6. Monorepo 与 workspace Monorepo 把多个相关包放在一个仓库。 workspace: 表示依赖当前仓库中的版本： text apps/desktop ├── @llm space/core ├── @llm space/runtime └── @llm space/ui 修改共享包后，应用能立即消费源码，不需要先发布 npm。 7. 常见语法地图 语法 含义 const 声明不会重新赋值的变量 type / interface 描述数据形状 class 把状态和方法组合为实例 async / await 等待异步结果 T T 类型的数组 T \\ null 可能是 T，也可能为空 ?. 值存在时才继续访问 ...value 展开数组或对象 8. 官方延伸阅读 MDN JavaScript 基础课程：https://developer.mozilla.org/en US/curriculum/core/javascript fundamentals/ MDN JavaScript 模块：https://developer.mozilla.org/en US/docs/Web/JavaScript/Guide/Modules TypeScript Handbook：https://www.typescriptlang.org/docs/handbook/intro.html 9. 理解自测 为什么 packages/ui 不能直接导入 Electrobun？ 因为同一 UI 还要在普通 Web 浏览器运行；Electrobun 只存在于桌面宿主。 为什么根入口没有导出所有源码？ Package exports 用来明确公共 API，并防止浏览器意外打包 Bun only 模块。 "},{"id":"00-foundations/03-react-state-ui","chapterId":"00-foundations","kind":"lesson","title":"React、状态与界面更新","description":"React 把界面拆成组件。组件接收 Props，并返回界面描述：","source":"00-foundations/03-react-state-ui.md","level":0,"levelLabel":"零基础","prerequisite":"无","duration":"35 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>React、状态与界面更新</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>组件是界面零件</strong><p>React 把界面拆成组件。组件接收 Props，并返回界面描述：</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>State 是组件的记忆</strong><p>State 保存会随交互变化的信息，例如当前标签、输入框内容或是否正在运行。State 变化后 React 重新计算界面。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>Context 是向下广播</strong><p>如果许多深层组件都需要同一个能力，逐层传 Props 会很繁琐。Context 允许上层 Provider 提供值，下层任意组件读取最近的 Provider。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>Store 管复杂状态</strong><p>Zustand Store 把大量状态和更新动作集中起来。每个 Thread Tab 都创建自己的 Store：</p></div></div></section>","html":"<h1 id=\"s-0-React-状态与界面更新\">React、状态与界面更新</h1>\n<aside class=\"callout\">难度：零基础 · 建议用时：35 分钟 · 前置：JavaScript 对象与函数</aside>\n<h2 id=\"s-2-1-组件是界面零件\">1. 组件是界面零件</h2>\n<p>React 把界面拆成组件。组件接收 Props，并返回界面描述：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-tsx\">function StatusTag({ status }: { status: string }) {\n  return &lt;span&gt;{status}&lt;/span&gt;;\n}</code></pre></div>\n<p>Props 像父组件交给子组件的订单，子组件不应随意修改它。</p>\n<h2 id=\"s-6-2-State-是组件的记忆\">2. State 是组件的记忆</h2>\n<p>State 保存会随交互变化的信息，例如当前标签、输入框内容或是否正在运行。State 变化后 React 重新计算界面。</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">用户点击 Run\n→ Store.status = &quot;running&quot;\n→ 订阅 status 的组件重新渲染\n→ 按钮显示为 Stop</code></pre></div>\n<p>“重新渲染”不是把整个应用窗口重启，而是 React 比较前后结果并更新需要变化的 DOM。</p>\n<h2 id=\"s-10-3-Context-是向下广播\">3. Context 是向下广播</h2>\n<p>如果许多深层组件都需要同一个能力，逐层传 Props 会很繁琐。Context 允许上层 Provider 提供值，下层任意组件读取最近的 Provider。</p>\n<p>LLM Space 使用它注入：</p>\n<ul><li><code>HostServices</code>：文件、工具、导航等宿主能力。</li><li><code>ModelClient</code>：模型管理能力。</li><li>每个 Thread 的 Store。</li></ul>\n<p>可以把 Context 想成一栋楼的公共管线；Provider 决定当前楼层接入哪套水电。</p>\n<h2 id=\"s-15-4-Store-管复杂状态\">4. Store 管复杂状态</h2>\n<p>Zustand Store 把大量状态和更新动作集中起来。每个 Thread Tab 都创建自己的 Store：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">Tab A → Store A → Thread A / Undo A / Stream A\nTab B → Store B → Thread B / Undo B / Stream B</code></pre></div>\n<p>因此切换标签不会把两个 Thread 的消息混在一起。</p>\n<h2 id=\"s-19-5-Selector-为什么重要\">5. Selector 为什么重要</h2>\n<p>组件只应订阅自己需要的字段：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">const status = useThreadStore((state) =&gt; state.status);</code></pre></div>\n<p>如果订阅整个 Store，任何 token、工具卡片或输入变化都可能让组件重渲染。流式界面尤其需要控制更新范围。</p>\n<h2 id=\"s-23-6-Effect-是连接外部系统\">6. Effect 是连接外部系统</h2>\n<p>Effect 用于同步 React 之外的系统，比如网络连接、事件监听和计时器。它通常返回清理函数：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">useEffect(() =&gt; {\n  window.addEventListener(&quot;keydown&quot;, onKeyDown);\n  return () =&gt; window.removeEventListener(&quot;keydown&quot;, onKeyDown);\n}, []);</code></pre></div>\n<p>不要用 Effect 代替普通数据计算。React 官方把 Effect 定义为连接外部系统的“逃生舱”。</p>\n<h2 id=\"s-27-7-LLM-Space-的-UI-数据流\">7. LLM Space 的 UI 数据流</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">ThreadTabPane\n→ 创建 Thread Store\n→ ThreadPlayground 读取 selector\n→ 用户动作调用 Store action\n→ Store 产生新 state\n→ 相关组件更新\n→ SerializedPersistence 写磁盘</code></pre></div>\n<h2 id=\"s-29-8-官方延伸阅读\">8. 官方延伸阅读</h2>\n<ul><li>React State：https://react.dev/learn/state-a-components-memory</li><li>React Context：https://react.dev/reference/react/useContext</li><li>React Effects：https://react.dev/reference/react/useEffect</li></ul>\n<h2 id=\"s-31-9-理解自测\">9. 理解自测</h2>\n<p><strong>为什么 inactive Tab 只是隐藏而不卸载？</strong></p>\n<p>为了保留 Store、Undo、编辑现场和进行中的流。</p>\n<p><strong>为什么 Web Viewer 可以复用 ThreadPlayground？</strong></p>\n<p>它注入 <code>presentational: true</code> 的 HostServices，界面结构复用，但运行和文件能力被关闭。</p>","markdown":"# React、状态与界面更新\n\n> 难度：零基础 · 建议用时：35 分钟 · 前置：JavaScript 对象与函数\n\n## 1. 组件是界面零件\n\nReact 把界面拆成组件。组件接收 Props，并返回界面描述：\n\n```tsx\nfunction StatusTag({ status }: { status: string }) {\n  return <span>{status}</span>;\n}\n```\n\nProps 像父组件交给子组件的订单，子组件不应随意修改它。\n\n## 2. State 是组件的记忆\n\nState 保存会随交互变化的信息，例如当前标签、输入框内容或是否正在运行。State 变化后 React 重新计算界面。\n\n```text\n用户点击 Run\n→ Store.status = \"running\"\n→ 订阅 status 的组件重新渲染\n→ 按钮显示为 Stop\n```\n\n“重新渲染”不是把整个应用窗口重启，而是 React 比较前后结果并更新需要变化的 DOM。\n\n## 3. Context 是向下广播\n\n如果许多深层组件都需要同一个能力，逐层传 Props 会很繁琐。Context 允许上层 Provider 提供值，下层任意组件读取最近的 Provider。\n\nLLM Space 使用它注入：\n\n- `HostServices`：文件、工具、导航等宿主能力。\n- `ModelClient`：模型管理能力。\n- 每个 Thread 的 Store。\n\n可以把 Context 想成一栋楼的公共管线；Provider 决定当前楼层接入哪套水电。\n\n## 4. Store 管复杂状态\n\nZustand Store 把大量状态和更新动作集中起来。每个 Thread Tab 都创建自己的 Store：\n\n```text\nTab A → Store A → Thread A / Undo A / Stream A\nTab B → Store B → Thread B / Undo B / Stream B\n```\n\n因此切换标签不会把两个 Thread 的消息混在一起。\n\n## 5. Selector 为什么重要\n\n组件只应订阅自己需要的字段：\n\n```ts\nconst status = useThreadStore((state) => state.status);\n```\n\n如果订阅整个 Store，任何 token、工具卡片或输入变化都可能让组件重渲染。流式界面尤其需要控制更新范围。\n\n## 6. Effect 是连接外部系统\n\nEffect 用于同步 React 之外的系统，比如网络连接、事件监听和计时器。它通常返回清理函数：\n\n```ts\nuseEffect(() => {\n  window.addEventListener(\"keydown\", onKeyDown);\n  return () => window.removeEventListener(\"keydown\", onKeyDown);\n}, []);\n```\n\n不要用 Effect 代替普通数据计算。React 官方把 Effect 定义为连接外部系统的“逃生舱”。\n\n## 7. LLM Space 的 UI 数据流\n\n```text\nThreadTabPane\n→ 创建 Thread Store\n→ ThreadPlayground 读取 selector\n→ 用户动作调用 Store action\n→ Store 产生新 state\n→ 相关组件更新\n→ SerializedPersistence 写磁盘\n```\n\n## 8. 官方延伸阅读\n\n- React State：https://react.dev/learn/state-a-components-memory\n- React Context：https://react.dev/reference/react/useContext\n- React Effects：https://react.dev/reference/react/useEffect\n\n## 9. 理解自测\n\n**为什么 inactive Tab 只是隐藏而不卸载？**\n\n为了保留 Store、Undo、编辑现场和进行中的流。\n\n**为什么 Web Viewer 可以复用 ThreadPlayground？**\n\n它注入 `presentational: true` 的 HostServices，界面结构复用，但运行和文件能力被关闭。\n","text":" React、状态与界面更新 难度：零基础 · 建议用时：35 分钟 · 前置：JavaScript 对象与函数 1. 组件是界面零件 React 把界面拆成组件。组件接收 Props，并返回界面描述： tsx function StatusTag { status }: { status: string } { return <span {status}</span ; } Props 像父组件交给子组件的订单，子组件不应随意修改它。 2. State 是组件的记忆 State 保存会随交互变化的信息，例如当前标签、输入框内容或是否正在运行。State 变化后 React 重新计算界面。 text 用户点击 Run → Store.status = \"running\" → 订阅 status 的组件重新渲染 → 按钮显示为 Stop “重新渲染”不是把整个应用窗口重启，而是 React 比较前后结果并更新需要变化的 DOM。 3. Context 是向下广播 如果许多深层组件都需要同一个能力，逐层传 Props 会很繁琐。Context 允许上层 Provider 提供值，下层任意组件读取最近的 Provider。 LLM Space 使用它注入： HostServices ：文件、工具、导航等宿主能力。 ModelClient ：模型管理能力。 每个 Thread 的 Store。 可以把 Context 想成一栋楼的公共管线；Provider 决定当前楼层接入哪套水电。 4. Store 管复杂状态 Zustand Store 把大量状态和更新动作集中起来。每个 Thread Tab 都创建自己的 Store： text Tab A → Store A → Thread A / Undo A / Stream A Tab B → Store B → Thread B / Undo B / Stream B 因此切换标签不会把两个 Thread 的消息混在一起。 5. Selector 为什么重要 组件只应订阅自己需要的字段： ts const status = useThreadStore state = state.status ; 如果订阅整个 Store，任何 token、工具卡片或输入变化都可能让组件重渲染。流式界面尤其需要控制更新范围。 6. Effect 是连接外部系统 Effect 用于同步 React 之外的系统，比如网络连接、事件监听和计时器。它通常返回清理函数： ts useEffect = { window.addEventListener \"keydown\", onKeyDown ; return = window.removeEventListener \"keydown\", onKeyDown ; }, ; 不要用 Effect 代替普通数据计算。React 官方把 Effect 定义为连接外部系统的“逃生舱”。 7. LLM Space 的 UI 数据流 text ThreadTabPane → 创建 Thread Store → ThreadPlayground 读取 selector → 用户动作调用 Store action → Store 产生新 state → 相关组件更新 → SerializedPersistence 写磁盘 8. 官方延伸阅读 React State：https://react.dev/learn/state a components memory React Context：https://react.dev/reference/react/useContext React Effects：https://react.dev/reference/react/useEffect 9. 理解自测 为什么 inactive Tab 只是隐藏而不卸载？ 为了保留 Store、Undo、编辑现场和进行中的流。 为什么 Web Viewer 可以复用 ThreadPlayground？ 它注入 presentational: true 的 HostServices，界面结构复用，但运行和文件能力被关闭。 "},{"id":"00-foundations/04-async-network-streams","chapterId":"00-foundations","kind":"lesson","title":"异步、网络、RPC 与流","description":"同步像在柜台排队：前一件事结束，才处理下一件。异步像取号：提交任务后可以做别的，结果准备好再回来处理。","source":"00-foundations/04-async-network-streams.md","level":0,"levelLabel":"零基础","prerequisite":"无","duration":"35 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>异步、网络、RPC 与流</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>同步与异步</strong><p>同步像在柜台排队：前一件事结束，才处理下一件。异步像取号：提交任务后可以做别的，结果准备好再回来处理。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>Promise</strong><p>Promise 表示“未来会成功或失败的一个结果”：</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>流为什么不是一个 Promise</strong><p>模型回答可能持续几十秒。如果等全部完成才显示，用户会感觉程序卡住。流把结果拆成事件：</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>取消</strong><p>AbortController 像任务的紧急停止按钮：</p></div></div></section>","html":"<h1 id=\"s-0-异步-网络-RPC-与流\">异步、网络、RPC 与流</h1>\n<aside class=\"callout\">难度：零基础到入门 · 建议用时：45 分钟 · 前置：函数与模块</aside>\n<h2 id=\"s-2-1-同步与异步\">1. 同步与异步</h2>\n<p>同步像在柜台排队：前一件事结束，才处理下一件。异步像取号：提交任务后可以做别的，结果准备好再回来处理。</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">const thread = await storage.read(path);</code></pre></div>\n<p><code>await</code> 表示暂停当前异步函数，等待 Promise 完成；它不会冻结整个应用。</p>\n<h2 id=\"s-6-2-Promise\">2. Promise</h2>\n<p>Promise 表示“未来会成功或失败的一个结果”：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">try {\n  const thread = await readThread();\n} catch (error) {\n  showError(error);\n}</code></pre></div>\n<p>网络、文件和子进程都可能失败，所以错误路径与成功路径同样重要。</p>\n<h2 id=\"s-10-3-流为什么不是一个-Promise\">3. 流为什么不是一个 Promise</h2>\n<p>模型回答可能持续几十秒。如果等全部完成才显示，用户会感觉程序卡住。流把结果拆成事件：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">message_start\ntext_delta: &quot;你&quot;\ntext_delta: &quot;好&quot;\nmessage_end</code></pre></div>\n<p>AsyncGenerator 允许多次 <code>yield</code>，消费端使用 <code>for await</code>：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">for await (const event of stream) {\n  reduce(event);\n}</code></pre></div>\n<h2 id=\"s-15-4-取消\">4. 取消</h2>\n<p><code>AbortController</code> 像任务的紧急停止按钮：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">const controller = new AbortController();\nfetch(url, { signal: controller.signal });\ncontroller.abort();</code></pre></div>\n<p>LLM Space 把 AbortSignal 从 UI 一直传到模型请求。任何一层漏传，用户虽然看到“已停止”，远端仍可能继续消耗 token。</p>\n<h2 id=\"s-19-5-HTTP\">5. HTTP</h2>\n<p>HTTP 是请求与响应协议：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">POST /rpc\nAuthorization: Bearer ...\nContent-Type: application/json</code></pre></div>\n<p>请求包含方法、路径、Header 和 Body；响应包含状态码、Header 和 Body。</p>\n<h2 id=\"s-23-6-RPC\">6. RPC</h2>\n<p>RPC（远程过程调用）让调用远端能力看起来像调用函数：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">await runtime.fsRead({ path: &quot;demo.json&quot; });</code></pre></div>\n<p>底层可能被编码成：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-json\">{ &quot;id&quot;: &quot;123&quot;, &quot;method&quot;: &quot;fs.read&quot;, &quot;params&quot;: { &quot;path&quot;: &quot;demo.json&quot; } }</code></pre></div>\n<p>Electrobun RPC 连接桌面 Renderer 与 Bun 主进程；Remote RPC 连接桌面与 Linux Server。</p>\n<h2 id=\"s-29-7-SSE\">7. SSE</h2>\n<p>Server-Sent Events 是服务端持续向客户端发送文本事件的格式：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">data: {&quot;type&quot;:&quot;event&quot;,&quot;value&quot;:&quot;...&quot;}\n\ndata: [DONE]</code></pre></div>\n<p>LLM Space Remote Stream 使用 POST + fetch 手工解析 SSE，因为标准 EventSource 不方便携带请求 Body。</p>\n<h2 id=\"s-33-8-竞态条件\">8. 竞态条件</h2>\n<p>如果两个异步写入同时进行，旧请求可能更晚完成并覆盖新数据：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">写入 A 开始\n写入 B 开始\n写入 B 完成\n写入 A 完成 → 错误覆盖 B</code></pre></div>\n<p>SerializedPersistence 用队列保证顺序；RuntimeRunTracker 用租约阻止运行、保存和文件移动互相冲突。</p>\n<h2 id=\"s-37-9-官方延伸阅读\">9. 官方延伸阅读</h2>\n<ul><li>MDN JavaScript 异步基础：https://developer.mozilla.org/en-US/curriculum/core/javascript-fundamentals/#6.11_async_javascript_basics</li><li>MDN AbortController：https://developer.mozilla.org/en-US/docs/Web/API/AbortController</li><li>MDN AsyncIterator：https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/AsyncIterator</li></ul>\n<h2 id=\"s-39-10-理解自测\">10. 理解自测</h2>\n<p><strong>为什么模型流需要 streamId？</strong></p>\n<p>多个 Tab 可以并发运行，streamId 用于把返回事件送回正确消费者。</p>\n<p><strong>为什么取消必须在 finally 中清理 listener 和 Map？</strong></p>\n<p>否则会留下内存引用、重复响应或“幽灵任务”。</p>","markdown":"# 异步、网络、RPC 与流\n\n> 难度：零基础到入门 · 建议用时：45 分钟 · 前置：函数与模块\n\n## 1. 同步与异步\n\n同步像在柜台排队：前一件事结束，才处理下一件。异步像取号：提交任务后可以做别的，结果准备好再回来处理。\n\n```ts\nconst thread = await storage.read(path);\n```\n\n`await` 表示暂停当前异步函数，等待 Promise 完成；它不会冻结整个应用。\n\n## 2. Promise\n\nPromise 表示“未来会成功或失败的一个结果”：\n\n```ts\ntry {\n  const thread = await readThread();\n} catch (error) {\n  showError(error);\n}\n```\n\n网络、文件和子进程都可能失败，所以错误路径与成功路径同样重要。\n\n## 3. 流为什么不是一个 Promise\n\n模型回答可能持续几十秒。如果等全部完成才显示，用户会感觉程序卡住。流把结果拆成事件：\n\n```text\nmessage_start\ntext_delta: \"你\"\ntext_delta: \"好\"\nmessage_end\n```\n\nAsyncGenerator 允许多次 `yield`，消费端使用 `for await`：\n\n```ts\nfor await (const event of stream) {\n  reduce(event);\n}\n```\n\n## 4. 取消\n\n`AbortController` 像任务的紧急停止按钮：\n\n```ts\nconst controller = new AbortController();\nfetch(url, { signal: controller.signal });\ncontroller.abort();\n```\n\nLLM Space 把 AbortSignal 从 UI 一直传到模型请求。任何一层漏传，用户虽然看到“已停止”，远端仍可能继续消耗 token。\n\n## 5. HTTP\n\nHTTP 是请求与响应协议：\n\n```text\nPOST /rpc\nAuthorization: Bearer ...\nContent-Type: application/json\n```\n\n请求包含方法、路径、Header 和 Body；响应包含状态码、Header 和 Body。\n\n## 6. RPC\n\nRPC（远程过程调用）让调用远端能力看起来像调用函数：\n\n```ts\nawait runtime.fsRead({ path: \"demo.json\" });\n```\n\n底层可能被编码成：\n\n```json\n{ \"id\": \"123\", \"method\": \"fs.read\", \"params\": { \"path\": \"demo.json\" } }\n```\n\nElectrobun RPC 连接桌面 Renderer 与 Bun 主进程；Remote RPC 连接桌面与 Linux Server。\n\n## 7. SSE\n\nServer-Sent Events 是服务端持续向客户端发送文本事件的格式：\n\n```text\ndata: {\"type\":\"event\",\"value\":\"...\"}\n\ndata: [DONE]\n```\n\nLLM Space Remote Stream 使用 POST + fetch 手工解析 SSE，因为标准 EventSource 不方便携带请求 Body。\n\n## 8. 竞态条件\n\n如果两个异步写入同时进行，旧请求可能更晚完成并覆盖新数据：\n\n```text\n写入 A 开始\n写入 B 开始\n写入 B 完成\n写入 A 完成 → 错误覆盖 B\n```\n\nSerializedPersistence 用队列保证顺序；RuntimeRunTracker 用租约阻止运行、保存和文件移动互相冲突。\n\n## 9. 官方延伸阅读\n\n- MDN JavaScript 异步基础：https://developer.mozilla.org/en-US/curriculum/core/javascript-fundamentals/#6.11_async_javascript_basics\n- MDN AbortController：https://developer.mozilla.org/en-US/docs/Web/API/AbortController\n- MDN AsyncIterator：https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/AsyncIterator\n\n## 10. 理解自测\n\n**为什么模型流需要 streamId？**\n\n多个 Tab 可以并发运行，streamId 用于把返回事件送回正确消费者。\n\n**为什么取消必须在 finally 中清理 listener 和 Map？**\n\n否则会留下内存引用、重复响应或“幽灵任务”。\n","text":" 异步、网络、RPC 与流 难度：零基础到入门 · 建议用时：45 分钟 · 前置：函数与模块 1. 同步与异步 同步像在柜台排队：前一件事结束，才处理下一件。异步像取号：提交任务后可以做别的，结果准备好再回来处理。 ts const thread = await storage.read path ; await 表示暂停当前异步函数，等待 Promise 完成；它不会冻结整个应用。 2. Promise Promise 表示“未来会成功或失败的一个结果”： ts try { const thread = await readThread ; } catch error { showError error ; } 网络、文件和子进程都可能失败，所以错误路径与成功路径同样重要。 3. 流为什么不是一个 Promise 模型回答可能持续几十秒。如果等全部完成才显示，用户会感觉程序卡住。流把结果拆成事件： text message start text delta: \"你\" text delta: \"好\" message end AsyncGenerator 允许多次 yield ，消费端使用 for await ： ts for await const event of stream { reduce event ; } 4. 取消 AbortController 像任务的紧急停止按钮： ts const controller = new AbortController ; fetch url, { signal: controller.signal } ; controller.abort ; LLM Space 把 AbortSignal 从 UI 一直传到模型请求。任何一层漏传，用户虽然看到“已停止”，远端仍可能继续消耗 token。 5. HTTP HTTP 是请求与响应协议： text POST /rpc Authorization: Bearer ... Content Type: application/json 请求包含方法、路径、Header 和 Body；响应包含状态码、Header 和 Body。 6. RPC RPC（远程过程调用）让调用远端能力看起来像调用函数： ts await runtime.fsRead { path: \"demo.json\" } ; 底层可能被编码成： json { \"id\": \"123\", \"method\": \"fs.read\", \"params\": { \"path\": \"demo.json\" } } Electrobun RPC 连接桌面 Renderer 与 Bun 主进程；Remote RPC 连接桌面与 Linux Server。 7. SSE Server Sent Events 是服务端持续向客户端发送文本事件的格式： text data: {\"type\":\"event\",\"value\":\"...\"} data: DONE LLM Space Remote Stream 使用 POST + fetch 手工解析 SSE，因为标准 EventSource 不方便携带请求 Body。 8. 竞态条件 如果两个异步写入同时进行，旧请求可能更晚完成并覆盖新数据： text 写入 A 开始 写入 B 开始 写入 B 完成 写入 A 完成 → 错误覆盖 B SerializedPersistence 用队列保证顺序；RuntimeRunTracker 用租约阻止运行、保存和文件移动互相冲突。 9. 官方延伸阅读 MDN JavaScript 异步基础：https://developer.mozilla.org/en US/curriculum/core/javascript fundamentals/ 6.11 async javascript basics MDN AbortController：https://developer.mozilla.org/en US/docs/Web/API/AbortController MDN AsyncIterator：https://developer.mozilla.org/en US/docs/Web/JavaScript/Reference/Global Objects/AsyncIterator 10. 理解自测 为什么模型流需要 streamId？ 多个 Tab 可以并发运行，streamId 用于把返回事件送回正确消费者。 为什么取消必须在 finally 中清理 listener 和 Map？ 否则会留下内存引用、重复响应或“幽灵任务”。 "},{"id":"00-foundations/05-llm-agent-mcp","chapterId":"00-foundations","kind":"lesson","title":"LLM、Agent、Tools 与 MCP","description":"大语言模型接收一串上下文 token，并预测接下来最合适的输出。它没有自动访问本机文件、数据库或浏览器的能力；这些能力必须由应用通过工具接入。","source":"00-foundations/05-llm-agent-mcp.md","level":0,"levelLabel":"零基础","prerequisite":"无","duration":"35 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>LLM、Agent、Tools 与 MCP</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>LLM 是什么</strong><p>大语言模型接收一串上下文 token，并预测接下来最合适的输出。它没有自动访问本机文件、数据库或浏览器的能力；这些能力必须由应用通过工具接入。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>Token 与上下文</strong><p>Token 是模型处理文本的基本片段，不完全等于汉字或单词。上下文越长，成本和延迟通常越高。LLM Space 保存 usage，帮助比较不同运行。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>Tool Call</strong><p>模型不会直接执行函数，而是输出结构化请求：</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>Agent 与 ReAct</strong><p>Agent 是“模型 + 上下文 + 工具 + 循环控制”的系统。ReAct 可简化为：</p></div></div></section>","html":"<h1 id=\"s-0-LLM-Agent-Tools-与-MCP\">LLM、Agent、Tools 与 MCP</h1>\n<aside class=\"callout\">难度：零基础到入门 · 建议用时：45 分钟 · 前置：JSON、请求与响应</aside>\n<h2 id=\"s-2-1-LLM-是什么\">1. LLM 是什么</h2>\n<p>大语言模型接收一串上下文 token，并预测接下来最合适的输出。它没有自动访问本机文件、数据库或浏览器的能力；这些能力必须由应用通过工具接入。</p>\n<p>基本输入包括：</p>\n<ul><li>System Prompt：长期行为规则。</li><li>Messages：对话历史。</li><li>Tools：可调用能力的名称、说明和参数 Schema。</li><li>Model parameters：温度、最大 token、推理强度等。</li></ul>\n<h2 id=\"s-6-2-Token-与上下文\">2. Token 与上下文</h2>\n<p>Token 是模型处理文本的基本片段，不完全等于汉字或单词。上下文越长，成本和延迟通常越高。LLM Space 保存 usage，帮助比较不同运行。</p>\n<h2 id=\"s-8-3-Tool-Call\">3. Tool Call</h2>\n<p>模型不会直接执行函数，而是输出结构化请求：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-json\">{\n  &quot;name&quot;: &quot;read_file&quot;,\n  &quot;arguments&quot;: { &quot;path&quot;: &quot;README.md&quot; }\n}</code></pre></div>\n<p>宿主决定是否执行、由谁执行、是否需要用户确认，并把结果送回模型。</p>\n<h2 id=\"s-12-4-Agent-与-ReAct\">4. Agent 与 ReAct</h2>\n<p>Agent 是“模型 + 上下文 + 工具 + 循环控制”的系统。ReAct 可简化为：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">理解任务\n→ 决定是否调用工具\n→ 执行工具\n→ 观察结果\n→ 继续思考或给出答案</code></pre></div>\n<p>LLM Space 允许单步调试，也允许自动循环。单步模式让用户检查甚至修改 Tool Result 后再继续。</p>\n<h2 id=\"s-16-5-Runtime-是能力所在的地方\">5. Runtime 是能力所在的地方</h2>\n<p>Runtime 拥有模型连接、文件系统、MCP、Tools、Skills、Search 和 Trace。它可以在本机，也可以在 SSH 远端。</p>\n<p>UI 只发出意图；Runtime 才真正接触 API Key、文件和子进程。</p>\n<h2 id=\"s-19-6-五类工具\">6. 五类工具</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>类型</th><th>执行者</th><th>类比</th></tr></thead><tbody><tr><td>Built-in</td><td>LLM Space Runtime</td><td>公司内部固定部门</td></tr><tr><td>MCP</td><td>MCP Server</td><td>使用标准接口的外部供应商</td></tr><tr><td>Plugin</td><td>本机插件子进程</td><td>安装的扩展程序</td></tr><tr><td>Custom Function</td><td>用户或外部流程</td><td>预留的人工柜台</td></tr><tr><td>Provider-Hosted</td><td>模型服务商</td><td>云服务内部完成</td></tr></tbody></table></div>\n<p>工具类型不只是 UI 分类，它决定安全、确认、错误和 ReAct continuation。</p>\n<h2 id=\"s-22-7-MCP\">7. MCP</h2>\n<p>MCP 是连接 AI 应用与外部系统的开放标准，可类比“AI 应用的 USB-C”。Host 管理连接和权限，Client 与一个 Server 保持连接，Server 暴露 Tools、Resources 或 Prompts。</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">LLM Space（Host）\n├── MCP Client A ↔ 文件 Server\n├── MCP Client B ↔ 数据库 Server\n└── MCP Client C ↔ 远程 API Server</code></pre></div>\n<p>MCP 使用 JSON-RPC，并包含能力协商、生命周期、取消、错误与通知。工具可能执行任意代码，不能因为“来自 MCP”就默认安全。</p>\n<h2 id=\"s-26-8-Skill-与-Tool-的区别\">8. Skill 与 Tool 的区别</h2>\n<ul><li>Tool 是可执行能力，例如读文件或搜索。</li><li>Skill 是按需加载的专业说明，告诉模型如何完成某类任务。</li></ul>\n<p><code>available_skills</code> 只向模型展示目录；真正需要时，模型调用内置 <code>skill</code> 工具读取完整 <code>SKILL.md</code>。</p>\n<h2 id=\"s-29-9-官方延伸阅读\">9. 官方延伸阅读</h2>\n<ul><li>MCP 简介：https://modelcontextprotocol.io/docs/getting-started/intro</li><li>MCP 架构：https://modelcontextprotocol.io/docs/learn/architecture</li><li>MCP 规范：https://modelcontextprotocol.io/specification/latest</li></ul>\n<h2 id=\"s-31-10-理解自测\">10. 理解自测</h2>\n<p><strong>为什么 Tool Schema 很重要？</strong></p>\n<p>它告诉模型工具名称、用途和参数形状，也让宿主能在执行前校验输入。</p>\n<p><strong>为什么 Provider-Hosted Tool 不进入本地执行器？</strong></p>\n<p>它在模型服务商内部完成，应用收到的是活动和结果，而不是等待本地处理的 Tool Call。</p>\n<p><strong>为什么插件子进程不是安全沙箱？</strong></p>\n<p>独立进程能隔离崩溃，但插件仍可使用系统 API 访问文件、网络和环境变量。</p>","markdown":"# LLM、Agent、Tools 与 MCP\n\n> 难度：零基础到入门 · 建议用时：45 分钟 · 前置：JSON、请求与响应\n\n## 1. LLM 是什么\n\n大语言模型接收一串上下文 token，并预测接下来最合适的输出。它没有自动访问本机文件、数据库或浏览器的能力；这些能力必须由应用通过工具接入。\n\n基本输入包括：\n\n- System Prompt：长期行为规则。\n- Messages：对话历史。\n- Tools：可调用能力的名称、说明和参数 Schema。\n- Model parameters：温度、最大 token、推理强度等。\n\n## 2. Token 与上下文\n\nToken 是模型处理文本的基本片段，不完全等于汉字或单词。上下文越长，成本和延迟通常越高。LLM Space 保存 usage，帮助比较不同运行。\n\n## 3. Tool Call\n\n模型不会直接执行函数，而是输出结构化请求：\n\n```json\n{\n  \"name\": \"read_file\",\n  \"arguments\": { \"path\": \"README.md\" }\n}\n```\n\n宿主决定是否执行、由谁执行、是否需要用户确认，并把结果送回模型。\n\n## 4. Agent 与 ReAct\n\nAgent 是“模型 + 上下文 + 工具 + 循环控制”的系统。ReAct 可简化为：\n\n```text\n理解任务\n→ 决定是否调用工具\n→ 执行工具\n→ 观察结果\n→ 继续思考或给出答案\n```\n\nLLM Space 允许单步调试，也允许自动循环。单步模式让用户检查甚至修改 Tool Result 后再继续。\n\n## 5. Runtime 是能力所在的地方\n\nRuntime 拥有模型连接、文件系统、MCP、Tools、Skills、Search 和 Trace。它可以在本机，也可以在 SSH 远端。\n\nUI 只发出意图；Runtime 才真正接触 API Key、文件和子进程。\n\n## 6. 五类工具\n\n| 类型 | 执行者 | 类比 |\n| --- | --- | --- |\n| Built-in | LLM Space Runtime | 公司内部固定部门 |\n| MCP | MCP Server | 使用标准接口的外部供应商 |\n| Plugin | 本机插件子进程 | 安装的扩展程序 |\n| Custom Function | 用户或外部流程 | 预留的人工柜台 |\n| Provider-Hosted | 模型服务商 | 云服务内部完成 |\n\n工具类型不只是 UI 分类，它决定安全、确认、错误和 ReAct continuation。\n\n## 7. MCP\n\nMCP 是连接 AI 应用与外部系统的开放标准，可类比“AI 应用的 USB-C”。Host 管理连接和权限，Client 与一个 Server 保持连接，Server 暴露 Tools、Resources 或 Prompts。\n\n```text\nLLM Space（Host）\n├── MCP Client A ↔ 文件 Server\n├── MCP Client B ↔ 数据库 Server\n└── MCP Client C ↔ 远程 API Server\n```\n\nMCP 使用 JSON-RPC，并包含能力协商、生命周期、取消、错误与通知。工具可能执行任意代码，不能因为“来自 MCP”就默认安全。\n\n## 8. Skill 与 Tool 的区别\n\n- Tool 是可执行能力，例如读文件或搜索。\n- Skill 是按需加载的专业说明，告诉模型如何完成某类任务。\n\n`available_skills` 只向模型展示目录；真正需要时，模型调用内置 `skill` 工具读取完整 `SKILL.md`。\n\n## 9. 官方延伸阅读\n\n- MCP 简介：https://modelcontextprotocol.io/docs/getting-started/intro\n- MCP 架构：https://modelcontextprotocol.io/docs/learn/architecture\n- MCP 规范：https://modelcontextprotocol.io/specification/latest\n\n## 10. 理解自测\n\n**为什么 Tool Schema 很重要？**\n\n它告诉模型工具名称、用途和参数形状，也让宿主能在执行前校验输入。\n\n**为什么 Provider-Hosted Tool 不进入本地执行器？**\n\n它在模型服务商内部完成，应用收到的是活动和结果，而不是等待本地处理的 Tool Call。\n\n**为什么插件子进程不是安全沙箱？**\n\n独立进程能隔离崩溃，但插件仍可使用系统 API 访问文件、网络和环境变量。\n","text":" LLM、Agent、Tools 与 MCP 难度：零基础到入门 · 建议用时：45 分钟 · 前置：JSON、请求与响应 1. LLM 是什么 大语言模型接收一串上下文 token，并预测接下来最合适的输出。它没有自动访问本机文件、数据库或浏览器的能力；这些能力必须由应用通过工具接入。 基本输入包括： System Prompt：长期行为规则。 Messages：对话历史。 Tools：可调用能力的名称、说明和参数 Schema。 Model parameters：温度、最大 token、推理强度等。 2. Token 与上下文 Token 是模型处理文本的基本片段，不完全等于汉字或单词。上下文越长，成本和延迟通常越高。LLM Space 保存 usage，帮助比较不同运行。 3. Tool Call 模型不会直接执行函数，而是输出结构化请求： json { \"name\": \"read file\", \"arguments\": { \"path\": \"README.md\" } } "#01-learning-map/01-environment-and-monorepo\"><span class=\"chapter-guide-number\">01</span><div><strong>开发环境与 Monorepo</strong><p>这一节帮助第一次接触 TypeScript 桌面项目的读者把仓库运行起来，并理解“一个仓库、多个可发布单元”的工程组织方式。</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#01-learning-map/02-product-concepts\"><span class=\"chapter-guide-number\">02</span><div><strong>产品概念与领域词汇</strong><p>阅读源码前必须先理解产品语言。领域词汇不是 UI 标签的集合，而是代码中的稳定概念。</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#01-learning-map/03-architecture-tour\"><span class=\"chapter-guide-number\">03</span><div><strong>架构分层与首条调用链</strong><p>这一节用三个边界接口串起全项目：AgentTransport、RuntimeClient 与 HostServices。</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a></div></section>","html":"<h1 id=\"s-0-第一章-建立-LLM-Space-的全局地图\">第一章：建立 LLM Space 的全局地图</h1>\n<p>本章不是从某个组件开始抄代码，而是先建立一张能解释整个仓库的地图。LLM Space 4 是一个面向 Agent 开发者的桌面工作台：用户把模型、提示词、变量、工具和消息保存为 Thread，再运行、观察、修改、回放与评测。理解这个目标后，仓库里的每一层都会有明确位置。</p>\n<h2 id=\"s-2-学习目标\">学习目标</h2>\n<ul><li>能用一句话解释 <code>packages/core</code>、<code>packages/runtime</code>、<code>packages/ui</code> 与三个 <code>apps/*</code> 的边界。</li><li>能在本地安装依赖、运行桌面端、运行 Web 端并执行质量检查。</li><li>能说清一次 Thread 运行从 React 点击事件到模型流式事件返回的完整路径。</li><li>掌握后续课程的阅读方法：先找边界类型，再找组合根，最后沿调用链进入实现。</li></ul>\n<h2 id=\"s-4-仓库全景\">仓库全景</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>区域</th><th>角色</th><th>典型依赖方向</th></tr></thead><tbody><tr><td><code>packages/core</code></td><td>跨环境领域模型、Thread 语义、流式 reducer、Agent 服务端核心</td><td>不依赖 React 或 Electrobun</td></tr><tr><td><code>packages/runtime</code></td><td>模型、MCP、Skills、插件、工具、Trace 与 Runtime 统一接口</td><td>依赖 <code>core</code></td></tr><tr><td><code>packages/ui</code></td><td>React 设计系统与 Thread Playground</td><td>依赖 <code>core</code>，通过 HostServices 注入宿主能力</td></tr><tr><td><code>apps/desktop</code></td><td>Electrobun 桌面壳、Bun 主进程、Renderer 与远程运行时管理</td><td>组合 <code>core</code>、<code>runtime</code>、<code>ui</code></td></tr><tr><td><code>apps/server</code></td><td>可部署到 Linux 的无界面 Runtime HTTP 服务</td><td>组合 <code>core</code> 与 <code>runtime</code></td></tr><tr><td><code>apps/web</code></td><td>官网与只读共享 Thread 查看器</td><td>组合 <code>core</code> 与 <code>ui</code></td></tr></tbody></table></div>\n<p>这是一种“内层稳定、外层适配”的架构。领域类型和纯逻辑在内层；文件系统、网络、窗口、SSH 等有副作用的能力留在外层。<code>HostServices</code>、<code>RuntimeClient</code>、<code>AgentTransport</code> 是最重要的三个边界接口。</p>\n<h2 id=\"s-7-一次运行的主链路\">一次运行的主链路</h2>\n<ol><li>用户在 <code>ThreadPlayground</code> 点击 Run。</li><li>每个标签页独享的 Zustand Thread Store 执行 <code>run()</code>。</li><li>Store 渲染模板变量，整理消息与工具，调用 <code>streamThread()</code>。</li><li><code>streamThread()</code> 把 LLM Space Thread 转成 pi-agent 的上下文，并调用注入的 <code>AgentTransport</code>。</li><li>桌面端的 Transport 通过 Electrobun RPC 发送带 <code>streamId</code> 的消息。</li><li>Bun 主进程把请求路由到本地或远程 <code>RuntimeClient</code>。</li><li><code>StreamThreadController</code> 调用 <code>streamAgent()</code>，后者驱动 <code>agentLoopContinue()</code>。</li><li>模型事件跨边界返回；<code>reduceMessages()</code> 把增量事件折叠成可持久化 Assistant Message。</li><li>Store 更新 React UI；运行结束后记录 Run History，并由标签页持久化 Thread JSON。</li></ol>\n<h2 id=\"s-9-学习方法\">学习方法</h2>\n<p>本课程每个专题都按同一顺序展开：</p>\n<ol><li><strong>先看契约</strong>：类型、接口和 discriminated union 决定系统允许发生什么。</li><li><strong>再看组合根</strong>：对象在哪里创建、依赖如何注入，决定运行时真正使用哪套实现。</li><li><strong>跟踪快乐路径</strong>：从用户动作走到最终副作用。</li><li><strong>检查失败路径</strong>：Abort、网络错误、损坏文件和不兼容协议怎样被隔离。</li><li><strong>用测试反证理解</strong>：测试通常比注释更准确地表达边界条件。</li></ol>\n<h2 id=\"s-12-本章子课程\">本章子课程</h2>\n<ul><li><a href=\"01-learning-map/01-environment-and-monorepo.md\" data-wiki-link=\"01-learning-map/01-environment-and-monorepo.md\">开发环境与 Monorepo</a></li><li><a href=\"01-learning-map/02-product-concepts.md\" data-wiki-link=\"01-learning-map/02-product-concepts.md\">产品概念与领域词汇</a></li><li><a href=\"01-learning-map/03-architecture-tour.md\" data-wiki-link=\"01-learning-map/03-architecture-tour.md\">架构分层与首条调用链</a></li></ul>\n<p>完成本章后再进入 <code>packages/core</code>。如果现在还不能不看图说出上述九步主链路，不要急着阅读大型 React 组件。</p>","markdown":"# 第一章：建立 LLM Space 的全局地图\n\n本章不是从某个组件开始抄代码，而是先建立一张能解释整个仓库的地图。LLM Space 4 是一个面向 Agent 开发者的桌面工作台：用户把模型、提示词、变量、工具和消息保存为 Thread，再运行、观察、修改、回放与评测。理解这个目标后，仓库里的每一层都会有明确位置。\n\n## 学习目标\n\n- 能用一句话解释 `packages/core`、`packages/runtime`、`packages/ui` 与三个 `apps/*` 的边界。\n- 能在本地安装依赖、运行桌面端、运行 Web 端并执行质量检查。\n- 能说清一次 Thread 运行从 React 点击事件到模型流式事件返回的完整路径。\n- 掌握后续课程的阅读方法：先找边界类型，再找组合根，最后沿调用链进入实现。\n\n## 仓库全景\n\n| 区域 | 角色 | 典型依赖方向 |\n| --- | --- | --- |\n| `packages/core` | 跨环境领域模型、Thread 语义、流式 reducer、Agent 服务端核心 | 不依赖 React 或 Electrobun |\n| `packages/runtime` | 模型、MCP、Skills、插件、工具、Trace 与 Runtime 统一接口 | 依赖 `core` |\n| `packages/ui` | React 设计系统与 Thread Playground | 依赖 `core`，通过 HostServices 注入宿主能力 |\n| `apps/desktop` | Electrobun 桌面壳、Bun 主进程、Renderer 与远程运行时管理 | 组合 `core`、`runtime`、`ui` |\n| `apps/server` | 可部署到 Linux 的无界面 Runtime HTTP 服务 | 组合 `core` 与 `runtime` |\n| `apps/web` | 官网与只读共享 Thread 查看器 | 组合 `core` 与 `ui` |\n\n这是一种“内层稳定、外层适配”的架构。领域类型和纯逻辑在内层；文件系统、网络、窗口、SSH 等有副作用的能力留在外层。`HostServices`、`RuntimeClient`、`AgentTransport` 是最重要的三个边界接口。\n\n## 一次运行的主链路\n\n1. 用户在 `ThreadPlayground` 点击 Run。\n2. 每个标签页独享的 Zustand Thread Store 执行 `run()`。\n3. Store 渲染模板变量，整理消息与工具，调用 `streamThread()`。\n4. `streamThread()` 把 LLM Space Thread 转成 pi-agent 的上下文，并调用注入的 `AgentTransport`。\n5. 桌面端的 Transport 通过 Electrobun RPC 发送带 `streamId` 的消息。\n6. Bun 主进程把请求路由到本地或远程 `RuntimeClient`。\n7. `StreamThreadController` 调用 `streamAgent()`，后者驱动 `agentLoopContinue()`。\n8. 模型事件跨边界返回；`reduceMessages()` 把增量事件折叠成可持久化 Assistant Message。\n9. Store 更新 React UI；运行结束后记录 Run History，并由标签页持久化 Thread JSON。\n\n## 学习方法\n\n本课程每个专题都按同一顺序展开：\n\n1. **先看契约**：类型、接口和 discriminated union 决定系统允许发生什么。\n2. **再看组合根**：对象在哪里创建、依赖如何注入，决定运行时真正使用哪套实现。\n3. **跟踪快乐路径**：从用户动作走到最终副作用。\n4. **检查失败路径**：Abort、网络错误、损坏文件和不兼容协议怎样被隔离。\n5. **用测试反证理解**：测试通常比注释更准确地表达边界条件。\n\n## 本章子课程\n\n- [开发环境与 Monorepo](01-learning-map/01-environment-and-monorepo.md)\n- [产品概念与领域词汇](01-learning-map/02-product-concepts.md)\n- [架构分层与首条调用链](01-learning-map/03-architecture-tour.md)\n\n完成本章后再进入 `packages/core`。如果现在还不能不看图说出上述九步主链路，不要急着阅读大型 React 组件。\n","text":" 第一章：建立 LLM Space 的全局地图 本章不是从某个组件开始抄代码，而是先建立一张能解释整个仓库的地图。LLM Space 4 是一个面向 Agent 开发者的桌面工作台：用户把模型、提示词、变量、工具和消息保存为 Thread，再运行、观察、修改、回放与评测。理解这个目标后，仓库里的每一层都会有明确位置。 学习目标 能用一句话解释 packages/core 、 packages/runtime 、 packages/ui 与三个 apps/ 的边界。 能在本地安装依赖、运行桌面端、运行 Web 端并执行质量检查。 能说清一次 Thread 运行从 React 点击事件到模型流式事件返回的完整路径。 掌握后续课程的阅读方法：先找边界类型，再找组合根，最后沿调用链进入实现。 仓库全景 区域 角色 典型依赖方向 packages/core 跨环境领域模型、Thread 语义、流式 reducer、Agent 服务端核心 不依赖 React 或 Electrobun packages/runtime 模型、MCP、Skills、插件、工具、Trace 与 Runtime 统一接口 依赖 core packages/ui React 设计系统与 Thread Playground 依赖 core ，通过 HostServices 注入宿主能力 apps/desktop Electrobun 桌面壳、Bun 主进程、Renderer 与远程运行时管理 组合 core 、 runtime 、 ui apps/server 可部署到 Linux 的无界面 Runtime HTTP 服务 组合 core 与 runtime apps/web 官网与只读共享 Thread 查看器 组合 core 与 ui 这是一种“内层稳定、外层适配”的架构。领域类型和纯逻辑在内层；文件系统、网络、窗口、SSH 等有副作用的能力留在外层。 HostServices 、 RuntimeClient 、 AgentTransport 是最重要的三个边界接口。 一次运行的主链路 1. 用户在 ThreadPlayground 点击 Run。 2. 每个标签页独享的 Zustand Thread Store 执行 run 。 3. Store 渲染模板变量，整理消息与工具，调用 streamThread 。 4. streamThread 把 LLM Space Thread 转成 pi agent 的上下文，并调用注入的 AgentTransport 。 5. 桌面端的 Transport 通过 Electrobun RPC 发送带 streamId 的消息。 6. Bun 主进程把请求路由到本地或远程 RuntimeClient 。 7. StreamThreadController 调用 streamAgent ，后者驱动 agentLoopContinue 。 8. 模型事件跨边界返回； reduceMessages 把增量事件折叠成可持久化 Assistant Message。 9. Store 更新 React UI；运行结束后记录 Run History，并由标签页持久化 Thread JSON。 学习方法 本课程每个专题都按同一顺序展开： 1. 先看契约 ：类型、接口和 discriminated union 决定系统允许发生什么。 2. 再看组合根 ：对象在哪里创建、依赖如何注入，决定运行时真正使用哪套实现。 3. 跟踪快乐路径 ：从用户动作走到最终副作用。 4. 检查失败路径 ：Abort、网络错误、损坏文件和不兼容协议怎样被隔离。 5. 用测试反证理解 ：测试通常比注释更准确地表达边界条件。 本章子课程 开发环境与 Monorepo 01 learning map/01 environment and monorepo.md 产品概念与领域词汇 01 learning map/02 product concepts.md 架构分层与首条调用链 01 learning map/03 architecture tour.md 完成本章后再进入 packages/core 。如果现在还不能不看图说出上述九步主链路，不要急着阅读大型 React 组件。 "},{"id":"01-learning-map/01-environment-and-monorepo","chapterId":"01-learning-map","kind":"lesson","title":"开发环境与 Monorepo","description":"这一节帮助第一次接触 TypeScript 桌面项目的读者把仓库运行起来，并理解“一个仓库、多个可发布单元”的工程组织方式。","source":"01-learning-map/01-environment-and-monorepo.md","level":1,"levelLabel":"入门","prerequisite":"预备课或基本编程概念","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>开发环境与 Monorepo</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>基础概念</strong><p>Monorepo 是把多个相互依赖的包放在同一个 Git 仓库中管理。LLM Space 使用 Bun workspace，根 package.json 的 workspaces 包含 packages/ 与 apps/。内部依赖使用 workspace:，因此修改共享包后不必发布 npm 版本就能被应用消费。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>首次安装</strong><p>它等价于先安装锁定工具，再执行 bun install。如果只想快速安装已有 Bun 环境中的依赖：</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>常用命令</strong><p>了解“常用命令”在本节中的作用与边界。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>为什么存在多个 tsconfig</strong><p>根配置偏向 Bun 环境，而 packages/ui 与 apps/web 需要 DOM、JSX 类型；apps/desktop 同时包含 Bun 主进程与浏览器 Renderer。每个 workspace 的 tsconfig.json 描述自己的运行环境，根 typecheck 将它们全部串起来。新增 workspace 时，只在根配置中“能被编辑器识别”还不够，还必须加入检查脚本。</p></div></div></section>","html":"<h1 id=\"s-0-开发环境与-Monorepo\">开发环境与 Monorepo</h1>\n<p>这一节帮助第一次接触 TypeScript 桌面项目的读者把仓库运行起来，并理解“一个仓库、多个可发布单元”的工程组织方式。</p>\n<h2 id=\"s-2-1-基础概念\">1. 基础概念</h2>\n<p><strong>Monorepo</strong> 是把多个相互依赖的包放在同一个 Git 仓库中管理。LLM Space 使用 Bun workspace，根 <code>package.json</code> 的 <code>workspaces</code> 包含 <code>packages/*</code> 与 <code>apps/*</code>。内部依赖使用 <code>workspace:*</code>，因此修改共享包后不必发布 npm 版本就能被应用消费。</p>\n<p><strong>Bun</strong> 同时承担 JavaScript Runtime、包管理器、脚本执行器和测试运行器。项目明确不使用 npm、pnpm 或 yarn。</p>\n<p><strong>mise</strong> 负责锁定开发工具版本并提供人类可发现的任务入口。<code>mise.toml</code> 声明 Bun 1.3，<code>mise.lock</code> 锁定精确版本与校验和；真正的脚本实现仍在各级 <code>package.json</code>。</p>\n<h2 id=\"s-6-2-首次安装\">2. 首次安装</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-bash\">mise run setup</code></pre></div>\n<p>它等价于先安装锁定工具，再执行 <code>bun install</code>。如果只想快速安装已有 Bun 环境中的依赖：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-bash\">bun install</code></pre></div>\n<p>关键文件：</p>\n<ul><li><code>mise.toml</code>：工具版本、开发、测试、构建、打包与发布任务。</li><li><code>package.json</code>：workspace、共享版本 catalog 和根脚本。</li><li><code>bun.lock</code>：依赖解析结果。</li><li><code>tsconfig.base.json</code>：公共 TypeScript 编译选项。</li><li><code>eslint.config.mjs</code>、<code>.prettierrc</code>：静态检查和格式化规则。</li></ul>\n<h2 id=\"s-12-3-常用命令\">3. 常用命令</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>目标</th><th>命令</th><th>说明</th></tr></thead><tbody><tr><td>桌面开发</td><td><code>mise run dev</code></td><td>Vite HMR + Electrobun，Bun 主进程代码变化通常需重启</td></tr><tr><td>CEF 调试</td><td><code>mise run dev:cef</code></td><td>在 <code>127.0.0.1:9333</code> 开启 CDP</td></tr><tr><td>Web 开发</td><td><code>mise run dev:web</code></td><td>官网与共享 Thread 查看器</td></tr><tr><td>无头服务</td><td><code>mise run dev:server</code></td><td>启动 Remote Runtime 服务</td></tr><tr><td>全量测试</td><td><code>mise run test</code></td><td>Bun 自动发现 <code>*.test.ts(x)</code></td></tr><tr><td>类型检查</td><td><code>mise run typecheck</code></td><td>分别检查各 workspace 的环境类型</td></tr><tr><td>Lint</td><td><code>mise run lint</code></td><td>零 warning 才算通过</td></tr><tr><td>Web 构建</td><td><code>mise run build:web</code></td><td>产物位于 <code>apps/web/dist</code></td></tr></tbody></table></div>\n<h2 id=\"s-14-4-为什么存在多个-tsconfig\">4. 为什么存在多个 tsconfig</h2>\n<p>根配置偏向 Bun 环境，而 <code>packages/ui</code> 与 <code>apps/web</code> 需要 DOM、JSX 类型；<code>apps/desktop</code> 同时包含 Bun 主进程与浏览器 Renderer。每个 workspace 的 <code>tsconfig.json</code> 描述自己的运行环境，根 <code>typecheck</code> 将它们全部串起来。新增 workspace 时，只在根配置中“能被编辑器识别”还不够，还必须加入检查脚本。</p>\n<h2 id=\"s-16-5-从目录判断运行边界\">5. 从目录判断运行边界</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">apps/desktop/src/bun/       Bun 主进程，可访问文件系统与 Electrobun\napps/desktop/src/mainview/  Vite 入口\napps/desktop/src/app/       React 页面与 Provider 组合\napps/desktop/src/shared/    两个进程共同使用的纯类型/协议\npackages/core/src/server/   仅 Node/Bun 可用\npackages/core/src/client/   浏览器安全\npackages/ui/src/            不能导入 Electrobun</code></pre></div>\n<p>看到某段代码前先问：“它会在哪个 JavaScript Runtime 中执行？”很多错误都来自把 Bun-only 模块打进 Web bundle。</p>\n<h2 id=\"s-19-6-开发约定\">6. 开发约定</h2>\n<ul><li>文件名使用 <code>kebab-case</code>。</li><li>组件、类和类型用 <code>PascalCase</code>；函数与变量用 <code>camelCase</code>。</li><li>模块私有函数和类私有字段使用前导下划线。</li><li>共享依赖版本放根 <code>catalog</code>，不要在每个包分别升级。</li><li><code>packages/ui/src/ui/</code> 是生成的 shadcn 原语，不手工修改。</li><li>高频流式列表关注 memo、稳定 props 和窄 Zustand selector。</li></ul>\n<h2 id=\"s-21-7-实践\">7. 实践</h2>\n<ol><li>运行 <code>mise tasks ls</code>，解释每个任务最终转发到了哪个脚本。</li><li>运行 <code>mise run typecheck</code>，观察它为何要检查多个项目。</li><li>找到 <code>@llm-space/core</code> 的 exports map，判断哪些入口可以被浏览器使用。</li><li>修改一个无副作用的文案并运行对应测试，熟悉最小验证闭环。</li></ol>\n<h2 id=\"s-23-检查点\">检查点</h2>\n<p>你应能解释：为什么 <code>packages/core</code> 和 <code>packages/ui</code> 没有独立 build step；为什么直接消费 TypeScript 对 Vite/Bun 可行；为什么共享包中的路径别名可能被宿主 bundler 错误解释。</p>","markdown":"# 开发环境与 Monorepo\n\n这一节帮助第一次接触 TypeScript 桌面项目的读者把仓库运行起来，并理解“一个仓库、多个可发布单元”的工程组织方式。\n\n## 1. 基础概念\n\n**Monorepo** 是把多个相互依赖的包放在同一个 Git 仓库中管理。LLM Space 使用 Bun workspace，根 `package.json` 的 `workspaces` 包含 `packages/*` 与 `apps/*`。内部依赖使用 `workspace:*`，因此修改共享包后不必发布 npm 版本就能被应用消费。\n\n**Bun** 同时承担 JavaScript Runtime、包管理器、脚本执行器和测试运行器。项目明确不使用 npm、pnpm 或 yarn。\n\n**mise** 负责锁定开发工具版本并提供人类可发现的任务入口。`mise.toml` 声明 Bun 1.3，`mise.lock` 锁定精确版本与校验和；真正的脚本实现仍在各级 `package.json`。\n\n## 2. 首次安装\n\n```bash\nmise run setup\n```\n\n它等价于先安装锁定工具，再执行 `bun install`。如果只想快速安装已有 Bun 环境中的依赖：\n\n```bash\nbun install\n```\n\n关键文件：\n\n- `mise.toml`：工具版本、开发、测试、构建、打包与发布任务。\n- `package.json`：workspace、共享版本 catalog 和根脚本。\n- `bun.lock`：依赖解析结果。\n- `tsconfig.base.json`：公共 TypeScript 编译选项。\n- `eslint.config.mjs`、`.prettierrc`：静态检查和格式化规则。\n\n## 3. 常用命令\n\n| 目标 | 命令 | 说明 |\n| --- | --- | --- |\n| 桌面开发 | `mise run dev` | Vite HMR + Electrobun，Bun 主进程代码变化通常需重启 |\n| CEF 调试 | `mise run dev:cef` | 在 `127.0.0.1:9333` 开启 CDP |\n| Web 开发 | `mise run dev:web` | 官网与共享 Thread 查看器 |\n| 无头服务 | `mise run dev:server` | 启动 Remote Runtime 服务 |\n| 全量测试 | `mise run test` | Bun 自动发现 `*.test.ts(x)` |\n| 类型检查 | `mise run typecheck` | 分别检查各 workspace 的环境类型 |\n| Lint | `mise run lint` | 零 warning 才算通过 |\n| Web 构建 | `mise run build:web` | 产物位于 `apps/web/dist` |\n\n## 4. 为什么存在多个 tsconfig\n\n根配置偏向 Bun 环境，而 `packages/ui` 与 `apps/web` 需要 DOM、JSX 类型；`apps/desktop` 同时包含 Bun 主进程与浏览器 Renderer。每个 workspace 的 `tsconfig.json` 描述自己的运行环境，根 `typecheck` 将它们全部串起来。新增 workspace 时，只在根配置中“能被编辑器识别”还不够，还必须加入检查脚本。\n\n## 5. 从目录判断运行边界\n\n```text\napps/desktop/src/bun/       Bun 主进程，可访问文件系统与 Electrobun\napps/desktop/src/mainview/  Vite 入口\napps/desktop/src/app/       React 页面与 Provider 组合\napps/desktop/src/shared/    两个进程共同使用的纯类型/协议\npackages/core/src/server/   仅 Node/Bun 可用\npackages/core/src/client/   浏览器安全\npackages/ui/src/            不能导入 Electrobun\n```\n\n看到某段代码前先问：“它会在哪个 JavaScript Runtime 中执行？”很多错误都来自把 Bun-only 模块打进 Web bundle。\n\n## 6. 开发约定\n\n- 文件名使用 `kebab-case`。\n- 组件、类和类型用 `PascalCase`；函数与变量用 `camelCase`。\n- 模块私有函数和类私有字段使用前导下划线。\n- 共享依赖版本放根 `catalog`，不要在每个包分别升级。\n- `packages/ui/src/ui/` 是生成的 shadcn 原语，不手工修改。\n- 高频流式列表关注 memo、稳定 props 和窄 Zustand selector。\n\n## 7. 实践\n\n1. 运行 `mise tasks ls`，解释每个任务最终转发到了哪个脚本。\n2. 运行 `mise run typecheck`，观察它为何要检查多个项目。\n3. 找到 `@llm-space/core` 的 exports map，判断哪些入口可以被浏览器使用。\n4. 修改一个无副作用的文案并运行对应测试，熟悉最小验证闭环。\n\n## 检查点\n\n你应能解释：为什么 `packages/core` 和 `packages/ui` 没有独立 build step；为什么直接消费 TypeScript 对 Vite/Bun 可行；为什么共享包中的路径别名可能被宿主 bundler 错误解释。\n","text":" 开发环境与 Monorepo 这一节帮助第一次接触 TypeScript 桌面项目的读者把仓库运行起来，并理解“一个仓库、多个可发布单元”的工程组织方式。 1. 基础概念 Monorepo 是把多个相互依赖的包放在同一个 Git 仓库中管理。LLM Space 使用 Bun workspace，根 package.json 的 workspaces 包含 packages/ 与 apps/ 。内部依赖使用 workspace: ，因此修改共享包后不必发布 npm 版本就能被应用消费。 Bun 同时承担 JavaScript Runtime、包管理器、脚本执行器和测试运行器。项目明确不使用 npm、pnpm 或 yarn。 mise 负责锁定开发工具版本并提供人类可发现的任务入口。 mise.toml 声明 Bun 1.3， mise.lock 锁定精确版本与校验和；真正的脚本实现仍在各级 package.json 。 2. 首次安装 bash mise run setup 它等价于先安装锁定工具，再执行 bun install 。如果只想快速安装已有 Bun 环境中的依赖： bash bun install 关键文件： mise.toml ：工具版本、开发、测试、构建、打包与发布任务。 package.json ：workspace、共享版本 catalog 和根脚本。 bun.lock ：依赖解析结果。 tsconfig.base.json ：公共 TypeScript 编译选项。 eslint.config.mjs 、 .prettierrc ：静态检查和格式化规则。 3. 常用命令 目标 命令 说明 桌面开发 mise run dev Vite HMR + Electrobun，Bun 主进程代码变化通常需重启 CEF 调试 mise run dev:cef 在 127.0.0.1:9333 开启 CDP Web 开发 mise run dev:web 官网与共享 Thread 查看器 无头服务 mise run dev:server 启动 Remote Runtime 服务 全量测试 mise run test Bun 自动发现 .test.ts x 类型检查 mise run typecheck 分别检查各 workspace 的环境类型 Lint mise run lint 零 warning 才算通过 Web 构建 mise run build:web 产物位于 apps/web/dist 4. 为什么存在多个 tsconfig 根配置偏向 Bun 环境，而 packages/ui 与 apps/web 需要 DOM、JSX 类型； apps/desktop 同时包含 Bun 主进程与浏览器 Renderer。每个 workspace 的 tsconfig.json 描述自己的运行环境，根 typecheck 将它们全部串起来。新增 workspace 时，只在根配置中“能被编辑器识别”还不够，还必须加入检查脚本。 5. 从目录判断运行边界 text apps/desktop/src/bun/ Bun 主进程，可访问文件系统与 Electrobun apps/desktop/src/mainview/ Vite 入口 apps/desktop/src/app/ React 页面与 Provider 组合 apps/desktop/src/shared/ 两个进程共同使用的纯类型/协议 packages/core/src/server/ 仅 Node/Bun 可用 packages/core/src/client/ 浏览器安全 packages/ui/src/ 不能导入 Electrobun 看到某段代码前先问：“它会在哪个 JavaScript Runtime 中执行？”很多错误都来自把 Bun only 模块打进 Web bundle。 6. 开发约定 文件名使用 kebab case 。 组件、类和类型用 PascalCase ；函数与变量用 camelCase 。 模块私有函数和类私有字段使用前导下划线。 共享依赖版本放根 catalog ，不要在每个包分别升级。 packages/ui/src/ui/ 是生成的 shadcn 原语，不手工修改。 高频流式列表关注 memo、稳定 props 和窄 Zustand selector。 7. 实践 1. 运行 mise tasks ls ，解释每个任务最终转发到了哪个脚本。 2. 运行 mise run typecheck ，观察它为何要检查多个项目。 3. 找到 @llm space/core 的 exports map，判断哪些入口可以被浏览器使用。 4. 修改一个无副作用的文案并运行对应测试，熟悉最小验证闭环。 检查点 你应能解释：为什么 packages/core 和 packages/ui 没有独立 build step；为什么直接消费 TypeScript 对 Vite/Bun 可行；为什么共享包中的路径别名可能被宿主 bundler 错误解释。 "},{"id":"01-learning-map/02-product-concepts","chapterId":"01-learning-map","kind":"lesson","title":"产品概念与领域词汇","description":"阅读源码前必须先理解产品语言。领域词汇不是 UI 标签的集合，而是代码中的稳定概念。","source":"01-learning-map/02-product-concepts.md","level":1,"levelLabel":"入门","prerequisite":"预备课或基本编程概念","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>产品概念与领域词汇</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>Thread：可执行的 Agent 实验文档</strong><p>这里的 Thread 不是操作系统线程，而是一份可保存的 JSON 文档。它包含：</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>Message 与 Tool Call</strong><p>领域层只保存 User 和 Assistant 两类消息。工具调用挂在 Assistant Message 的 toolCalls 中，结果保存在对应 Tool Call 的 output，而不是单独保存一条 Tool Result 领域消息。转换到 pi-agent 协议时，converter 才会产生运行时需要的工具结果消息。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>Model 与 Provider</strong><p>模型配置由 ModelManager 管理，运行时通过 resolveConnection() 得到 API Key、Base URL 与 Headers。敏感凭证不会塞入 Thread JSON。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>五类工具与执行所有权</strong><p>“谁执行”是理解工具系统的钥匙。Provider-Hosted Tool 原样进入模型请求，由服务商内部完成，因此不受本地 Auto run tools 或 ReAct loop 控制。</p></div></div></section>","html":"<h1 id=\"s-0-产品概念与领域词汇\">产品概念与领域词汇</h1>\n<p>阅读源码前必须先理解产品语言。领域词汇不是 UI 标签的集合，而是代码中的稳定概念。</p>\n<h2 id=\"s-2-Thread-可执行的-Agent-实验文档\">Thread：可执行的 Agent 实验文档</h2>\n<p>这里的 Thread 不是操作系统线程，而是一份可保存的 JSON 文档。它包含：</p>\n<ul><li><code>title</code>：标题。</li><li><code>model</code>：Provider、模型 ID 与参数。</li><li><code>context.systemPrompt</code>：全局提示词。</li><li><code>context.variables</code> 与 <code>variableVariants</code>：内置和自定义变量。</li><li><code>context.tools</code>：内置、MCP、插件、自定义函数和 Provider-Hosted Tools。</li><li><code>context.messages</code>：User 与 Assistant 消息。</li><li><code>runHistory</code>、<code>evaluationRubrics</code>、<code>evaluations</code>：运行快照与人工评测。</li></ul>\n<p><code>ThreadContext</code> 是模型本次运行真正需要的上下文，<code>Thread</code> 则是完整的持久化文档。源码定义在 <code>packages/core/src/types/threads/thread.ts</code>。</p>\n<h2 id=\"s-6-Message-与-Tool-Call\">Message 与 Tool Call</h2>\n<p>领域层只保存 User 和 Assistant 两类消息。工具调用挂在 Assistant Message 的 <code>toolCalls</code> 中，结果保存在对应 Tool Call 的 <code>output</code>，而不是单独保存一条 Tool Result 领域消息。转换到 pi-agent 协议时，converter 才会产生运行时需要的工具结果消息。</p>\n<p>这种结构适合可视化编辑：请求、参数和结果在一个工具卡片内，用户可以修改结果后继续运行。</p>\n<h2 id=\"s-9-Model-与-Provider\">Model 与 Provider</h2>\n<ul><li><strong>Provider</strong> 是调用模型服务所需的全局连接配置，包括 API 协议、Base URL、认证和可选模型。</li><li><strong>Model</strong> 是某个 Thread 选择的具体模型及运行参数。</li><li><strong>Provider Profile</strong> 是同一 Provider 的一组临时连接选择；它属于标签页运行状态，不写回 Thread。</li></ul>\n<p>模型配置由 <code>ModelManager</code> 管理，运行时通过 <code>resolveConnection()</code> 得到 API Key、Base URL 与 Headers。敏感凭证不会塞入 Thread JSON。</p>\n<h2 id=\"s-12-五类工具与执行所有权\">五类工具与执行所有权</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>类型</th><th>谁执行</th><th>是否产生本地 Tool Call</th></tr></thead><tbody><tr><td>Built-in</td><td>Runtime 内置实现</td><td>是</td></tr><tr><td>MCP</td><td>MCP Server</td><td>是</td></tr><tr><td>Plugin Tool</td><td>本机插件子进程</td><td>是</td></tr><tr><td>Custom Function</td><td>用户或外部系统补结果</td><td>是</td></tr><tr><td>Provider-Hosted</td><td>模型服务内部</td><td>否</td></tr></tbody></table></div>\n<p>“谁执行”是理解工具系统的钥匙。Provider-Hosted Tool 原样进入模型请求，由服务商内部完成，因此不受本地 Auto run tools 或 ReAct loop 控制。</p>\n<h2 id=\"s-15-Agent-loop-与-ReAct\">Agent loop 与 ReAct</h2>\n<p>ReAct 可粗略理解为“推理/决定行动 -&gt; 调工具 -&gt; 观察结果 -&gt; 再继续”。LLM Space 有意支持两种体验：</p>\n<ol><li><strong>单步调试</strong>：模型产生 Tool Call 后停止，用户检查或修改结果，再手动 Continue。</li><li><strong>自动循环</strong>：应用执行可执行工具并继续模型调用，直到模型不再调用工具。</li></ol>\n<p>Store 用最多 50 个模型轮次作为保险，避免错误提示词或模型无限循环。</p>\n<h2 id=\"s-19-Variables-Template-与-Snapshot\">Variables、Template 与 Snapshot</h2>\n<p>变量让 Prompt 复用动态值；Nunjucks 模板支持条件、循环、过滤器和 <code>@include</code>。真正重要的是 Snapshot：某个 Prompt 位置第一次运行时解析出的变量值会被冻结。以后时间或文件内容改变，旧对话前缀仍能复现原来的输入。</p>\n<p>这体现了调试工具的核心原则：可编辑不等于可以破坏历史证据。</p>\n<h2 id=\"s-22-Run-History-与-Evaluation\">Run History 与 Evaluation</h2>\n<p>完成一次运行后，系统保存 Thread Snapshot、时间和 usage。Snapshot 故意排除 <code>runHistory</code> 与评测定义，避免递归膨胀。</p>\n<p>Evaluation 可以比较两次稳定 Run ID，保存 verdict、备注、Rubric 快照和逐项 1–5 分。Rubric 被修改后，历史评测仍保留当时的不可变定义。</p>\n<h2 id=\"s-25-Runtime\">Runtime</h2>\n<p>Runtime 是一组能力的集合：模型、文件系统、MCP、工具、Skills、Search、Network、Trace 与流式运行。它可以是：</p>\n<ul><li><code>local</code>：桌面 Bun 主进程中的本地实现。</li><li><code>remote</code>：通过 SSH tunnel 连接 Linux 上的 <code>apps/server</code>。</li></ul>\n<p>UI 操作携带 <code>runtimeId</code>，保证模型、文件、工具都来自 Thread 所属 Runtime。</p>\n<h2 id=\"s-29-Trace-与-Thread-的区别\">Trace 与 Thread 的区别</h2>\n<p>Thread 是可编辑、可运行的实验；Trace 是外部 Agent 运行的观测证据。Trace Workbench 可以把一次观测转换成可编辑 Thread，帮助复现问题。不要把 Trace 当作另一种 Thread 存储目录。</p>\n<h2 id=\"s-31-检查点\">检查点</h2>\n<p>尝试回答：</p>\n<ol><li>为什么 Provider Profile 不应持久化进 Thread？</li><li>为什么 Provider-Hosted Tool 不会进入本地工具执行器？</li><li>为什么 Prompt 变量需要按“位置”冻结，而不是只冻结一份全局值？</li><li>为什么 Thread Snapshot 不能包含自身的 run history？</li></ol>","markdown":"# 产品概念与领域词汇\n\n阅读源码前必须先理解产品语言。领域词汇不是 UI 标签的集合，而是代码中的稳定概念。\n\n## Thread：可执行的 Agent 实验文档\n\n这里的 Thread 不是操作系统线程，而是一份可保存的 JSON 文档。它包含：\n\n- `title`：标题。\n- `model`：Provider、模型 ID 与参数。\n- `context.systemPrompt`：全局提示词。\n- `context.variables` 与 `variableVariants`：内置和自定义变量。\n- `context.tools`：内置、MCP、插件、自定义函数和 Provider-Hosted Tools。\n- `context.messages`：User 与 Assistant 消息。\n- `runHistory`、`evaluationRubrics`、`evaluations`：运行快照与人工评测。\n\n`ThreadContext` 是模型本次运行真正需要的上下文，`Thread` 则是完整的持久化文档。源码定义在 `packages/core/src/types/threads/thread.ts`。\n\n## Message 与 Tool Call\n\n领域层只保存 User 和 Assistant 两类消息。工具调用挂在 Assistant Message 的 `toolCalls` 中，结果保存在对应 Tool Call 的 `output`，而不是单独保存一条 Tool Result 领域消息。转换到 pi-agent 协议时，converter 才会产生运行时需要的工具结果消息。\n\n这种结构适合可视化编辑：请求、参数和结果在一个工具卡片内，用户可以修改结果后继续运行。\n\n## Model 与 Provider\n\n- **Provider** 是调用模型服务所需的全局连接配置，包括 API 协议、Base URL、认证和可选模型。\n- **Model** 是某个 Thread 选择的具体模型及运行参数。\n- **Provider Profile** 是同一 Provider 的一组临时连接选择；它属于标签页运行状态，不写回 Thread。\n\n模型配置由 `ModelManager` 管理，运行时通过 `resolveConnection()` 得到 API Key、Base URL 与 Headers。敏感凭证不会塞入 Thread JSON。\n\n## 五类工具与执行所有权\n\n| 类型 | 谁执行 | 是否产生本地 Tool Call |\n| --- | --- | --- |\n| Built-in | Runtime 内置实现 | 是 |\n| MCP | MCP Server | 是 |\n| Plugin Tool | 本机插件子进程 | 是 |\n| Custom Function | 用户或外部系统补结果 | 是 |\n| Provider-Hosted | 模型服务内部 | 否 |\n\n“谁执行”是理解工具系统的钥匙。Provider-Hosted Tool 原样进入模型请求，由服务商内部完成，因此不受本地 Auto run tools 或 ReAct loop 控制。\n\n## Agent loop 与 ReAct\n\nReAct 可粗略理解为“推理/决定行动 -> 调工具 -> 观察结果 -> 再继续”。LLM Space 有意支持两种体验：\n\n1. **单步调试**：模型产生 Tool Call 后停止，用户检查或修改结果，再手动 Continue。\n2. **自动循环**：应用执行可执行工具并继续模型调用，直到模型不再调用工具。\n\nStore 用最多 50 个模型轮次作为保险，避免错误提示词或模型无限循环。\n\n## Variables、Template 与 Snapshot\n\n变量让 Prompt 复用动态值；Nunjucks 模板支持条件、循环、过滤器和 `@include`。真正重要的是 Snapshot：某个 Prompt 位置第一次运行时解析出的变量值会被冻结。以后时间或文件内容改变，旧对话前缀仍能复现原来的输入。\n\n这体现了调试工具的核心原则：可编辑不等于可以破坏历史证据。\n\n## Run History 与 Evaluation\n\n完成一次运行后，系统保存 Thread Snapshot、时间和 usage。Snapshot 故意排除 `runHistory` 与评测定义，避免递归膨胀。\n\nEvaluation 可以比较两次稳定 Run ID，保存 verdict、备注、Rubric 快照和逐项 1–5 分。Rubric 被修改后，历史评测仍保留当时的不可变定义。\n\n## Runtime\n\nRuntime 是一组能力的集合：模型、文件系统、MCP、工具、Skills、Search、Network、Trace 与流式运行。它可以是：\n\n- `local`：桌面 Bun 主进程中的本地实现。\n- `remote`：通过 SSH tunnel 连接 Linux 上的 `apps/server`。\n\nUI 操作携带 `runtimeId`，保证模型、文件、工具都来自 Thread 所属 Runtime。\n\n## Trace 与 Thread 的区别\n\nThread 是可编辑、可运行的实验；Trace 是外部 Agent 运行的观测证据。Trace Workbench 可以把一次观测转换成可编辑 Thread，帮助复现问题。不要把 Trace 当作另一种 Thread 存储目录。\n\n## 检查点\n\n尝试回答：\n\n1. 为什么 Provider Profile 不应持久化进 Thread？\n2. 为什么 Provider-Hosted Tool 不会进入本地工具执行器？\n3. 为什么 Prompt 变量需要按“位置”冻结，而不是只冻结一份全局值？\n4. 为什么 Thread Snapshot 不能包含自身的 run history？\n","text":" 产品概念与领域词汇 阅读源码前必须先理解产品语言。领域词汇不是 UI 标签的集合，而是代码中的稳定概念。 Thread：可执行的 Agent 实验文档 这里的 Thread 不是操作系统线程，而是一份可保存的 JSON 文档。它包含： title ：标题。 model ：Provider、模型 ID 与参数。 context.systemPrompt ：全局提示词。 context.variables 与 variableVariants ：内置和自定义变量。 context.tools ：内置、MCP、插件、自定义函数和 Provider Hosted Tools。 context.messages ：User 与 Assistant 消息。 runHistory 、 evaluationRubrics 、 evaluations ：运行快照与人工评测。 ThreadContext 是模型本次运行真正需要的上下文， Thread 则是完整的持久化文档。源码定义在 packages/core/src/types/threads/thread.ts 。 Message 与 Tool Call 领域层只保存 User 和 Assistant 两类消息。工具调用挂在 Assistant Message 的 toolCalls 中，结果保存在对应 Tool Call 的 output ，而不是单独保存一条 Tool Result 领域消息。转换到 pi agent 协议时，converter 才会产生运行时需要的工具结果消息。 这种结构适合可视化编辑：请求、参数和结果在一个工具卡片内，用户可以修改结果后继续运行。 Model 与 Provider Provider 是调用模型服务所需的全局连接配置，包括 API 协议、Base URL、认证和可选模型。 Model 是某个 Thread 选择的具体模型及运行参数。 Provider Profile 是同一 Provider 的一组临时连接选择；它属于标签页运行状态，不写回 Thread。 模型配置由 ModelManager 管理，运行时通过 resolveConnection 得到 API Key、Base URL 与 Headers。敏感凭证不会塞入 Thread JSON。 五类工具与执行所有权 类型 谁执行 是否产生本地 Tool Call Built in Runtime 内置实现 是 MCP MCP Server 是 Plugin Tool 本机插件子进程 是 Custom Function 用户或外部系统补结果 是 Provider Hosted 模型服务内部 否 “谁执行”是理解工具系统的钥匙。Provider Hosted Tool 原样进入模型请求，由服务商内部完成，因此不受本地 Auto run tools 或 ReAct loop 控制。 Agent loop 与 ReAct ReAct 可粗略理解为“推理/决定行动 调工具 观察结果 再继续”。LLM Space 有意支持两种体验： 1. 单步调试 ：模型产生 Tool Call 后停止，用户检查或修改结果，再手动 Continue。 2. 自动循环 ：应用执行可执行工具并继续模型调用，直到模型不再调用工具。 Store 用最多 50 个模型轮次作为保险，避免错误提示词或模型无限循环。 Variables、Template 与 Snapshot 变量让 Prompt 复用动态值；Nunjucks 模板支持条件、循环、过滤器和 @include 。真正重要的是 Snapshot：某个 Prompt 位置第一次运行时解析出的变量值会被冻结。以后时间或文件内容改变，旧对话前缀仍能复现原来的输入。 这体现了调试工具的核心原则：可编辑不等于可以破坏历史证据。 Run History 与 Evaluation 完成一次运行后，系统保存 Thread Snapshot、时间和 usage。Snapshot 故意排除 runHistory 与评测定义，避免递归膨胀。 Evaluation 可以比较两次稳定 Run ID，保存 verdict、备注、Rubric 快照和逐项 1–5 分。Rubric 被修改后，历史评测仍保留当时的不可变定义。 Runtime Runtime 是一组能力的集合：模型、文件系统、MCP、工具、Skills、Search、Network、Trace 与流式运行。它可以是： local ：桌面 Bun 主进程中的本地实现。 remote ：通过 SSH tunnel 连接 Linux 上的 apps/server 。 UI 操作携带 runtimeId ，保证模型、文件、工具都来自 Thread 所属 Runtime。 Trace 与 Thread 的区别 Thread 是可编辑、可运行的实验；Trace 是外部 Agent 运行的观测证据。Trace Workbench 可以把一次观测转换成可编辑 Thread，帮助复现问题。不要把 Trace 当作另一种 Thread 存储目录。 检查点 尝试回答： 1. 为什么 Provider Profile 不应持久化进 Thread？ 2. 为什么 Provider Hosted Tool 不会进入本地工具执行器？ 3. 为什么 Prompt 变量需要按“位置”冻结，而不是只冻结一份全局值？ 4. 为什么 Thread Snapshot 不能包含自身的 run history？ "},{"id":"01-learning-map/03-architecture-tour","chapterId":"01-learning-map","kind":"lesson","title":"架构分层与首条调用链","description":"这一节用三个边界接口串起全项目：AgentTransport、RuntimeClient 与 HostServices。","source":"01-learning-map/03-architecture-tour.md","level":1,"levelLabel":"入门","prerequisite":"预备课或基本编程概念","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>架构分层与首条调用链</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>分层不是目录美化</strong><p>每一层只依赖下一层公开的契约。这样同一套 Thread Playground 才能在桌面端可编辑运行、在 Web 端只读展示。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>AgentTransport：隐藏传输方式</strong><p>packages/core/src/client/transport.ts 定义一个接收 AgentStreamRequest、返回 AsyncGenerator 的函数接口。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>RuntimeClient：隐藏执行位置</strong><p>packages/runtime/src/runtime/types.ts 统一定义模型、文件系统、MCP、工具、Skills、网络、搜索、Trace 和流式运行能力。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>HostServices：隐藏宿主平台</strong><p>共享 UI 不能直接导入 Electrobun。HostServices 注入：</p></div></div></section>","html":"<h1 id=\"s-0-架构分层与首条调用链\">架构分层与首条调用链</h1>\n<p>这一节用三个边界接口串起全项目：<code>AgentTransport</code>、<code>RuntimeClient</code> 与 <code>HostServices</code>。</p>\n<h2 id=\"s-2-1-分层不是目录美化\">1. 分层不是目录美化</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">React UI\n  ↓ HostServices / ModelClient\nDesktop Renderer adapters\n  ↓ Electrobun typed RPC\nDesktop Bun composition root\n  ↓ RuntimeRouter\nLocalRuntimeClient / RemoteRuntimeClient\n  ↓ Managers + Registries\ncore streamAgent / persistence\n  ↓ pi-agent-core / filesystem / network</code></pre></div>\n<p>每一层只依赖下一层公开的契约。这样同一套 Thread Playground 才能在桌面端可编辑运行、在 Web 端只读展示。</p>\n<h2 id=\"s-5-2-AgentTransport-隐藏传输方式\">2. AgentTransport：隐藏传输方式</h2>\n<p><code>packages/core/src/client/transport.ts</code> 定义一个接收 <code>AgentStreamRequest</code>、返回 <code>AsyncGenerator&lt;AgentEvent&gt;</code> 的函数接口。</p>\n<ul><li>默认 HTTP Transport 使用 PO
