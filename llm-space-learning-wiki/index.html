ST + SSE。</li><li>桌面 <code>createRpcTransport()</code> 用 Electrobun fire-and-forget message 模拟流。</li></ul>\n<p><code>streamThread()</code> 不知道事件从 HTTP 还是 RPC 来，因此领域运行逻辑可以复用。</p>\n<h2 id=\"s-9-3-RuntimeClient-隐藏执行位置\">3. RuntimeClient：隐藏执行位置</h2>\n<p><code>packages/runtime/src/runtime/types.ts</code> 统一定义模型、文件系统、MCP、工具、Skills、网络、搜索、Trace 和流式运行能力。</p>\n<ul><li><code>LocalRuntimeClient</code> 把方法委派给进程内 Manager。</li><li><code>RemoteRuntimeClient</code> 把同一方法编码成 <code>/rpc</code> 或 <code>/stream</code> 请求。</li><li><code>RuntimeRouter</code> 根据 <code>runtimeId</code> 选择实例。</li></ul>\n<p>新增远程能力不能只改服务端：还要同步改 capability、Client 方法、共享 RPC method、server dispatcher，并升级协议版本。</p>\n<h2 id=\"s-13-4-HostServices-隐藏宿主平台\">4. HostServices：隐藏宿主平台</h2>\n<p>共享 UI 不能直接导入 Electrobun。<code>HostServices</code> 注入：</p>\n<ul><li>Transport 和工具执行。</li><li>Skills、MCP、内置工具、插件工具查询。</li><li>文件、路径和 Generator 能力。</li><li>打开设置、链接、分享等宿主动作。</li></ul>\n<p>桌面实现调用 RPC 与 Command Bus；Web 实现设置 <code>presentational: true</code>，返回空集合或禁用副作用。</p>\n<h2 id=\"s-17-5-从-Run-到-UI-更新\">5. 从 Run 到 UI 更新</h2>\n<p>关键源码顺序：</p>\n<ol><li><code>packages/ui/.../stores/thread-store.ts</code> 的 <code>run()</code>。</li><li><code>packages/core/src/thread/prompt-variables.ts</code> 渲染上下文。</li><li><code>packages/core/src/client/api.ts</code> 的 <code>streamThread()</code>。</li><li><code>apps/desktop/src/client/rpc-transport.ts</code> 的 <code>createRpcTransport()</code>。</li><li><code>apps/desktop/src/bun/rpc/</code> 的 stream 转发。</li><li><code>packages/runtime/src/streaming/stream-thread.ts</code>。</li><li><code>packages/core/src/server/agent/stream.ts</code>。</li><li><code>packages/core/src/client/reducer.ts</code>。</li></ol>\n<h3 id=\"s-20-AsyncGenerator-是什么\">AsyncGenerator 是什么</h3>\n<p>普通 Promise 只返回一次最终值；AsyncGenerator 可以在任务未结束时持续 <code>yield</code> 事件。消费端使用：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">for await (const event of stream) {\n  // 增量更新界面\n}</code></pre></div>\n<p>它非常适合 token streaming。取消由 <code>AbortSignal</code> 贯穿所有层；消费者提前退出时 Transport 也会主动通知上游停止。</p>\n<h2 id=\"s-24-6-组合根\">6. 组合根</h2>\n<p><code>apps/desktop/src/bun/app/start-desktop-app.ts</code> 是最重要的阅读入口。它按顺序创建 Network、MCP、Model、Skills、Plugin、Storage、Trace、Streaming、Tool Registry、Local Runtime、Router、Remote Manager、RPC 与 Window。</p>\n<p>组合根回答三个问题：</p>\n<ul><li>实际实例是谁？</li><li>生命周期由谁拥有？</li><li>关闭时按什么顺序释放？</li></ul>\n<p>不要只看 class 定义后猜运行方式。</p>\n<h2 id=\"s-29-7-错误隔离\">7. 错误隔离</h2>\n<ul><li>流式运行错误被转换为同一 <code>streamId</code> 的 error message。</li><li>损坏 JSON 会尝试恢复或保留备份。</li><li>MCP/插件单体故障不能阻止应用启动。</li><li>Remote 连接失败不会在新连接尚未成功时破坏当前可用连接。</li><li>Provider 错误保留服务端语义，不静默删除用户配置。</li></ul>\n<h2 id=\"s-31-8-练习-手工画序列图\">8. 练习：手工画序列图</h2>\n<p>以一次“模型调用 <code>web_search</code>，应用自动执行，再继续生成答案”为例，画出：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">User → Store → Transport → Runtime → Model\nModel → ToolCall → Store → executeTool → Builtin Registry\nTool Result → Store → Transport → Model → Final Answer</code></pre></div>\n<p>在每条箭头旁写出实际函数名、数据类型和取消点。这张图将成为后续阅读的索引。</p>","markdown":"# 架构分层与首条调用链\n\n这一节用三个边界接口串起全项目：`AgentTransport`、`RuntimeClient` 与 `HostServices`。\n\n## 1. 分层不是目录美化\n\n```text\nReact UI\n  ↓ HostServices / ModelClient\nDesktop Renderer adapters\n  ↓ Electrobun typed RPC\nDesktop Bun composition root\n  ↓ RuntimeRouter\nLocalRuntimeClient / RemoteRuntimeClient\n  ↓ Managers + Registries\ncore streamAgent / persistence\n  ↓ pi-agent-core / filesystem / network\n```\n\n每一层只依赖下一层公开的契约。这样同一套 Thread Playground 才能在桌面端可编辑运行、在 Web 端只读展示。\n\n## 2. AgentTransport：隐藏传输方式\n\n`packages/core/src/client/transport.ts` 定义一个接收 `AgentStreamRequest`、返回 `AsyncGenerator<AgentEvent>` 的函数接口。\n\n- 默认 HTTP Transport 使用 POST + SSE。\n- 桌面 `createRpcTransport()` 用 Electrobun fire-and-forget message 模拟流。\n\n`streamThread()` 不知道事件从 HTTP 还是 RPC 来，因此领域运行逻辑可以复用。\n\n## 3. RuntimeClient：隐藏执行位置\n\n`packages/runtime/src/runtime/types.ts` 统一定义模型、文件系统、MCP、工具、Skills、网络、搜索、Trace 和流式运行能力。\n\n- `LocalRuntimeClient` 把方法委派给进程内 Manager。\n- `RemoteRuntimeClient` 把同一方法编码成 `/rpc` 或 `/stream` 请求。\n- `RuntimeRouter` 根据 `runtimeId` 选择实例。\n\n新增远程能力不能只改服务端：还要同步改 capability、Client 方法、共享 RPC method、server dispatcher，并升级协议版本。\n\n## 4. HostServices：隐藏宿主平台\n\n共享 UI 不能直接导入 Electrobun。`HostServices` 注入：\n\n- Transport 和工具执行。\n- Skills、MCP、内置工具、插件工具查询。\n- 文件、路径和 Generator 能力。\n- 打开设置、链接、分享等宿主动作。\n\n桌面实现调用 RPC 与 Command Bus；Web 实现设置 `presentational: true`，返回空集合或禁用副作用。\n\n## 5. 从 Run 到 UI 更新\n\n关键源码顺序：\n\n1. `packages/ui/.../stores/thread-store.ts` 的 `run()`。\n2. `packages/core/src/thread/prompt-variables.ts` 渲染上下文。\n3. `packages/core/src/client/api.ts` 的 `streamThread()`。\n4. `apps/desktop/src/client/rpc-transport.ts` 的 `createRpcTransport()`。\n5. `apps/desktop/src/bun/rpc/` 的 stream 转发。\n6. `packages/runtime/src/streaming/stream-thread.ts`。\n7. `packages/core/src/server/agent/stream.ts`。\n8. `packages/core/src/client/reducer.ts`。\n\n### AsyncGenerator 是什么\n\n普通 Promise 只返回一次最终值；AsyncGenerator 可以在任务未结束时持续 `yield` 事件。消费端使用：\n\n```ts\nfor await (const event of stream) {\n  // 增量更新界面\n}\n```\n\n它非常适合 token streaming。取消由 `AbortSignal` 贯穿所有层；消费者提前退出时 Transport 也会主动通知上游停止。\n\n## 6. 组合根\n\n`apps/desktop/src/bun/app/start-desktop-app.ts` 是最重要的阅读入口。它按顺序创建 Network、MCP、Model、Skills、Plugin、Storage、Trace、Streaming、Tool Registry、Local Runtime、Router、Remote Manager、RPC 与 Window。\n\n组合根回答三个问题：\n\n- 实际实例是谁？\n- 生命周期由谁拥有？\n- 关闭时按什么顺序释放？\n\n不要只看 class 定义后猜运行方式。\n\n## 7. 错误隔离\n\n- 流式运行错误被转换为同一 `streamId` 的 error message。\n- 损坏 JSON 会尝试恢复或保留备份。\n- MCP/插件单体故障不能阻止应用启动。\n- Remote 连接失败不会在新连接尚未成功时破坏当前可用连接。\n- Provider 错误保留服务端语义，不静默删除用户配置。\n\n## 8. 练习：手工画序列图\n\n以一次“模型调用 `web_search`，应用自动执行，再继续生成答案”为例，画出：\n\n```text\nUser → Store → Transport → Runtime → Model\nModel → ToolCall → Store → executeTool → Builtin Registry\nTool Result → Store → Transport → Model → Final Answer\n```\n\n在每条箭头旁写出实际函数名、数据类型和取消点。这张图将成为后续阅读的索引。\n","text":" 架构分层与首条调用链 这一节用三个边界接口串起全项目： AgentTransport 、 RuntimeClient 与 HostServices 。 1. 分层不是目录美化 text React UI ↓ HostServices / ModelClient Desktop Renderer adapters ↓ Electrobun typed RPC Desktop Bun composition root ↓ RuntimeRouter LocalRuntimeClient / RemoteRuntimeClient ↓ Managers + Registries core streamAgent / persistence ↓ pi agent core / filesystem / network 每一层只依赖下一层公开的契约。这样同一套 Thread Playground 才能在桌面端可编辑运行、在 Web 端只读展示。 2. AgentTransport：隐藏传输方式 packages/core/src/client/transport.ts 定义一个接收 AgentStreamRequest 、返回 AsyncGenerator<AgentEvent 的函数接口。 默认 HTTP Transport 使用 POST + SSE。 桌面 createRpcTransport 用 Electrobun fire and forget message 模拟流。 streamThread 不知道事件从 HTTP 还是 RPC 来，因此领域运行逻辑可以复用。 3. RuntimeClient：隐藏执行位置 packages/runtime/src/runtime/types.ts 统一定义模型、文件系统、MCP、工具、Skills、网络、搜索、Trace 和流式运行能力。 LocalRuntimeClient 把方法委派给进程内 Manager。 RemoteRuntimeClient 把同一方法编码成 /rpc 或 /stream 请求。 RuntimeRouter 根据 runtimeId 选择实例。 新增远程能力不能只改服务端：还要同步改 capability、Client 方法、共享 RPC method、server dispatcher，并升级协议版本。 4. HostServices：隐藏宿主平台 共享 UI 不能直接导入 Electrobun。 HostServices 注入： Transport 和工具执行。 Skills、MCP、内置工具、插件工具查询。 文件、路径和 Generator 能力。 打开设置、链接、分享等宿主动作。 桌面实现调用 RPC 与 Command Bus；Web 实现设置 presentational: true ，返回空集合或禁用副作用。 5. 从 Run 到 UI 更新 关键源码顺序： 1. packages/ui/.../stores/thread store.ts 的 run 。 2. packages/core/src/thread/prompt variables.ts 渲染上下文。 3. packages/core/src/client/api.ts 的 streamThread 。 4. apps/desktop/src/client/rpc transport.ts 的 createRpcTransport 。 5. apps/desktop/src/bun/rpc/ 的 stream 转发。 6. packages/runtime/src/streaming/stream thread.ts 。 7. packages/core/src/server/agent/stream.ts 。 8. packages/core/src/client/reducer.ts 。 AsyncGenerator 是什么 普通 Promise 只返回一次最终值；AsyncGenerator 可以在任务未结束时持续 yield 事件。消费端使用： ts for await const event of stream { // 增量更新界面 } 它非常适合 token streaming。取消由 AbortSignal 贯穿所有层；消费者提前退出时 Transport 也会主动通知上游停止。 6. 组合根 apps/desktop/src/bun/app/start desktop app.ts 是最重要的阅读入口。它按顺序创建 Network、MCP、Model、Skills、Plugin、Storage、Trace、Streaming、Tool Registry、Local Runtime、Router、Remote Manager、RPC 与 Window。 组合根回答三个问题： 实际实例是谁？ 生命周期由谁拥有？ 关闭时按什么顺序释放？ 不要只看 class 定义后猜运行方式。 7. 错误隔离 流式运行错误被转换为同一 streamId 的 error message。 损坏 JSON 会尝试恢复或保留备份。 MCP/插件单体故障不能阻止应用启动。 Remote 连接失败不会在新连接尚未成功时破坏当前可用连接。 Provider 错误保留服务端语义，不静默删除用户配置。 8. 练习：手工画序列图 以一次“模型调用 web search ，应用自动执行，再继续生成答案”为例，画出： text User → Store → Transport → Runtime → Model Model → ToolCall → Store → executeTool → Builtin Registry Tool Result → Store → Transport → Model → Final Answer 在每条箭头旁写出实际函数名、数据类型和取消点。这张图将成为后续阅读的索引。 "},{"id":"02-core-domain","chapterId":"02-core-domain","kind":"chapter","title":"第二章：Core 领域层","description":"@llm-space/core 是全项目最值得先掌握的包。它定义 Thread、Message、Tool、Model 等领域协议，并提供模板、历史、解析、流式转换、存储和代码生成逻辑。这里的代码尽量不依赖 React、Electrobun 或具体平台。","source":"02-core-domain.md","level":2,"levelLabel":"核心","prerequisite":"TypeScript、JSON、异步基础","duration":"10 分钟","visual":"<section class=\"chapter-guide\"><div class=\"chapter-guide-head\"><div><span>章节导读</span><strong>第二章：Core 领域层</strong></div><p>按以下顺序完成本章课程。每一项都对应一篇独立学习材料。</p></div><div class=\"chapter-guide-grid\"><a class=\"chapter-guide-card\" href=\"#02-core-domain/01-thread-and-storage\"><span class=\"chapter-guide-number\">01</span><div><strong>Thread、消息与持久化模型</strong><p>源码：packages/core/src/types/threads/thread.ts。</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#02-core-domain/02-stream-history-evaluation\"><span class=\"chapter-guide-number\">02</span><div><strong>流式转换、运行历史与评测</strong><p>LLM Space 的领域模型适合编辑和持久化，pi-agent 的协议适合模型执行。运行前 convertToPiContext() 做正向转换；事件返回后 reduceMessages() 做增量归并。</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#02-core-domain/03-templates-parsers-generator\"><span class=\"chapter-guide-number\">03</span><div><strong>Prompt 模板、导入解析与代码生成</strong><p>变量分为：</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a></div></section>","html":"<h1 id=\"s-0-第二章-Core-领域层\">第二章：Core 领域层</h1>\n<p><code>@llm-space/core</code> 是全项目最值得先掌握的包。它定义 Thread、Message、Tool、Model 等领域协议，并提供模板、历史、解析、流式转换、存储和代码生成逻辑。这里的代码尽量不依赖 React、Electrobun 或具体平台。</p>\n<h2 id=\"s-2-边界原则\">边界原则</h2>\n<ul><li>根入口导出浏览器安全的 client、parsers、types、utils。</li><li><code>@llm-space/core/thread</code> 放框架无关的 Thread 行为。</li><li><code>@llm-space/core/server</code> 允许依赖 Bun/Node 文件系统和模型执行。</li><li><code>@llm-space/core/storage</code> 定义共享 Thread 的读写连接器。</li><li><code>@llm-space/core/generator</code> 定义从 Thread 生成工程的协议与 LangGraph 实现。</li></ul>\n<p>同一包内仍通过 exports 子路径显式隔离运行环境，避免 Web bundle 意外包含服务端模块。</p>\n<h2 id=\"s-5-本章学习路线\">本章学习路线</h2>\n<ol><li><a href=\"02-core-domain/01-thread-and-storage.md\" data-wiki-link=\"02-core-domain/01-thread-and-storage.md\">Thread、消息与持久化模型</a></li><li><a href=\"02-core-domain/02-stream-history-evaluation.md\" data-wiki-link=\"02-core-domain/02-stream-history-evaluation.md\">流式转换、运行历史与评测</a></li><li><a href=\"02-core-domain/03-templates-parsers-generator.md\" data-wiki-link=\"02-core-domain/03-templates-parsers-generator.md\">Prompt 模板、导入解析与代码生成</a></li></ol>\n<h2 id=\"s-7-关键调用图\">关键调用图</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">Thread JSON\n  → normalize / validate\n  → render prompt variables\n  → convertToPiContext\n  → AgentTransport\n  → streamAgent\n  → AgentEvent\n  → reduceMessages\n  → AssistantMessage\n  → recordRun / evaluation\n  → atomic persistence</code></pre></div>\n<p>学习时重点区分三种“校验”：</p>\n<ul><li>TypeScript 静态类型只在开发阶段工作。</li><li>TypeBox schema 同时提供类型与可编译校验器。</li><li>Zod 持久化边界负责旧字段迁移、规范化与运行时验证。</li></ul>\n<h2 id=\"s-11-推荐阅读顺序\">推荐阅读顺序</h2>\n<p><code>types/messages</code> → <code>types/threads/thread.ts</code> → <code>client/converters.ts</code> → <code>client/reducer.ts</code> → <code>thread/thread-workflow.test.ts</code> → <code>thread/prompt-variables.ts</code> → <code>server/storage/local/file-system.ts</code> → <code>generator/langgraph</code>。</p>\n<p>先读测试再读 1000 行级实现，通常能更快找到不变量。</p>","markdown":"# 第二章：Core 领域层\n\n`@llm-space/core` 是全项目最值得先掌握的包。它定义 Thread、Message、Tool、Model 等领域协议，并提供模板、历史、解析、流式转换、存储和代码生成逻辑。这里的代码尽量不依赖 React、Electrobun 或具体平台。\n\n## 边界原则\n\n- 根入口导出浏览器安全的 client、parsers、types、utils。\n- `@llm-space/core/thread` 放框架无关的 Thread 行为。\n- `@llm-space/core/server` 允许依赖 Bun/Node 文件系统和模型执行。\n- `@llm-space/core/storage` 定义共享 Thread 的读写连接器。\n- `@llm-space/core/generator` 定义从 Thread 生成工程的协议与 LangGraph 实现。\n\n同一包内仍通过 exports 子路径显式隔离运行环境，避免 Web bundle 意外包含服务端模块。\n\n## 本章学习路线\n\n1. [Thread、消息与持久化模型](02-core-domain/01-thread-and-storage.md)\n2. [流式转换、运行历史与评测](02-core-domain/02-stream-history-evaluation.md)\n3. [Prompt 模板、导入解析与代码生成](02-core-domain/03-templates-parsers-generator.md)\n\n## 关键调用图\n\n```text\nThread JSON\n  → normalize / validate\n  → render prompt variables\n  → convertToPiContext\n  → AgentTransport\n  → streamAgent\n  → AgentEvent\n  → reduceMessages\n  → AssistantMessage\n  → recordRun / evaluation\n  → atomic persistence\n```\n\n学习时重点区分三种“校验”：\n\n- TypeScript 静态类型只在开发阶段工作。\n- TypeBox schema 同时提供类型与可编译校验器。\n- Zod 持久化边界负责旧字段迁移、规范化与运行时验证。\n\n## 推荐阅读顺序\n\n`types/messages` → `types/threads/thread.ts` → `client/converters.ts` → `client/reducer.ts` → `thread/thread-workflow.test.ts` → `thread/prompt-variables.ts` → `server/storage/local/file-system.ts` → `generator/langgraph`。\n\n先读测试再读 1000 行级实现，通常能更快找到不变量。\n","text":" 第二章：Core 领域层 @llm space/core 是全项目最值得先掌握的包。它定义 Thread、Message、Tool、Model 等领域协议，并提供模板、历史、解析、流式转换、存储和代码生成逻辑。这里的代码尽量不依赖 React、Electrobun 或具体平台。 边界原则 根入口导出浏览器安全的 client、parsers、types、utils。 @llm space/core/thread 放框架无关的 Thread 行为。 @llm space/core/server 允许依赖 Bun/Node 文件系统和模型执行。 @llm space/core/storage 定义共享 Thread 的读写连接器。 @llm space/core/generator 定义从 Thread 生成工程的协议与 LangGraph 实现。 同一包内仍通过 exports 子路径显式隔离运行环境，避免 Web bundle 意外包含服务端模块。 本章学习路线 1. Thread、消息与持久化模型 02 core domain/01 thread and storage.md 2. 流式转换、运行历史与评测 02 core domain/02 stream history evaluation.md 3. Prompt 模板、导入解析与代码生成 02 core domain/03 templates parsers generator.md 关键调用图 text Thread JSON → normalize / validate → render prompt variables → convertToPiContext → AgentTransport → streamAgent → AgentEvent → reduceMessages → AssistantMessage → recordRun / evaluation → atomic persistence 学习时重点区分三种“校验”： TypeScript 静态类型只在开发阶段工作。 TypeBox schema 同时提供类型与可编译校验器。 Zod 持久化边界负责旧字段迁移、规范化与运行时验证。 推荐阅读顺序 types/messages → types/threads/thread.ts → client/converters.ts → client/reducer.ts → thread/thread workflow.test.ts → thread/prompt variables.ts → server/storage/local/file system.ts → generator/langgraph 。 先读测试再读 1000 行级实现，通常能更快找到不变量。 "},{"id":"02-core-domain/01-thread-and-storage","chapterId":"02-core-domain","kind":"lesson","title":"Thread、消息与持久化模型","description":"源码：packages/core/src/types/threads/thread.ts。","source":"02-core-domain/01-thread-and-storage.md","level":2,"levelLabel":"核心","prerequisite":"TypeScript、JSON、异步基础","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>Thread、消息与持久化模型</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>Thread 的真实结构</strong><p>源码：packages/core/src/types/threads/thread.ts。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>Message 设计</strong><p>Message 是 UserMessage | AssistantMessage 的 discriminated union。User 内容可含文本和图片；Assistant 还可保存 thinking、toolCalls、usage、Provider-Hosted activities、annotations 与响应回放信息。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>Tool 的运行时身份</strong><p>Tool 使用 type 区分 built-in、mcp、plugin、function 与 provider-hosted。规范化函数负责旧字段兼容。稳定 key 不应只依赖显示名，因为不同来源可能出现同名工具。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>本地文件系统</strong><p>核心实现：packages/core/src/server/storage/local/file-system.ts。</p></div></div></section>","html":"<h1 id=\"s-0-Thread-消息与持久化模型\">Thread、消息与持久化模型</h1>\n<h2 id=\"s-1-1-Thread-的真实结构\">1. Thread 的真实结构</h2>\n<p>源码：<code>packages/core/src/types/threads/thread.ts</code>。</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">Thread\n├── title / model / runtimeId\n├── context\n│   ├── systemPrompt\n│   ├── tools\n│   ├── variables / variableVariants / snapshot\n│   └── messages\n├── runHistory\n├── evaluationRubrics / evaluations\n└── originalURL</code></pre></div>\n<p><code>ThreadContext</code> 是运行输入；<code>Thread</code> 还包含调试、评测和来源信息。<code>ThreadSnapshot</code> 只保留标题、模型与 Context，刻意排除历史，防止 <code>runHistory[].thread.runHistory...</code> 无限递归。</p>\n<h2 id=\"s-5-2-Message-设计\">2. Message 设计</h2>\n<p><code>Message</code> 是 <code>UserMessage | AssistantMessage</code> 的 discriminated union。User 内容可含文本和图片；Assistant 还可保存 thinking、toolCalls、usage、Provider-Hosted activities、annotations 与响应回放信息。</p>\n<p>工具结果放在：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-ts\">assistant.toolCalls[i].output</code></pre></div>\n<p>而不是单独领域消息。这使用户能直接在工具卡片上编辑参数或结果。<code>convertToPiContext()</code> 在发送模型前把该结构转换成 pi-agent 需要的 Assistant + ToolResult 序列。</p>\n<h2 id=\"s-10-3-Tool-的运行时身份\">3. Tool 的运行时身份</h2>\n<p>Tool 使用 <code>type</code> 区分 built-in、mcp、plugin、function 与 provider-hosted。规范化函数负责旧字段兼容。稳定 key 不应只依赖显示名，因为不同来源可能出现同名工具。</p>\n<p>Provider-Hosted Tool 是例外：它进入独立的 raw config 列表，不转换成本地可执行 <code>pi.Tool</code>。</p>\n<h2 id=\"s-13-4-本地文件系统\">4. 本地文件系统</h2>\n<p>核心实现：<code>packages/core/src/server/storage/local/file-system.ts</code>。</p>\n<p><code>LocalFileSystem</code> 把相对路径限制在 <code>&lt;LLM_SPACE_HOME&gt;/workspace</code>：</p>\n<ul><li><code>realpath()</code> 防止路径逃逸。</li><li><code>ls()</code> 返回文件树节点。</li><li><code>read()</code> 解析、验证、规范化并解包图片。</li><li><code>write()</code> 同步标题与文件名，打包大图后原子写入。</li></ul>\n<h3 id=\"s-17-原子写入\">原子写入</h3>\n<p>原子写入通常采用：</p>\n<ol><li>在同目录写临时文件。</li><li>flush/fsync，确保内容落盘。</li><li>rename 覆盖目标。</li></ol>\n<p>rename 在同文件系统内是原子的，能避免进程崩溃留下半个 JSON。相关通用逻辑在 <code>server/json-file.ts</code>。</p>\n<h2 id=\"s-21-5-图片-Blob\">5. 图片 Blob</h2>\n<p>内嵌 Base64 大图会让 Thread JSON 巨大。存储层按 SHA-256 去重，把图片写入 Blob 文件，JSON 中保留引用；读取时再解包。内容寻址意味着相同图片天然复用。</p>\n<h2 id=\"s-23-6-损坏文件恢复\">6. 损坏文件恢复</h2>\n<p>读取不是简单 <code>JSON.parse</code>：</p>\n<ul><li>尝试严格解析。</li><li>对常见截断场景做 best-effort 恢复。</li><li>用持久化 schema 迁移旧字段并验证。</li><li>若规范化后与磁盘不同，可回写修复版本。</li><li>无法恢复时保留证据而不是静默覆盖。</li></ul>\n<h2 id=\"s-26-7-Storage-与-Parser-不同\">7. Storage 与 Parser 不同</h2>\n<ul><li>Storage 已知资源身份，负责读写与版本，如本地文件和 Gist。</li><li>Parser 面对未知外部文件，负责识别 OpenAI、Anthropic、Aurora、DeerFlow JSONL 等格式并统一为 Thread。</li></ul>\n<p>Gist 的 <code>ThreadLocator { id, filename, version }</code> 把资源身份与具体版本分开，<code>readLatestThread()</code> 可解析最新版本。</p>\n<h2 id=\"s-29-8-实践\">8. 实践</h2>\n<ol><li>创建最小 Thread JSON，只保留一条 User Message，验证 schema 默认行为。</li><li>追踪 <code>LocalFileSystem.write()</code> 如何处理标题、图片与临时文件。</li><li>构造一个旧字段 Thread，阅读 <code>thread-zod.ts</code> 的迁移结果。</li><li>解释为何 Agent 内置文件工具不受 workspace 根限制，而 Thread 文件 API 必须受限。</li></ol>\n<h2 id=\"s-31-常见误区\">常见误区</h2>\n<ul><li>TypeScript 类型不能保护磁盘输入，必须有运行时 schema。</li><li>“Thread” 不是并发执行线程。</li><li>删除本地工作区文件走桌面 Trash 注入；远程 Runtime 没有相同 OS 语义。</li></ul>","markdown":"# Thread、消息与持久化模型\n\n## 1. Thread 的真实结构\n\n源码：`packages/core/src/types/threads/thread.ts`。\n\n```text\nThread\n├── title / model / runtimeId\n├── context\n│   ├── systemPrompt\n│   ├── tools\n│   ├── variables / variableVariants / snapshot\n│   └── messages\n├── runHistory\n├── evaluationRubrics / evaluations\n└── originalURL\n```\n\n`ThreadContext` 是运行输入；`Thread` 还包含调试、评测和来源信息。`ThreadSnapshot` 只保留标题、模型与 Context，刻意排除历史，防止 `runHistory[].thread.runHistory...` 无限递归。\n\n## 2. Message 设计\n\n`Message` 是 `UserMessage | AssistantMessage` 的 discriminated union。User 内容可含文本和图片；Assistant 还可保存 thinking、toolCalls、usage、Provider-Hosted activities、annotations 与响应回放信息。\n\n工具结果放在：\n\n```ts\nassistant.toolCalls[i].output\n```\n\n而不是单独领域消息。这使用户能直接在工具卡片上编辑参数或结果。`convertToPiContext()` 在发送模型前把该结构转换成 pi-agent 需要的 Assistant + ToolResult 序列。\n\n## 3. Tool 的运行时身份\n\nTool 使用 `type` 区分 built-in、mcp、plugin、function 与 provider-hosted。规范化函数负责旧字段兼容。稳定 key 不应只依赖显示名，因为不同来源可能出现同名工具。\n\nProvider-Hosted Tool 是例外：它进入独立的 raw config 列表，不转换成本地可执行 `pi.Tool`。\n\n## 4. 本地文件系统\n\n核心实现：`packages/core/src/server/storage/local/file-system.ts`。\n\n`LocalFileSystem` 把相对路径限制在 `<LLM_SPACE_HOME>/workspace`：\n\n- `realpath()` 防止路径逃逸。\n- `ls()` 返回文件树节点。\n- `read()` 解析、验证、规范化并解包图片。\n- `write()` 同步标题与文件名，打包大图后原子写入。\n\n### 原子写入\n\n原子写入通常采用：\n\n1. 在同目录写临时文件。\n2. flush/fsync，确保内容落盘。\n3. rename 覆盖目标。\n\nrename 在同文件系统内是原子的，能避免进程崩溃留下半个 JSON。相关通用逻辑在 `server/json-file.ts`。\n\n## 5. 图片 Blob\n\n内嵌 Base64 大图会让 Thread JSON 巨大。存储层按 SHA-256 去重，把图片写入 Blob 文件，JSON 中保留引用；读取时再解包。内容寻址意味着相同图片天然复用。\n\n## 6. 损坏文件恢复\n\n读取不是简单 `JSON.parse`：\n\n- 尝试严格解析。\n- 对常见截断场景做 best-effort 恢复。\n- 用持久化 schema 迁移旧字段并验证。\n- 若规范化后与磁盘不同，可回写修复版本。\n- 无法恢复时保留证据而不是静默覆盖。\n\n## 7. Storage 与 Parser 不同\n\n- Storage 已知资源身份，负责读写与版本，如本地文件和 Gist。\n- Parser 面对未知外部文件，负责识别 OpenAI、Anthropic、Aurora、DeerFlow JSONL 等格式并统一为 Thread。\n\nGist 的 `ThreadLocator { id, filename, version }` 把资源身份与具体版本分开，`readLatestThread()` 可解析最新版本。\n\n## 8. 实践\n\n1. 创建最小 Thread JSON，只保留一条 User Message，验证 schema 默认行为。\n2. 追踪 `LocalFileSystem.write()` 如何处理标题、图片与临时文件。\n3. 构造一个旧字段 Thread，阅读 `thread-zod.ts` 的迁移结果。\n4. 解释为何 Agent 内置文件工具不受 workspace 根限制，而 Thread 文件 API 必须受限。\n\n## 常见误区\n\n- TypeScript 类型不能保护磁盘输入，必须有运行时 schema。\n- “Thread” 不是并发执行线程。\n- 删除本地工作区文件走桌面 Trash 注入；远程 Runtime 没有相同 OS 语义。\n","text":" Thread、消息与持久化模型 1. Thread 的真实结构 源码： packages/core/src/types/threads/thread.ts 。 text Thread ├── title / model / runtimeId ├── context │ ├── systemPrompt │ ├── tools │ ├── variables / variableVariants / snapshot │ └── messages ├── runHistory ├── evaluationRubrics / evaluations └── originalURL ThreadContext 是运行输入； Thread 还包含调试、评测和来源信息。 ThreadSnapshot 只保留标题、模型与 Context，刻意排除历史，防止 runHistory .thread.runHistory... 无限递归。 2. Message 设计 Message 是 UserMessage AssistantMessage 的 discriminated union。User 内容可含文本和图片；Assistant 还可保存 thinking、toolCalls、usage、Provider Hosted activities、annotations 与响应回放信息。 工具结果放在： ts assistant.toolCalls i .output 而不是单独领域消息。这使用户能直接在工具卡片上编辑参数或结果。 convertToPiContext 在发送模型前把该结构转换成 pi agent 需要的 Assistant + ToolResult 序列。 3. Tool 的运行时身份 Tool 使用 type 区分 built in、mcp、plugin、function 与 provider hosted。规范化函数负责旧字段兼容。稳定 key 不应只依赖显示名，因为不同来源可能出现同名工具。 Provider Hosted Tool 是例外：它进入独立的 raw config 列表，不转换成本地可执行 pi.Tool 。 4. 本地文件系统 核心实现： packages/core/src/server/storage/local/file system.ts 。 LocalFileSystem 把相对路径限制在 <LLM SPACE HOME /workspace ： realpath 防止路径逃逸。 ls 返回文件树节点。 read 解析、验证、规范化并解包图片。 write 同步标题与文件名，打包大图后原子写入。 原子写入 原子写入通常采用： 1. 在同目录写临时文件。 2. flush/fsync，确保内容落盘。 3. rename 覆盖目标。 rename 在同文件系统内是原子的，能避免进程崩溃留下半个 JSON。相关通用逻辑在 server/json file.ts 。 5. 图片 Blob 内嵌 Base64 大图会让 Thread JSON 巨大。存储层按 SHA 256 去重，把图片写入 Blob 文件，JSON 中保留引用；读取时再解包。内容寻址意味着相同图片天然复用。 6. 损坏文件恢复 读取不是简单 JSON.parse ： 尝试严格解析。 对常见截断场景做 best effort 恢复。 用持久化 schema 迁移旧字段并验证。 若规范化后与磁盘不同，可回写修复版本。 无法恢复时保留证据而不是静默覆盖。 7. Storage 与 Parser 不同 Storage 已知资源身份，负责读写与版本，如本地文件和 Gist。 Parser 面对未知外部文件，负责识别 OpenAI、Anthropic、Aurora、DeerFlow JSONL 等格式并统一为 Thread。 Gist 的 ThreadLocator { id, filename, version } 把资源身份与具体版本分开， readLatestThread 可解析最新版本。 8. 实践 1. 创建最小 Thread JSON，只保留一条 User Message，验证 schema 默认行为。 2. 追踪 LocalFileSystem.write 如何处理标题、图片与临时文件。 3. 构造一个旧字段 Thread，阅读 thread zod.ts 的迁移结果。 4. 解释为何 Agent 内置文件工具不受 workspace 根限制，而 Thread 文件 API 必须受限。 常见误区 TypeScript 类型不能保护磁盘输入，必须有运行时 schema。 “Thread” 不是并发执行线程。 删除本地工作区文件走桌面 Trash 注入；远程 Runtime 没有相同 OS 语义。 "},{"id":"02-core-domain/02-stream-history-evaluation","chapterId":"02-core-domain","kind":"lesson","title":"流式转换、运行历史与评测","description":"LLM Space 的领域模型适合编辑和持久化，pi-agent 的协议适合模型执行。运行前 convertToPiContext() 做正向转换；事件返回后 reduceMessages() 做增量归并。","source":"02-core-domain/02-stream-history-evaluation.md","level":2,"levelLabel":"核心","prerequisite":"TypeScript、JSON、异步基础","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>流式转换、运行历史与评测</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>为什么有两次转换</strong><p>LLM Space 的领域模型适合编辑和持久化，pi-agent 的协议适合模型执行。运行前 convertToPiContext() 做正向转换；事件返回后 reduceMessages() 做增量归并。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>streamThread()</strong><p>位置：packages/core/src/client/api.ts。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>streamAgent()</strong><p>位置：packages/core/src/server/agent/stream.ts。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>reduceMessages()</strong><p>Reducer 是纯函数风格的事件状态机：</p></div></div></section>","html":"<h1 id=\"s-0-流式转换-运行历史与评测\">流式转换、运行历史与评测</h1>\n<h2 id=\"s-1-1-为什么有两次转换\">1. 为什么有两次转换</h2>\n<p>LLM Space 的领域模型适合编辑和持久化，pi-agent 的协议适合模型执行。运行前 <code>convertToPiContext()</code> 做正向转换；事件返回后 <code>reduceMessages()</code> 做增量归并。</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">ThreadContext\n→ PiThreadContext\n→ AgentEvent stream\n→ AssistantMessage</code></pre></div>\n<h2 id=\"s-4-2-streamThread-\">2. <code>streamThread()</code></h2>\n<p>位置：<code>packages/core/src/client/api.ts</code>。</p>\n<p>职责很窄：</p>\n<ol><li>检查对话最后一条是否可运行。</li><li>将 context 转换为 pi 格式。</li><li>构造 <code>AgentStreamRequest</code>。</li><li>选择注入 Transport；未注入时使用 HTTP/SSE。</li><li>原样 yield 事件。</li></ol>\n<p>它不负责模型凭证、UI 状态或持久化，体现单一职责。</p>\n<h2 id=\"s-9-3-streamAgent-\">3. <code>streamAgent()</code></h2>\n<p>位置：<code>packages/core/src/server/agent/stream.ts</code>。</p>\n<p>职责：</p>\n<ul><li>从注入的 Models 集合解析模型。</li><li>为单次运行解析 API Key、Base URL 和 Headers。</li><li>应用结构化输出与 Provider-Hosted Tools。</li><li>调用 <code>agentLoopContinue()</code>。</li><li>在 <code>finally</code> 中恢复共享 model 上临时覆盖的 Base URL。</li></ul>\n<p>最后一点防止一次连接配置泄漏到下一次运行，是共享可变对象的典型风险。</p>\n<h2 id=\"s-14-4-reduceMessages-\">4. <code>reduceMessages()</code></h2>\n<p>Reducer 是纯函数风格的事件状态机：</p>\n<ul><li><code>message_start</code>：创建临时 Assistant Message。</li><li><code>thinking_delta</code>、<code>text_delta</code>：拼接增量内容。</li><li><code>toolcall_start/delta/end</code>：保留未完成参数文本并尝试解析 JSON。</li><li><code>tool_execution_end</code>：补入输出。</li><li><code>message_end</code>：使用 Provider 最终内容、usage、活动和注解校准消息。</li><li><code>agent_end</code>：检查 Provider 错误。</li></ul>\n<p>在 UI 中保留 <code>partialArguments</code> 很重要，因为模型输出损坏 JSON 时仍可调试原始文本。</p>\n<h2 id=\"s-18-5-运行历史\">5. 运行历史</h2>\n<p><code>recordRun()</code> 保存：</p>\n<ul><li>稳定 Run ID。</li><li>不含历史的 Thread Snapshot。</li><li>本次 usage。</li><li>完成时间。</li></ul>\n<p>历史数量有上限，避免单文件无限增长。旧历史缺少 ID 时会按确定规则回填，使 Evaluation 可以稳定引用。</p>\n<h2 id=\"s-22-6-Undo-与-Run-History-不同\">6. Undo 与 Run History 不同</h2>\n<ul><li>Undo/Redo 记录编辑快照，服务于当前交互，采用 copy-on-write 引用，受数量和图片内存预算约束。</li><li>Run History 记录已完成运行证据，持久化到 Thread。</li></ul>\n<p>不要用 Undo 实现运行回放，也不要把每个 streaming chunk 写进 Undo。</p>\n<h2 id=\"s-25-7-Rubric-与-Evaluation\">7. Rubric 与 Evaluation</h2>\n<p>Rubric 包含 2–6 个有序标准和 revision。Evaluation 保存 Rubric Snapshot 与两边 Run ID 的分数，因此：</p>\n<ul><li>修改 Rubric 不会改变历史评测。</li><li>删除某次运行时需要清理失效评测引用。</li><li>平均分是派生信息，verdict 仍是独立的人类判断。</li></ul>\n<h2 id=\"s-28-8-Usage\">8. Usage</h2>\n<p>Provider usage 会被归一化为输入、输出、缓存读写、推理、总 token 和 cost。负数、NaN 或 Infinity 被过滤，全零 usage 不持久化。跨 Provider 比较时只保留可移植字段。</p>\n<h2 id=\"s-30-9-实践\">9. 实践</h2>\n<ol><li>逐事件喂给 <code>reduceMessages()</code>：text、tool call、tool result、message end。</li><li>验证提前 Abort 时不会留下 active stream。</li><li>比较一次模型最终 content 与增量 content 不一致时 reducer 的选择。</li><li>创建 Rubric、评测两次 Run，再修改 Rubric，确认历史快照不变。</li></ol>\n<h2 id=\"s-32-阅读测试\">阅读测试</h2>\n<ul><li><code>client/reducer.test.ts</code></li><li><code>server/agent/stream.test.ts</code></li><li><code>thread/history.test.ts</code></li><li><code>thread/run-evaluation-utils.test.ts</code></li><li><code>thread/thread-workflow.test.ts</code></li></ul>","markdown":"# 流式转换、运行历史与评测\n\n## 1. 为什么有两次转换\n\nLLM Space 的领域模型适合编辑和持久化，pi-agent 的协议适合模型执行。运行前 `convertToPiContext()` 做正向转换；事件返回后 `reduceMessages()` 做增量归并。\n\n```text\nThreadContext\n→ PiThreadContext\n→ AgentEvent stream\n→ AssistantMessage\n```\n\n## 2. `streamThread()`\n\n位置：`packages/core/src/client/api.ts`。\n\n职责很窄：\n\n1. 检查对话最后一条是否可运行。\n2. 将 context 转换为 pi 格式。\n3. 构造 `AgentStreamRequest`。\n4. 选择注入 Transport；未注入时使用 HTTP/SSE。\n5. 原样 yield 事件。\n\n它不负责模型凭证、UI 状态或持久化，体现单一职责。\n\n## 3. `streamAgent()`\n\n位置：`packages/core/src/server/agent/stream.ts`。\n\n职责：\n\n- 从注入的 Models 集合解析模型。\n- 为单次运行解析 API Key、Base URL 和 Headers。\n- 应用结构化输出与 Provider-Hosted Tools。\n- 调用 `agentLoopContinue()`。\n- 在 `finally` 中恢复共享 model 上临时覆盖的 Base URL。\n\n最后一点防止一次连接配置泄漏到下一次运行，是共享可变对象的典型风险。\n\n## 4. `reduceMessages()`\n\nReducer 是纯函数风格的事件状态机：\n\n- `message_start`：创建临时 Assistant Message。\n- `thinking_delta`、`text_delta`：拼接增量内容。\n- `toolcall_start/delta/end`：保留未完成参数文本并尝试解析 JSON。\n- `tool_execution_end`：补入输出。\n- `message_end`：使用 Provider 最终内容、usage、活动和注解校准消息。\n- `agent_end`：检查 Provider 错误。\n\n在 UI 中保留 `partialArguments` 很重要，因为模型输出损坏 JSON 时仍可调试原始文本。\n\n## 5. 运行历史\n\n`recordRun()` 保存：\n\n- 稳定 Run ID。\n- 不含历史的 Thread Snapshot。\n- 本次 usage。\n- 完成时间。\n\n历史数量有上限，避免单文件无限增长。旧历史缺少 ID 时会按确定规则回填，使 Evaluation 可以稳定引用。\n\n## 6. Undo 与 Run History 不同\n\n- Undo/Redo 记录编辑快照，服务于当前交互，采用 copy-on-write 引用，受数量和图片内存预算约束。\n- Run History 记录已完成运行证据，持久化到 Thread。\n\n不要用 Undo 实现运行回放，也不要把每个 streaming chunk 写进 Undo。\n\n## 7. Rubric 与 Evaluation\n\nRubric 包含 2–6 个有序标准和 revision。Evaluation 保存 Rubric Snapshot 与两边 Run ID 的分数，因此：\n\n- 修改 Rubric 不会改变历史评测。\n- 删除某次运行时需要清理失效评测引用。\n- 平均分是派生信息，verdict 仍是独立的人类判断。\n\n## 8. Usage\n\nProvider usage 会被归一化为输入、输出、缓存读写、推理、总 token 和 cost。负数、NaN 或 Infinity 被过滤，全零 usage 不持久化。跨 Provider 比较时只保留可移植字段。\n\n## 9. 实践\n\n1. 逐事件喂给 `reduceMessages()`：text、tool call、tool result、message end。\n2. 验证提前 Abort 时不会留下 active stream。\n3. 比较一次模型最终 content 与增量 content 不一致时 reducer 的选择。\n4. 创建 Rubric、评测两次 Run，再修改 Rubric，确认历史快照不变。\n\n## 阅读测试\n\n- `client/reducer.test.ts`\n- `server/agent/stream.test.ts`\n- `thread/history.test.ts`\n- `thread/run-evaluation-utils.test.ts`\n- `thread/thread-workflow.test.ts`\n","text":" 流式转换、运行历史与评测 1. 为什么有两次转换 LLM Space 的领域模型适合编辑和持久化，pi agent 的协议适合模型执行。运行前 convertToPiContext 做正向转换；事件返回后 reduceMessages 做增量归并。 text ThreadContext → PiThreadContext → AgentEvent stream → AssistantMessage 2. streamThread 位置： packages/core/src/client/api.ts 。 职责很窄： 1. 检查对话最后一条是否可运行。 2. 将 context 转换为 pi 格式。 3. 构造 AgentStreamRequest 。 4. 选择注入 Transport；未注入时使用 HTTP/SSE。 5. 原样 yield 事件。 它不负责模型凭证、UI 状态或持久化，体现单一职责。 3. streamAgent 位置： packages/core/src/server/agent/stream.ts 。 职责： 从注入的 Models 集合解析模型。 为单次运行解析 API Key、Base URL 和 Headers。 应用结构化输出与 Provider Hosted Tools。 调用 agentLoopContinue 。 在 finally 中恢复共享 model 上临时覆盖的 Base URL。 最后一点防止一次连接配置泄漏到下一次运行，是共享可变对象的典型风险。 4. reduceMessages Reducer 是纯函数风格的事件状态机： message start ：创建临时 Assistant Message。 thinking delta 、 text delta ：拼接增量内容。 toolcall start/delta/end ：保留未完成参数文本并尝试解析 JSON。 tool execution end ：补入输出。 message end ：使用 Provider 最终内容、usage、活动和注解校准消息。 agent end ：检查 Provider 错误。 在 UI 中保留 partialArguments 很重要，因为模型输出损坏 JSON 时仍可调试原始文本。 5. 运行历史 recordRun 保存： 稳定 Run ID。 不含历史的 Thread Snapshot。 本次 usage。 完成时间。 历史数量有上限，避免单文件无限增长。旧历史缺少 ID 时会按确定规则回填，使 Evaluation 可以稳定引用。 6. Undo 与 Run History 不同 Undo/Redo 记录编辑快照，服务于当前交互，采用 copy on write 引用，受数量和图片内存预算约束。 Run History 记录已完成运行证据，持久化到 Thread。 不要用 Undo 实现运行回放，也不要把每个 streaming chunk 写进 Undo。 7. Rubric 与 Evaluation Rubric 包含 2–6 个有序标准和 revision。Evaluation 保存 Rubric Snapshot 与两边 Run ID 的分数，因此： 修改 Rubric 不会改变历史评测。 删除某次运行时需要清理失效评测引用。 平均分是派生信息，verdict 仍是独立的人类判断。 8. Usage Provider usage 会被归一化为输入、输出、缓存读写、推理、总 token 和 cost。负数、NaN 或 Infinity 被过滤，全零 usage 不持久化。跨 Provider 比较时只保留可移植字段。 9. 实践 1. 逐事件喂给 reduceMessages ：text、tool call、tool result、message end。 2. 验证提前 Abort 时不会留下 active stream。 3. 比较一次模型最终 content 与增量 content 不一致时 reducer 的选择。 4. 创建 Rubric、评测两次 Run，再修改 Rubric，确认历史快照不变。 阅读测试 client/reducer.test.ts server/agent/stream.test.ts thread/history.test.ts thread/run evaluation utils.test.ts thread/thread workflow.test.ts "},{"id":"02-core-domain/03-templates-parsers-generator","chapterId":"02-core-domain","kind":"lesson","title":"Prompt 模板、导入解析与代码生成","description":"变量分为：","source":"02-core-domain/03-templates-parsers-generator.md","level":2,"levelLabel":"核心","prerequisite":"TypeScript、JSON、异步基础","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>Prompt 模板、导入解析与代码生成</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>Prompt 变量系统</strong><p>变量分为：</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>两级渲染策略</strong><p>简单 {{name}} 使用轻量替换；只有检测到块标签、宏、成员访问、过滤器或调用时才启用 Nunjucks 模板。这样可减少把不可信工具输出误当模板执行的概率。</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>文件变量与 include 的差别</strong><p>了解“文件变量与 include 的差别”在本节中的作用与边界。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>可复现 Snapshot</strong><p>变量值按稳定 Prompt place 保存，例如：</p></div></div></section>","html":"<h1 id=\"s-0-Prompt-模板-导入解析与代码生成\">Prompt 模板、导入解析与代码生成</h1>\n<h2 id=\"s-1-1-Prompt-变量系统\">1. Prompt 变量系统</h2>\n<p>变量分为：</p>\n<ul><li>内置日期 <code>currentDate</code>。</li><li>当前工作目录 <code>workingDirectory</code>。</li><li>可用 Skills 列表 <code>skills</code>。</li><li>用户 JSON 变量。</li><li>文件内容变量。</li><li><code>variableVariants</code> 中的自定义文本值。</li></ul>\n<p><code>prompt-variables.ts</code> 负责定义、规范化、解析、引用替换和 Snapshot。占位符名必须满足标识符规则。</p>\n<h2 id=\"s-5-2-两级渲染策略\">2. 两级渲染策略</h2>\n<p>简单 <code>{{name}}</code> 使用轻量替换；只有检测到块标签、宏、成员访问、过滤器或调用时才启用 Nunjucks 模板。这样可减少把不可信工具输出误当模板执行的概率。</p>\n<p>复杂模板支持：</p>\n<ul><li><code>{% if %}</code>、<code>{% for %}</code>。</li><li>字段和数组访问。</li><li>Filters。</li><li><code>exists(path)</code>。</li><li><code>{{@include(&quot;path&quot;)}}</code> 递归包含。</li></ul>\n<p>解析失败时返回原文，不让一次坏模板毁掉整个运行。递归 include 受最大深度与数量限制，避免循环包含。</p>\n<h2 id=\"s-10-3-文件变量与-include-的差别\">3. 文件变量与 include 的差别</h2>\n<ul><li>文件内容变量只读取并原样嵌入，不递归渲染文件内模板。</li><li><code>@include</code> 会递归渲染。</li><li>Web Viewer 没有文件系统，两者解析为空或不可用。</li></ul>\n<h2 id=\"s-12-4-可复现-Snapshot\">4. 可复现 Snapshot</h2>\n<p>变量值按稳定 Prompt place 保存，例如：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">systemPrompt\nmessage:&lt;id&gt;:text\ntoolResult:&lt;message-id&gt;:&lt;tool-call-id&gt;</code></pre></div>\n<p>编辑变量时只失效引用了该变量的 Snapshot；编辑某条消息则失效对应位置。这样新内容能更新，旧已运行前缀仍稳定。</p>\n<h2 id=\"s-16-5-Parser-Registry\">5. Parser Registry</h2>\n<p>Parser 根据扩展名和内容尝试：</p>\n<ul><li>原生 Thread。</li><li>OpenAI Chat Completions。</li><li>Anthropic Messages。</li><li>Aurora。</li><li>DeerFlow run-event JSONL。</li></ul>\n<p>每个 Parser 输出候选 Thread，再经 <code>normalizeThread()</code> 与 schema 边界统一。导入器需要处理工具调用 ID、消息角色差异、System Prompt 位置和模型字段映射。</p>\n<h2 id=\"s-20-6-Generator-协议\">6. Generator 协议</h2>\n<p><code>GeneratorDefinition</code> 描述生成器 ID、输入要求和 <code>run()</code>。宿主通过 <code>GeneratorCapabilities</code> 注入：</p>\n<ul><li>写入/删除文件。</li><li>运行 <code>uv</code>。</li><li>打开终端。</li><li>读取搜索设置和真实环境变量。</li></ul>\n<p>当前 <code>langgraphGenerator</code> 确定性生成 Python 工程，包括：</p>\n<ul><li><code>pyproject.toml</code> 与 <code>.env</code>。</li><li>Prompt、变量、Skills/MCP 配置。</li><li>模型工厂与工具源码。</li><li>LangGraph Agent 入口。</li></ul>\n<h2 id=\"s-25-7-TypeScript-与生成-Python-的语义一致性\">7. TypeScript 与生成 Python 的语义一致性</h2>\n<p>模板系统存在两套 Runtime：当前 TypeScript 应用和生成的 Python 项目。增加变量、Filter、<code>exists()</code> 或 include 行为时，必须同时修改：</p>\n<ul><li><code>packages/core/src/thread/</code>。</li><li><code>packages/core/src/generator/langgraph/templates.ts</code>。</li><li>Generator regression tests。</li></ul>\n<p>只把变量写进导出 JSON 不代表 Python 运行时会解析它。</p>\n<h2 id=\"s-29-8-Workflow\">8. Workflow</h2>\n<p><code>WorkflowContext</code> 提供 phase、log、agent 与 parallel。并发由 Semaphore 限制，默认最多四个 agent task。当前 LangGraph Generator 主要走确定性文件生成，但 Workflow 协议为未来多阶段生成保留了统一进度事件。</p>\n<h2 id=\"s-31-9-安全边界\">9. 安全边界</h2>\n<ul><li>Provider-Hosted Tools 暂不支持 LangGraph 导出，应明确失败。</li><li>导出真实 API Key 必须由用户明确选择。</li><li>生成目录先授权并限制相对路径，避免越界写文件。</li><li><code>uv</code> 执行有 timeout，失败不应留下无反馈的后台进程。</li></ul>\n<h2 id=\"s-33-10-实践\">10. 实践</h2>\n<ol><li>添加一个 JSON 变量并在条件与循环中使用。</li><li>制造递归 include，观察上限行为。</li><li>导入一份 OpenAI tool_calls JSON，检查统一后的 Thread。</li><li>生成 General Agent，运行 Python 语法与模板行为测试。</li><li>思考新增内置变量需要修改哪些 TypeScript、Python、UI 和测试位置。</li></ol>","markdown":"# Prompt 模板、导入解析与代码生成\n\n## 1. Prompt 变量系统\n\n变量分为：\n\n- 内置日期 `currentDate`。\n- 当前工作目录 `workingDirectory`。\n- 可用 Skills 列表 `skills`。\n- 用户 JSON 变量。\n- 文件内容变量。\n- `variableVariants` 中的自定义文本值。\n\n`prompt-variables.ts` 负责定义、规范化、解析、引用替换和 Snapshot。占位符名必须满足标识符规则。\n\n## 2. 两级渲染策略\n\n简单 `{{name}}` 使用轻量替换；只有检测到块标签、宏、成员访问、过滤器或调用时才启用 Nunjucks 模板。这样可减少把不可信工具输出误当模板执行的概率。\n\n复杂模板支持：\n\n- `{% if %}`、`{% for %}`。\n- 字段和数组访问。\n- Filters。\n- `exists(path)`。\n- `{{@include(\"path\")}}` 递归包含。\n\n解析失败时返回原文，不让一次坏模板毁掉整个运行。递归 include 受最大深度与数量限制，避免循环包含。\n\n## 3. 文件变量与 include 的差别\n\n- 文件内容变量只读取并原样嵌入，不递归渲染文件内模板。\n- `@include` 会递归渲染。\n- Web Viewer 没有文件系统，两者解析为空或不可用。\n\n## 4. 可复现 Snapshot\n\n变量值按稳定 Prompt place 保存，例如：\n\n```text\nsystemPrompt\nmessage:<id>:text\ntoolResult:<message-id>:<tool-call-id>\n```\n\n编辑变量时只失效引用了该变量的 Snapshot；编辑某条消息则失效对应位置。这样新内容能更新，旧已运行前缀仍稳定。\n\n## 5. Parser Registry\n\nParser 根据扩展名和内容尝试：\n\n- 原生 Thread。\n- OpenAI Chat Completions。\n- Anthropic Messages。\n- Aurora。\n- DeerFlow run-event JSONL。\n\n每个 Parser 输出候选 Thread，再经 `normalizeThread()` 与 schema 边界统一。导入器需要处理工具调用 ID、消息角色差异、System Prompt 位置和模型字段映射。\n\n## 6. Generator 协议\n\n`GeneratorDefinition` 描述生成器 ID、输入要求和 `run()`。宿主通过 `GeneratorCapabilities` 注入：\n\n- 写入/删除文件。\n- 运行 `uv`。\n- 打开终端。\n- 读取搜索设置和真实环境变量。\n\n当前 `langgraphGenerator` 确定性生成 Python 工程，包括：\n\n- `pyproject.toml` 与 `.env`。\n- Prompt、变量、Skills/MCP 配置。\n- 模型工厂与工具源码。\n- LangGraph Agent 入口。\n\n## 7. TypeScript 与生成 Python 的语义一致性\n\n模板系统存在两套 Runtime：当前 TypeScript 应用和生成的 Python 项目。增加变量、Filter、`exists()` 或 include 行为时，必须同时修改：\n\n- `packages/core/src/thread/`。\n- `packages/core/src/generator/langgraph/templates.ts`。\n- Generator regression tests。\n\n只把变量写进导出 JSON 不代表 Python 运行时会解析它。\n\n## 8. Workflow\n\n`WorkflowContext` 提供 phase、log、agent 与 parallel。并发由 Semaphore 限制，默认最多四个 agent task。当前 LangGraph Generator 主要走确定性文件生成，但 Workflow 协议为未来多阶段生成保留了统一进度事件。\n\n## 9. 安全边界\n\n- Provider-Hosted Tools 暂不支持 LangGraph 导出，应明确失败。\n- 导出真实 API Key 必须由用户明确选择。\n- 生成目录先授权并限制相对路径，避免越界写文件。\n- `uv` 执行有 timeout，失败不应留下无反馈的后台进程。\n\n## 10. 实践\n\n1. 添加一个 JSON 变量并在条件与循环中使用。\n2. 制造递归 include，观察上限行为。\n3. 导入一份 OpenAI tool_calls JSON，检查统一后的 Thread。\n4. 生成 General Agent，运行 Python 语法与模板行为测试。\n5. 思考新增内置变量需要修改哪些 TypeScript、Python、UI 和测试位置。\n","text":" Prompt 模板、导入解析与代码生成 1. Prompt 变量系统 变量分为： 内置日期 currentDate 。 当前工作目录 workingDirectory 。 可用 Skills 列表 skills 。 用户 JSON 变量。 文件内容变量。 variableVariants 中的自定义文本值。 prompt variables.ts 负责定义、规范化、解析、引用替换和 Snapshot。占位符名必须满足标识符规则。 2. 两级渲染策略 简单 {{name}} 使用轻量替换；只有检测到块标签、宏、成员访问、过滤器或调用时才启用 Nunjucks 模板。这样可减少把不可信工具输出误当模板执行的概率。 复杂模板支持： {% if %} 、 {% for %} 。 字段和数组访问。 Filters。 exists path 。 {{@include \"path\" }} 递归包含。 解析失败时返回原文，不让一次坏模板毁掉整个运行。递归 include 受最大深度与数量限制，避免循环包含。 3. 文件变量与 include 的差别 文件内容变量只读取并原样嵌入，不递归渲染文件内模板。 @include 会递归渲染。 Web Viewer 没有文件系统，两者解析为空或不可用。 4. 可复现 Snapshot 变量值按稳定 Prompt place 保存，例如： text systemPrompt message:<id :text toolResult:<message id :<tool call id 编辑变量时只失效引用了该变量的 Snapshot；编辑某条消息则失效对应位置。这样新内容能更新，旧已运行前缀仍稳定。 5. Parser Registry Parser 根据扩展名和内容尝试： 原生 Thread。 OpenAI Chat Completions。 Anthropic Messages。 Aurora。 DeerFlow run event JSONL。 每个 Parser 输出候选 Thread，再经 normalizeThread 与 schema 边界统一。导入器需要处理工具调用 ID、消息角色差异、System Prompt 位置和模型字段映射。 6. Generator 协议 GeneratorDefinition 描述生成器 ID、输入要求和 run 。宿主通过 GeneratorCapabilities 注入： 写入/删除文件。 运行 uv 。 打开终端。 读取搜索设置和真实环境变量。 当前 langgraphGenerator 确定性生成 Python 工程，包括： pyproject.toml 与 .env 。 Prompt、变量、Skills/MCP 配置。 模型工厂与工具源码。 LangGraph Agent 入口。 7. TypeScript 与生成 Python 的语义一致性 模板系统存在两套 Runtime：当前 TypeScript 应用和生成的 Python 项目。增加变量、Filter、 exists 或 include 行为时，必须同时修改： packages/core/src/thread/ 。 packages/core/src/generator/langgraph/templates.ts 。 Generator regression tests。 只把变量写进导出 JSON 不代表 Python 运行时会解析它。 8. Workflow WorkflowContext 提供 phase、log、agent 与 parallel。并发由 Semaphore 限制，默认最多四个 agent task。当前 LangGraph Generator 主要走确定性文件生成，但 Workflow 协议为未来多阶段生成保留了统一进度事件。 9. 安全边界 Provider Hosted Tools 暂不支持 LangGraph 导出，应明确失败。 导出真实 API Key 必须由用户明确选择。 生成目录先授权并限制相对路径，避免越界写文件。 uv 执行有 timeout，失败不应留下无反馈的后台进程。 10. 实践 1. 添加一个 JSON 变量并在条件与循环中使用。 2. 制造递归 include，观察上限行为。 3. 导入一份 OpenAI tool calls JSON，检查统一后的 Thread。 4. 生成 General Agent，运行 Python 语法与模板行为测试。 5. 思考新增内置变量需要修改哪些 TypeScript、Python、UI 和测试位置。 "},{"id":"03-agent-runtime","chapterId":"03-agent-runtime","kind":"chapter","title":"第三章：Agent Runtime 与扩展系统","description":"@llm-space/runtime 把 Core 的领域协议连接到真实模型、MCP Server、工具、Skills、插件、网络设置和 Trace 存储。它不是自动启动的容器，而是一组 Manager、Registry、Client 和共享协议，由桌面端或无头 Server 显式组合。","source":"03-agent-runtime.md","level":2,"levelLabel":"核心","prerequisite":"Agent、Tool、MCP 基础","duration":"10 分钟","visual":"<section class=\"chapter-guide\"><div class=\"chapter-guide-head\"><div><span>章节导读</span><strong>第三章：Agent Runtime 与扩展系统</strong></div><p>按以下顺序完成本章课程。每一项都对应一篇独立学习材料。</p></div><div class=\"chapter-guide-grid\"><a class=\"chapter-guide-card\" href=\"#03-agent-runtime/01-runtime-models-streaming\"><span class=\"chapter-guide-number\">01</span><div><strong>Runtime、模型与流式生命周期</strong><p>packages/runtime/src/runtime/types.ts 定义完整能力面：streaming、filesystem、models、MCP、built-in tools、skills、search、network、traces。</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#03-agent-runtime/02-tools-mcp-skills\"><span class=\"chapter-guide-number\">02</span><div><strong>Tools、MCP 与 Skills</strong><p>模型请求中的 Tool 只是名称、描述和参数 Schema。streamAgent() 用 step-by-step stub 让 pi-agent 在产生 Tool Call 后终止当前模型轮次。真实执行发生在桌面 Host：</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#03-agent-runtime/03-plugins-network-traces\"><span class=\"chapter-guide-number\">03</span><div><strong>插件、网络与 Trace</strong><p>插件位于 LLMSPACEHOME/plugins/ 的 npm-compatible package。PluginManager.create()：</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a></div></section>","html":"<h1 id=\"s-0-第三章-Agent-Runtime-与扩展系统\">第三章：Agent Runtime 与扩展系统</h1>\n<p><code>@llm-space/runtime</code> 把 Core 的领域协议连接到真实模型、MCP Server、工具、Skills、插件、网络设置和 Trace 存储。它不是自动启动的容器，而是一组 Manager、Registry、Client 和共享协议，由桌面端或无头 Server 显式组合。</p>\n<h2 id=\"s-2-核心构件\">核心构件</h2>\n<ul><li><code>RuntimeClient</code>：本地/远程统一能力契约。</li><li><code>LocalRuntimeClient</code>：把方法委派给各 Manager。</li><li><code>RuntimeRouter</code>：注册 Runtime 并按 <code>runtimeId</code> 路由。</li><li><code>ModelManager</code>、<code>McpManager</code>、<code>SkillsManager</code>、<code>TraceManager</code>：各自配置和生命周期所有者。</li><li><code>ToolRegistry</code>：启动期注册、运行期冻结的内置工具表。</li><li><code>PluginManager</code>：发现、验证、启停并隔离插件扩展。</li></ul>\n<h2 id=\"s-4-本章子课程\">本章子课程</h2>\n<ul><li><a href=\"03-agent-runtime/01-runtime-models-streaming.md\" data-wiki-link=\"03-agent-runtime/01-runtime-models-streaming.md\">Runtime、模型与流式生命周期</a></li><li><a href=\"03-agent-runtime/02-tools-mcp-skills.md\" data-wiki-link=\"03-agent-runtime/02-tools-mcp-skills.md\">Tools、MCP 与 Skills</a></li><li><a href=\"03-agent-runtime/03-plugins-network-traces.md\" data-wiki-link=\"03-agent-runtime/03-plugins-network-traces.md\">插件、网络与 Trace</a></li></ul>\n<h2 id=\"s-6-关键设计原则\">关键设计原则</h2>\n<ol><li>定义面与执行面分离：模型先产生 Tool Call，UI/Host 再执行工具。</li><li>配置所有权清晰：每个 Manager 管自己的 settings 文件和连接缓存。</li><li>运行作用域固定：一次 Run 开始后锁定 Runtime 与 Provider Connection。</li><li>动态扩展故障隔离：单插件或 MCP 失败不阻止应用启动。</li><li>Network 最先初始化：代理环境必须在子进程和网络请求出现前生效。</li></ol>","markdown":"# 第三章：Agent Runtime 与扩展系统\n\n`@llm-space/runtime` 把 Core 的领域协议连接到真实模型、MCP Server、工具、Skills、插件、网络设置和 Trace 存储。它不是自动启动的容器，而是一组 Manager、Registry、Client 和共享协议，由桌面端或无头 Server 显式组合。\n\n## 核心构件\n\n- `RuntimeClient`：本地/远程统一能力契约。\n- `LocalRuntimeClient`：把方法委派给各 Manager。\n- `RuntimeRouter`：注册 Runtime 并按 `runtimeId` 路由。\n- `ModelManager`、`McpManager`、`SkillsManager`、`TraceManager`：各自配置和生命周期所有者。\n- `ToolRegistry`：启动期注册、运行期冻结的内置工具表。\n- `PluginManager`：发现、验证、启停并隔离插件扩展。\n\n## 本章子课程\n\n- [Runtime、模型与流式生命周期](03-agent-runtime/01-runtime-models-streaming.md)\n- [Tools、MCP 与 Skills](03-agent-runtime/02-tools-mcp-skills.md)\n- [插件、网络与 Trace](03-agent-runtime/03-plugins-network-traces.md)\n\n## 关键设计原则\n\n1. 定义面与执行面分离：模型先产生 Tool Call，UI/Host 再执行工具。\n2. 配置所有权清晰：每个 Manager 管自己的 settings 文件和连接缓存。\n3. 运行作用域固定：一次 Run 开始后锁定 Runtime 与 Provider Connection。\n4. 动态扩展故障隔离：单插件或 MCP 失败不阻止应用启动。\n5. Network 最先初始化：代理环境必须在子进程和网络请求出现前生效。\n","text":" 第三章：Agent Runtime 与扩展系统 @llm space/runtime 把 Core 的领域协议连接到真实模型、MCP Server、工具、Skills、插件、网络设置和 Trace 存储。它不是自动启动的容器，而是一组 Manager、Registry、Client 和共享协议，由桌面端或无头 Server 显式组合。 核心构件 RuntimeClient ：本地/远程统一能力契约。 LocalRuntimeClient ：把方法委派给各 Manager。 RuntimeRouter ：注册 Runtime 并按 runtimeId 路由。 ModelManager 、 McpManager 、 SkillsManager 、 TraceManager ：各自配置和生命周期所有者。 ToolRegistry ：启动期注册、运行期冻结的内置工具表。 PluginManager ：发现、验证、启停并隔离插件扩展。 本章子课程 Runtime、模型与流式生命周期 03 agent runtime/01 runtime models streaming.md Tools、MCP 与 Skills 03 agent runtime/02 tools mcp skills.md 插件、网络与 Trace 03 agent runtime/03 plugins network traces.md 关键设计原则 1. 定义面与执行面分离：模型先产生 Tool Call，UI/Host 再执行工具。 2. 配置所有权清晰：每个 Manager 管自己的 settings 文件和连接缓存。 3. 运行作用域固定：一次 Run 开始后锁定 Runtime 与 Provider Connection。 4. 动态扩展故障隔离：单插件或 MCP 失败不阻止应用启动。 5. Network 最先初始化：代理环境必须在子进程和网络请求出现前生效。 "},{"id":"03-agent-runtime/01-runtime-models-streaming","chapterId":"03-agent-runtime","kind":"lesson","title":"Runtime、模型与流式生命周期","description":"packages/runtime/src/runtime/types.ts 定义完整能力面：streaming、filesystem、models、MCP、built-in tools、skills、search、network、traces。","source":"03-agent-runtime/01-runtime-models-streaming.md","level":2,"levelLabel":"核心","prerequisite":"Agent、Tool、MCP 基础","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>Runtime、模型与流式生命周期</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>RuntimeClient</strong><p>packages/runtime/src/runtime/types.ts 定义完整能力面：streaming、filesystem、models、MCP、built-in tools、skills、search、network、traces。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>LocalRuntimeClient 是 Facade</strong><p>它几乎不实现领域算法，而是把调用转交给：</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>ModelManager</strong><p>配置保存在 settings/models.json。Manager 合并：</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>Connection Snapshot</strong><p>Thread 保存 Provider + Model，不保存凭证。运行时：</p></div></div></section>","html":"<h1 id=\"s-0-Runtime-模型与流式生命周期\">Runtime、模型与流式生命周期</h1>\n<h2 id=\"s-1-1-RuntimeClient\">1. RuntimeClient</h2>\n<p><code>packages/runtime/src/runtime/types.ts</code> 定义完整能力面：streaming、filesystem、models、MCP、built-in tools、skills、search、network、traces。</p>\n<p><code>RuntimeInfo.capabilities</code> 用于远程握手与 UI 能力判断。<code>RuntimeRouter</code> 保证 local 永远存在、默认 Runtime 不可被直接注销、未传 ID 时选择默认实例。</p>\n<h2 id=\"s-4-2-LocalRuntimeClient-是-Facade\">2. LocalRuntimeClient 是 Facade</h2>\n<p>它几乎不实现领域算法，而是把调用转交给：</p>\n<ul><li><code>ModelManager</code></li><li><code>LocalFileSystem</code></li><li><code>McpManager</code></li><li><code>ToolRegistry</code></li><li><code>SkillsManager</code></li><li><code>SearchSettingsManager</code></li><li><code>NetworkSettingsManager</code></li><li><code>TraceManager</code></li><li><code>StreamThreadController</code></li></ul>\n<p>这种门面让远端协议只需对齐一个接口，而不是暴露所有内部类。</p>\n<h2 id=\"s-8-3-ModelManager\">3. ModelManager</h2>\n<p>配置保存在 <code>settings/models.json</code>。Manager 合并：</p>\n<ul><li>用户启用的内置 Provider。</li><li>自定义 Provider/Model。</li><li>插件声明的只读 Provider。</li><li>多个 Provider Profile。</li><li>默认模型选择。</li></ul>\n<p>用户配置优先于冲突的插件贡献。昂贵 Models registry 懒构建；配置变化只失效缓存，下一次使用再重建。</p>\n<h2 id=\"s-12-4-Connection-Snapshot\">4. Connection Snapshot</h2>\n<p>Thread 保存 Provider + Model，不保存凭证。运行时：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">providerId + optional profileId\n→ ModelManager.resolveConnection()\n→ { apiKey, baseUrl, headers }</code></pre></div>\n<p>这个结果在本次运行期间固定。若用户运行中切换 Profile，不应改变已经发出的请求。</p>\n<h2 id=\"s-16-5-StreamThreadController\">5. StreamThreadController</h2>\n<p>每个 <code>streamId</code> 对应一个 <code>AbortController</code>：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">run(payload)\n→ 校验 connection provider\n→ resolveConnection\n→ getAvailableModels\n→ streamAgent\n→ send(event...)\n→ send(done) / send(error)\n→ finally 删除 active stream</code></pre></div>\n<p>Abort 时直接结束，不伪造 done/error。Shutdown 会取消所有 active stream。</p>\n<h2 id=\"s-20-6-模型连接测试\">6. 模型连接测试</h2>\n<p>连接测试复用真实 <code>streamAgent()</code>，发送最小 “Reply with ok” 上下文。这样能覆盖 adapter、认证、Base URL 和流式协议，而不是只做浅层 HTTP ping。</p>\n<h2 id=\"s-22-7-Provider-Hosted-Tools-与-Response-Format\">7. Provider-Hosted Tools 与 Response Format</h2>\n<p><code>streamAgent()</code> 在 provider 已构建的 payload 上通过 <code>onPayload</code> 注入：</p>\n<ul><li>原样 Provider-Hosted Tool configs。</li><li><code>json_object</code> 或 <code>json_schema</code> response format。</li></ul>\n<p>不同 API 的 tools 容器位置不同，代码按 Google、Bedrock、pi-messages 等 adapter 分支处理。Provider 负责最终能力验证。</p>\n<h2 id=\"s-26-8-Telemetry\">8. Telemetry</h2>\n<p>运行结束记录 outcome、耗时、消息数、工具数和是否有 System Prompt。自定义 Provider/Model 名称会被替换为 <code>&quot;custom&quot;</code>，减少敏感信息采集。</p>\n<h2 id=\"s-28-9-生命周期顺序\">9. 生命周期顺序</h2>\n<p>启动先 Network，再创建会发请求或子进程的 Manager。关闭顺序由宿主组合根显式控制：远端、streaming、tool host、MCP、plugins、auth、analytics。</p>\n<h2 id=\"s-30-10-实践\">10. 实践</h2>\n<ol><li>新增一个 Runtime capability，列出必须同步修改的协议位置。</li><li>模拟两个并发 streamId，验证取消其中一个不影响另一个。</li><li>修改 Provider Profile 后检查 Models registry 与 Connection Snapshot 的区别。</li><li>阅读 <code>stream-thread.test.ts</code>，补一个 provider 不匹配用例。</li></ol>","markdown":"# Runtime、模型与流式生命周期\n\n## 1. RuntimeClient\n\n`packages/runtime/src/runtime/types.ts` 定义完整能力面：streaming、filesystem、models、MCP、built-in tools、skills、search、network、traces。\n\n`RuntimeInfo.capabilities` 用于远程握手与 UI 能力判断。`RuntimeRouter` 保证 local 永远存在、默认 Runtime 不可被直接注销、未传 ID 时选择默认实例。\n\n## 2. LocalRuntimeClient 是 Facade\n\n它几乎不实现领域算法，而是把调用转交给：\n\n- `ModelManager`\n- `LocalFileSystem`\n- `McpManager`\n- `ToolRegistry`\n- `SkillsManager`\n- `SearchSettingsManager`\n- `NetworkSettingsManager`\n- `TraceManager`\n- `StreamThreadController`\n\n这种门面让远端协议只需对齐一个接口，而不是暴露所有内部类。\n\n## 3. ModelManager\n\n配置保存在 `settings/models.json`。Manager 合并：\n\n- 用户启用的内置 Provider。\n- 自定义 Provider/Model。\n- 插件声明的只读 Provider。\n- 多个 Provider Profile。\n- 默认模型选择。\n\n用户配置优先于冲突的插件贡献。昂贵 Models registry 懒构建；配置变化只失效缓存，下一次使用再重建。\n\n## 4. Connection Snapshot\n\nThread 保存 Provider + Model，不保存凭证。运行时：\n\n```text\nproviderId + optional profileId\n→ ModelManager.resolveConnection()\n→ { apiKey, baseUrl, headers }\n```\n\n这个结果在本次运行期间固定。若用户运行中切换 Profile，不应改变已经发出的请求。\n\n## 5. StreamThreadController\n\n每个 `streamId` 对应一个 `AbortController`：\n\n```text\nrun(payload)\n→ 校验 connection provider\n→ resolveConnection\n→ getAvailableModels\n→ streamAgent\n→ send(event...)\n→ send(done) / send(error)\n→ finally 删除 active stream\n```\n\nAbort 时直接结束，不伪造 done/error。Shutdown 会取消所有 active stream。\n\n## 6. 模型连接测试\n\n连接测试复用真实 `streamAgent()`，发送最小 “Reply with ok” 上下文。这样能覆盖 adapter、认证、Base URL 和流式协议，而不是只做浅层 HTTP ping。\n\n## 7. Provider-Hosted Tools 与 Response Format\n\n`streamAgent()` 在 provider 已构建的 payload 上通过 `onPayload` 注入：\n\n- 原样 Provider-Hosted Tool configs。\n- `json_object` 或 `json_schema` response format。\n\n不同 API 的 tools 容器位置不同，代码按 Google、Bedrock、pi-messages 等 adapter 分支处理。Provider 负责最终能力验证。\n\n## 8. Telemetry\n\n运行结束记录 outcome、耗时、消息数、工具数和是否有 System Prompt。自定义 Provider/Model 名称会被替换为 `\"custom\"`，减少敏感信息采集。\n\n## 9. 生命周期顺序\n\n启动先 Network，再创建会发请求或子进程的 Manager。关闭顺序由宿主组合根显式控制：远端、streaming、tool host、MCP、plugins、auth、analytics。\n\n## 10. 实践\n\n1. 新增一个 Runtime capability，列出必须同步修改的协议位置。\n2. 模拟两个并发 streamId，验证取消其中一个不影响另一个。\n3. 修改 Provider Profile 后检查 Models registry 与 Connection Snapshot 的区别。\n4. 阅读 `stream-thread.test.ts`，补一个 provider 不匹配用例。\n","text":" Runtime、模型与流式生命周期 1. RuntimeClient packages/runtime/src/runtime/types.ts 定义完整能力面：streaming、filesystem、models、MCP、built in tools、skills、search、network、traces。 RuntimeInfo.capabilities 用于远程握手与 UI 能力判断。 RuntimeRouter 保证 local 永远存在、默认 Runtime 不可被直接注销、未传 ID 时选择默认实例。 2. LocalRuntimeClient 是 Facade 它几乎不实现领域算法，而是把调用转交给： ModelManager LocalFileSystem McpManager ToolRegistry SkillsManager SearchSettingsManager NetworkSettingsManager TraceManager StreamThreadController 这种门面让远端协议只需对齐一个接口，而不是暴露所有内部类。 3. ModelManager 配置保存在 settings/models.json 。Manager 合并： 用户启用的内置 Provider。 自定义 Provider/Model。 插件声明的只读 Provider。 多个 Provider Profile。 默认模型选择。 用户配置优先于冲突的插件贡献。昂贵 Models registry 懒构建；配置变化只失效缓存，下一次使用再重建。 4. Connection Snapshot Thread 保存 Provider + Model，不保存凭证。运行时： text providerId + optional profileId → ModelManager.resolveConnection → { apiKey, baseUrl, headers } 这个结果在本次运行期间固定。若用户运行中切换 Profile，不应改变已经发出的请求。 5. StreamThreadController 每个 streamId 对应一个 AbortController ： text run payload → 校验 connection provider → resolveConnection → getAvailableModels → streamAgent → send event... → send done / send error → finally 删除 active stream Abort 时直接结束，不伪造 done/error。Shutdown 会取消所有 active stream。 6. 模型连接测试 连接测试复用真实 streamAgent ，发送最小 “Reply with ok” 上下文。这样能覆盖 adapter、认证、Base URL 和流式协议，而不是只做浅层 HTTP ping。 7. Provider Hosted Tools 与 Response Format streamAgent 在 provider 已构建的 payload 上通过 onPayload 注入： 原样 Provider Hosted Tool configs。 json object 或 json schema response format。 不同 API 的 tools 容器位置不同，代码按 Google、Bedrock、pi messages 等 adapter 分支处理。Provider 负责最终能力验证。 8. Telemetry 运行结束记录 outcome、耗时、消息数、工具数和是否有 System Prompt。自定义 Provider/Model 名称会被替换为 \"custom\" ，减少敏感信息采集。 9. 生命周期顺序 启动先 Network，再创建会发请求或子进程的 Manager。关闭顺序由宿主组合根显式控制：远端、streaming、tool host、MCP、plugins、auth、analytics。 10. 实践 1. 新增一个 Runtime capability，列出必须同步修改的协议位置。 2. 模拟两个并发 streamId，验证取消其中一个不影响另一个。 3. 修改 Provider Profile 后检查 Models registry 与 Connection Snapshot 的区别。 4. 阅读 stream thread.test.ts ，补一个 provider 不匹配用例。 "},{"id":"03-agent-runtime/02-tools-mcp-skills","chapterId":"03-agent-runtime","kind":"lesson","title":"Tools、MCP 与 Skills","description":"模型请求中的 Tool 只是名称、描述和参数 Schema。streamAgent() 用 step-by-step stub 让 pi-agent 在产生 Tool Call 后终止当前模型轮次。真实执行发生在桌面 Host：","source":"03-agent-runtime/02-tools-mcp-skills.md","level":2,"levelLabel":"核心","prerequisite":"Agent、Tool、MCP 基础","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>Tools、MCP 与 Skills</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>定义与执行分离</strong><p>模型请求中的 Tool 只是名称、描述和参数 Schema。streamAgent() 用 step-by-step stub 让 pi-agent 在产生 Tool Call 后终止当前模型轮次。真实执行发生在桌面 Host：</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>ToolRegistry</strong><p>Registry 接收启动期 ToolContribution：</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>Built-in Tools</strong><p>典型能力：</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>MCP 基础</strong><p>MCP（Model Context Protocol）让外部 Server 标准化暴露 tools/resources/prompts。LLM Space 主要消费工具。</p></div></div></section>","html":"<h1 id=\"s-0-Tools-MCP-与-Skills\">Tools、MCP 与 Skills</h1>\n<h2 id=\"s-1-1-定义与执行分离\">1. 定义与执行分离</h2>\n<p>模型请求中的 Tool 只是名称、描述和参数 Schema。<code>streamAgent()</code> 用 step-by-step stub 让 pi-agent 在产生 Tool Call 后终止当前模型轮次。真实执行发生在桌面 Host：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">Assistant ToolCall\n→ useToolCallRunner / auto-run loop\n→ apps/desktop/src/client/tool-execution.ts\n→ built-in | mcp | plugin\n→ ToolCallOutput 写回 Thread\n→ 下一轮模型请求</code></pre></div>\n<p>这使用户能暂停、修改参数、伪造结果和复现异常。</p>\n<h2 id=\"s-5-2-ToolRegistry\">2. ToolRegistry</h2>\n<p>Registry 接收启动期 <code>ToolContribution</code>：</p>\n<ul><li>contribution ID 和 tool name 必须唯一。</li><li>注册时深拷贝并冻结定义。</li><li><code>freeze()</code> 后不可增加工具。</li><li>普通返回值统一转文本。</li><li>结构化图片等必须使用 <code>createToolCallResponse()</code>。</li></ul>\n<p>内置模块贡献 filesystem、web、media 与 misc 工具。</p>\n<h2 id=\"s-9-3-Built-in-Tools\">3. Built-in Tools</h2>\n<p>典型能力：</p>\n<ul><li>文件：read、write、edit、ls、tree、grep、glob、bash。</li><li>Agent 支撑：skill、todo_write、ask_user_question、sleep。</li><li>Web：web_search、web_fetch、weather_report。</li><li>媒体：generate_image。</li></ul>\n<p>这些工具运行在 Runtime 所在机器。Remote Runtime 下，文件路径和 shell 都指向远端 Linux，而不是桌面 Mac。</p>\n<h2 id=\"s-13-4-MCP-基础\">4. MCP 基础</h2>\n<p>MCP（Model Context Protocol）让外部 Server 标准化暴露 tools/resources/prompts。LLM Space 主要消费工具。</p>\n<p><code>McpManager</code> 管：</p>\n<ul><li>用户与插件只读配置。</li><li>已连接 Client。</li><li>正在连接的共享 Promise，防止重复并发连接。</li><li>Test AbortController。</li><li>readiness 与工具摘要。</li></ul>\n<h2 id=\"s-17-5-懒连接\">5. 懒连接</h2>\n<p><code>listTools()</code> 或 <code>callTool()</code> 才触发 <code>_connect()</code>。Transport 支持 stdio、Streamable HTTP 和 SSE。配置变化会关闭旧 Client 并使 readiness 失效。</p>\n<p>环境变量在连接时解析，而不是保存明文 secret。错误信息会清理 Token、Authorization 与 URL query。工具输出统一限制长度，防止异常 Server 撑爆 Thread。</p>\n<h2 id=\"s-20-6-Skills\">6. Skills</h2>\n<p>Skill 是含 <code>SKILL.md</code> 的目录，提供按需加载的专业说明。<code>SkillsManager</code> 扫描用户路径、内置托管目录与插件路径。</p>\n<p>冲突优先级：</p>\n<ul><li>用户 Skill 优先于插件 Skill。</li><li>多个插件同名时冲突项不进入可用集合。</li><li>隐藏设置影响 Agent 可见列表，但不随意删除磁盘内容。</li></ul>\n<p>内置 <code>skill</code> 工具按名称读取完整 Markdown；<code>available_skills</code> Prompt 变量只展示名称与描述，避免把所有正文提前塞入上下文。</p>\n<h2 id=\"s-25-7-三种工具所有权\">7. 三种工具所有权</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">Runtime Registry  owns built-in\nMCP Server        owns MCP execution\nPlugin subprocess owns plugin execution\nProvider service  owns provider-hosted execution\nUser/external     owns custom function result</code></pre></div>\n<p>实现工具功能前先确定所有权，否则容易错误地增加本地执行按钮或 ReAct continuation。</p>\n<h2 id=\"s-28-8-危险操作\">8. 危险操作</h2>\n<p>文件写入与 shell 可以造成真实副作用。UI 会识别危险 bash 命令并要求确认；自动运行路径也必须保留相同策略。Remote 环境的风险更高，因为路径可能指向共享服务器。</p>\n<h2 id=\"s-30-9-实践\">9. 实践</h2>\n<ol><li>写一个纯只读 built-in Tool Contribution，并在 freeze 前注册。</li><li>配置一个 stdio MCP，跟踪首次 listTools 的连接缓存。</li><li>制造 MCP 输出超长和带 Authorization 的错误，观察截断与清理。</li><li>创建同名用户/插件 Skill，验证优先级。</li><li>解释为什么 Provider-Hosted web_search 不能回退为本地 web_search。</li></ol>","markdown":"# Tools、MCP 与 Skills\n\n## 1. 定义与执行分离\n\n模型请求中的 Tool 只是名称、描述和参数 Schema。`streamAgent()` 用 step-by-step stub 让 pi-agent 在产生 Tool Call 后终止当前模型轮次。真实执行发生在桌面 Host：\n\n```text\nAssistant ToolCall\n→ useToolCallRunner / auto-run loop\n→ apps/desktop/src/client/tool-execution.ts\n→ built-in | mcp | plugin\n→ ToolCallOutput 写回 Thread\n→ 下一轮模型请求\n```\n\n这使用户能暂停、修改参数、伪造结果和复现异常。\n\n## 2. ToolRegistry\n\nRegistry 接收启动期 `ToolContribution`：\n\n- contribution ID 和 tool name 必须唯一。\n- 注册时深拷贝并冻结定义。\n- `freeze()` 后不可增加工具。\n- 普通返回值统一转文本。\n- 结构化图片等必须使用 `createToolCallResponse()`。\n\n内置模块贡献 filesystem、web、media 与 misc 工具。\n\n## 3. Built-in Tools\n\n典型能力：\n\n- 文件：read、write、edit、ls、tree、grep、glob、bash。\n- Agent 支撑：skill、todo_write、ask_user_question、sleep。\n- Web：web_search、web_fetch、weather_report。\n- 媒体：generate_image。\n\n这些工具运行在 Runtime 所在机器。Remote Runtime 下，文件路径和 shell 都指向远端 Linux，而不是桌面 Mac。\n\n## 4. MCP 基础\n\nMCP（Model Context Protocol）让外部 Server 标准化暴露 tools/resources/prompts。LLM Space 主要消费工具。\n\n`McpManager` 管：\n\n- 用户与插件只读配置。\n- 已连接 Client。\n- 正在连接的共享 Promise，防止重复并发连接。\n- Test AbortController。\n- readiness 与工具摘要。\n\n## 5. 懒连接\n\n`listTools()` 或 `callTool()` 才触发 `_connect()`。Transport 支持 stdio、Streamable HTTP 和 SSE。配置变化会关闭旧 Client 并使 readiness 失效。\n\n环境变量在连接时解析，而不是保存明文 secret。错误信息会清理 Token、Authorization 与 URL query。工具输出统一限制长度，防止异常 Server 撑爆 Thread。\n\n## 6. Skills\n\nSkill 是含 `SKILL.md` 的目录，提供按需加载的专业说明。`SkillsManager` 扫描用户路径、内置托管目录与插件路径。\n\n冲突优先级：\n\n- 用户 Skill 优先于插件 Skill。\n- 多个插件同名时冲突项不进入可用集合。\n- 隐藏设置影响 Agent 可见列表，但不随意删除磁盘内容。\n\n内置 `skill` 工具按名称读取完整 Markdown；`available_skills` Prompt 变量只展示名称与描述，避免把所有正文提前塞入上下文。\n\n## 7. 三种工具所有权\n\n```text\nRuntime Registry  owns built-in\nMCP Server        owns MCP execution\nPlugin subprocess owns plugin execution\nProvider service  owns provider-hosted execution\nUser/external     owns custom function result\n```\n\n实现工具功能前先确定所有权，否则容易错误地增加本地执行按钮或 ReAct continuation。\n\n## 8. 危险操作\n\n文件写入与 shell 可以造成真实副作用。UI 会识别危险 bash 命令并要求确认；自动运行路径也必须保留相同策略。Remote 环境的风险更高，因为路径可能指向共享服务器。\n\n## 9. 实践\n\n1. 写一个纯只读 built-in Tool Contribution，并在 freeze 前注册。\n2. 配置一个 stdio MCP，跟踪首次 listTools 的连接缓存。\n3. 制造 MCP 输出超长和带 Authorization 的错误，观察截断与清理。\n4. 创建同名用户/插件 Skill，验证优先级。\n5. 解释为什么 Provider-Hosted web_search 不能回退为本地 web_search。\n","text":" Tools、MCP 与 Skills 1. 定义与执行分离 模型请求中的 Tool 只是名称、描述和参数 Schema。 streamAgent 用 step by step stub 让 pi agent 在产生 Tool Call 后终止当前模型轮次。真实执行发生在桌面 Host： text Assistant ToolCall → useToolCallRunner / auto run loop → apps/desktop/src/client/tool execution.ts → built in mcp plugin → ToolCallOutput 写回 Thread → 下一轮模型请求 这使用户能暂停、修改参数、伪造结果和复现异常。 2. ToolRegistry Registry 接收启动期 ToolContribution ： contribution ID 和 tool name 必须唯一。 注册时深拷贝并冻结定义。 freeze 后不可增加工具。 普通返回值统一转文本。 结构化图片等必须使用 createToolCallResponse 。 内置模块贡献 filesystem、web、media 与 misc 工具。 3. Built in Tools 典型能力： 文件：read、write、edit、ls、tree、grep、glob、bash。 Agent 支撑：skill、todo write、ask user question、sleep。 Web：web search、web fetch、weather report。 媒体：generate image。 这些工具运行在 Runtime 所在机器。Remote Runtime 下，文件路径和 shell 都指向远端 Linux，而不是桌面 Mac。 4. MCP 基础 MCP（Model Context Protocol）让外部 Server 标准化暴露 tools/resources/prompts。LLM Space 主要消费工具。 McpManager 管： 用户与插件只读配置。 已连接 Client。 正在连接的共享 Promise，防止重复并发连接。 Test AbortController。 readiness 与工具摘要。 5. 懒连接 listTools 或 callTool 才触发 connect 。Transport 支持 stdio、Streamable HTTP 和 SSE。配置变化会关闭旧 Client 并使 readiness 失效。 环境变量在连接时解析，而不是保存明文 secret。错误信息会清理 Token、Authorization 与 URL query。工具输出统一限制长度，防止异常 Server 撑爆 Thread。 6. Skills Skill 是含 SKILL.md 的目录，提供按需加载的专业说明。 SkillsManager 扫描用户路径、内置托管目录与插件路径。 冲突优先级： 用户 Skill 优先于插件 Skill。 多个插件同名时冲突项不进入可用集合。 隐藏设置影响 Agent 可见列表，但不随意删除磁盘内容。 内置 skill 工具按名称读取完整 Markdown； available skills Prompt 变量只展示名称与描述，避免把所有正文提前塞入上下文。 7. 三种工具所有权 text Runtime Registry owns built in MCP Server owns MCP execution Plugin subprocess owns plugin execution Provider service owns provider hosted execution User/external owns custom function result 实现工具功能前先确定所有权，否则容易错误地增加本地执行按钮或 ReAct continuation。 8. 危险操作 文件写入与 shell 可以造成真实副作用。UI 会识别危险 bash 命令并要求确认；自动运行路径也必须保留相同策略。Remote 环境的风险更高，因为路径可能指向共享服务器。 9. 实践 1. 写一个纯只读 built in Tool Contribution，并在 freeze 前注册。 2. 配置一个 stdio MCP，跟踪首次 listTools 的连接缓存。 3. 制造 MCP 输出超长和带 Authorization 的错误，观察截断与清理。 4. 创建同名用户/插件 Skill，验证优先级。 5. 解释为什么 Provider Hosted web search 不能回退为本地 web search。 "},{"id":"03-agent-runtime/03-plugins-network-traces","chapterId":"03-agent-runtime","kind":"lesson","title":"插件、网络与 Trace","description":"插件位于 LLMSPACEHOME/plugins/ 的 npm-compatible package。PluginManager.create()：","source":"03-agent-runtime/03-plugins-network-traces.md","level":2,"levelLabel":"核心","prerequisite":"Agent、Tool、MCP 基础","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>插件、网络与 Trace</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>Plugin 生命周期</strong><p>插件位于 LLMSPACEHOME/plugins/ 的 npm-compatible package。PluginManager.create()：</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>扩展类型</strong><p>当前源码可发现：</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>子进程不是 Sandbox</strong><p>Command、Tool 与 Thread Storage 在每插件独立 Bun 子进程中运行，通过 NDJSON RPC 通信，并有消息大小、timeout 与 stderr 上限。</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>Host 白名单</strong><p>插件可通过受控 host request 请求通知、打开链接、选择文件、读写 workspace 和执行少量宿主 Command。宿主仍校验 method 与参数，避免直接暴露内部 Manager。</p></div></div></section>","html":"<h1 id=\"s-0-插件-网络与-Trace\">插件、网络与 Trace</h1>\n<h2 id=\"s-1-1-Plugin-生命周期\">1. Plugin 生命周期</h2>\n<p>插件位于 <code>LLM_SPACE_HOME/plugins/</code> 的 npm-compatible package。<code>PluginManager.create()</code>：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">discover\n→ metadata / engine 校验\n→ settings\n→ declarative extensions\n→ subprocess\n→ registries\n→ rebuild contributions</code></pre></div>\n<p>发现器拒绝名称不匹配、路径逃逸和 symlink 候选。单插件错误被记录，不阻止其他插件和应用启动。</p>\n<h2 id=\"s-5-2-扩展类型\">2. 扩展类型</h2>\n<p>当前源码可发现：</p>\n<ul><li><code>skills/*/SKILL.md</code></li><li><code>mcp.json</code></li><li><code>models.json</code></li><li><code>commands/*.{ts,js,mjs}</code></li><li><code>tools/*.{ts,js,mjs}</code></li><li><code>thread-storages/*.{ts,js,mjs}</code></li><li><code>config.schema.json</code></li></ul>\n<p>注意 Draft RFC 仍写着 Tool 只能通过 MCP，但可执行源码、测试和用户文档已经支持 <code>tools/</code>。发生规范漂移时，优先级是源码与测试 &gt; 当前用户文档 &gt; Draft RFC。</p>\n<h2 id=\"s-9-3-子进程不是-Sandbox\">3. 子进程不是 Sandbox</h2>\n<p>Command、Tool 与 Thread Storage 在每插件独立 Bun 子进程中运行，通过 NDJSON RPC 通信，并有消息大小、timeout 与 stderr 上限。</p>\n<p>它能隔离崩溃和未处理异常，但插件仍可使用 Bun/Node API 访问文件、网络、环境变量和进程。因此“复制插件到目录”本质上是信任并授权代码执行。</p>\n<h2 id=\"s-12-4-Host-白名单\">4. Host 白名单</h2>\n<p>插件可通过受控 host request 请求通知、打开链接、选择文件、读写 workspace 和执行少量宿主 Command。宿主仍校验 method 与参数，避免直接暴露内部 Manager。</p>\n<h2 id=\"s-14-5-Settings-与冲突\">5. Settings 与冲突</h2>\n<p><code>settings/plugins.json</code> 保存 enabled 与 JSON settings。写入采用原子替换并保留 last-known-good。Canonical extension ID 冲突时不使用 first-wins，而是让冲突贡献失效，避免加载顺序成为隐式 API。</p>\n<h2 id=\"s-16-6-NetworkSettingsManager\">6. NetworkSettingsManager</h2>\n<p>Network 设置是进程级副作用：</p>\n<ul><li>同步写入大小写两套 <code>HTTP_PROXY</code>/<code>HTTPS_PROXY</code>/<code>NO_PROXY</code>。</li><li>清除 <code>ALL_PROXY</code>，避免 Bun/依赖使用意外代理。</li><li>必须在 MCP、插件子进程和 GitHub fetch 之前初始化。</li></ul>\n<p>应用内 GitHub 调用直接使用全局 fetch，从统一代理环境获益，不应绕过为自定义 dispatcher。</p>\n<h2 id=\"s-20-7-SearchSettings\">7. SearchSettings</h2>\n<p>Search Manager 只保存 Brave、Firecrawl、Tavily 等配置，不提供独立服务。每次执行 <code>web_search</code>/<code>web_fetch</code> 时读取当前设置并创建对应 Provider。</p>\n<h2 id=\"s-22-8-Trace-Workbench\">8. Trace Workbench</h2>\n<p>Trace 系统处理 Langfuse 等外部运行证据：</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">JSON/remote observations\n→ raw.json\n→ normalized trace.json\n→ 首次打开生成 workbench.json\n→ 用户只编辑 workbench</code></pre></div>\n<p>原始 Trace 不被可视化调试修改。Workbench 是从证据派生出的可编辑 Thread，用于复现。</p>\n<h2 id=\"s-26-9-扩展练习\">9. 扩展练习</h2>\n<ol><li>阅读 <code>plugin-discovery.test.ts</code>，列出全部路径校验。</li><li>设计插件 Tool 的错误日志，确保不记录 secret、prompt 和 tool payload。</li><li>修改代理设置，观察它为何必须影响子进程环境。</li><li>导入一条 Langfuse Trace，区分 raw、normalized 与 workbench 三层。</li><li>评审插件 RFC 与实现差异，提出文档同步方案。</li></ol>","markdown":"# 插件、网络与 Trace\n\n## 1. Plugin 生命周期\n\n插件位于 `LLM_SPACE_HOME/plugins/` 的 npm-compatible package。`PluginManager.create()`：\n\n```text\ndiscover\n→ metadata / engine 校验\n→ settings\n→ declarative extensions\n→ subprocess\n→ registries\n→ rebuild contributions\n```\n\n发现器拒绝名称不匹配、路径逃逸和 symlink 候选。单插件错误被记录，不阻止其他插件和应用启动。\n\n## 2. 扩展类型\n\n当前源码可发现：\n\n- `skills/*/SKILL.md`\n- `mcp.json`\n- `models.json`\n- `commands/*.{ts,js,mjs}`\n- `tools/*.{ts,js,mjs}`\n- `thread-storages/*.{ts,js,mjs}`\n- `config.schema.json`\n\n注意 Draft RFC 仍写着 Tool 只能通过 MCP，但可执行源码、测试和用户文档已经支持 `tools/`。发生规范漂移时，优先级是源码与测试 > 当前用户文档 > Draft RFC。\n\n## 3. 子进程不是 Sandbox\n\nCommand、Tool 与 Thread Storage 在每插件独立 Bun 子进程中运行，通过 NDJSON RPC 通信，并有消息大小、timeout 与 stderr 上限。\n\n它能隔离崩溃和未处理异常，但插件仍可使用 Bun/Node API 访问文件、网络、环境变量和进程。因此“复制插件到目录”本质上是信任并授权代码执行。\n\n## 4. Host 白名单\n\n插件可通过受控 host request 请求通知、打开链接、选择文件、读写 workspace 和执行少量宿主 Command。宿主仍校验 method 与参数，避免直接暴露内部 Manager。\n\n## 5. Settings 与冲突\n\n`settings/plugins.json` 保存 enabled 与 JSON settings。写入采用原子替换并保留 last-known-good。Canonical extension ID 冲突时不使用 first-wins，而是让冲突贡献失效，避免加载顺序成为隐式 API。\n\n## 6. NetworkSettingsManager\n\nNetwork 设置是进程级副作用：\n\n- 同步写入大小写两套 `HTTP_PROXY`/`HTTPS_PROXY`/`NO_PROXY`。\n- 清除 `ALL_PROXY`，避免 Bun/依赖使用意外代理。\n- 必须在 MCP、插件子进程和 GitHub fetch 之前初始化。\n\n应用内 GitHub 调用直接使用全局 fetch，从统一代理环境获益，不应绕过为自定义 dispatcher。\n\n## 7. SearchSettings\n\nSearch Manager 只保存 Brave、Firecrawl、Tavily 等配置，不提供独立服务。每次执行 `web_search`/`web_fetch` 时读取当前设置并创建对应 Provider。\n\n## 8. Trace Workbench\n\nTrace 系统处理 Langfuse 等外部运行证据：\n\n```text\nJSON/remote observations\n→ raw.json\n→ normalized trace.json\n→ 首次打开生成 workbench.json\n→ 用户只编辑 workbench\n```\n\n原始 Trace 不被可视化调试修改。Workbench 是从证据派生出的可编辑 Thread，用于复现。\n\n## 9. 扩展练习\n\n1. 阅读 `plugin-discovery.test.ts`，列出全部路径校验。\n2. 设计插件 Tool 的错误日志，确保不记录 secret、prompt 和 tool payload。\n3. 修改代理设置，观察它为何必须影响子进程环境。\n4. 导入一条 Langfuse Trace，区分 raw、normalized 与 workbench 三层。\n5. 评审插件 RFC 与实现差异，提出文档同步方案。\n","text":" 插件、网络与 Trace 1. Plugin 生命周期 插件位于 LLM SPACE HOME/plugins/ 的 npm compatible package。 PluginManager.create ： text discover → metadata / engine 校验 → settings → declarative extensions → subprocess → registries → rebuild contributions 发现器拒绝名称不匹配、路径逃逸和 symlink 候选。单插件错误被记录，不阻止其他插件和应用启动。 2. 扩展类型 当前源码可发现： skills/ /SKILL.md mcp.json models.json commands/ .{ts,js,mjs} tools/ .{ts,js,mjs} thread storages/ .{ts,js,mjs} config.schema.json 注意 Draft RFC 仍写着 Tool 只能通过 MCP，但可执行源码、测试和用户文档已经支持 tools/ 。发生规范漂移时，优先级是源码与测试 当前用户文档 Draft RFC。 3. 子进程不是 Sandbox Command、Tool 与 Thread Storage 在每插件独立 Bun 子进程中运行，通过 NDJSON RPC 通信，并有消息大小、timeout 与 stderr 上限。 它能隔离崩溃和未处理异常，但插件仍可使用 Bun/Node API 访问文件、网络、环境变量和进程。因此“复制插件到目录”本质上是信任并授权代码执行。 4. Host 白名单 插件可通过受控 host request 请求通知、打开链接、选择文件、读写 workspace 和执行少量宿主 Command。宿主仍校验 method 与参数，避免直接暴露内部 Manager。 5. Settings 与冲突 settings/plugins.json 保存 enabled 与 JSON settings。写入采用原子替换并保留 last known good。Canonical extension ID 冲突时不使用 first wins，而是让冲突贡献失效，避免加载顺序成为隐式 API。 6. NetworkSettingsManager Network 设置是进程级副作用： 同步写入大小写两套 HTTP PROXY / HTTPS PROXY / NO PROXY 。 清除 ALL PROXY ，避免 Bun/依赖使用意外代理。 必须在 MCP、插件子进程和 GitHub fetch 之前初始化。 应用内 GitHub 调用直接使用全局 fetch，从统一代理环境获益，不应绕过为自定义 dispatcher。 7. SearchSettings Search Manager 只保存 Brave、Firecrawl、Tavily 等配置，不提供独立服务。每次执行 web search / web fetch 时读取当前设置并创建对应 Provider。 8. Trace Workbench Trace 系统处理 Langfuse 等外部运行证据： text JSON/remote observations → raw.json → normalized trace.json → 首次打开生成 workbench.json → 用户只编辑 workbench 原始 Trace 不被可视化调试修改。Workbench 是从证据派生出的可编辑 Thread，用于复现。 9. 扩展练习 1. 阅读 plugin discovery.test.ts ，列出全部路径校验。 2. 设计插件 Tool 的错误日志，确保不记录 secret、prompt 和 tool payload。 3. 修改代理设置，观察它为何必须影响子进程环境。 4. 导入一条 Langfuse Trace，区分 raw、normalized 与 workbench 三层。 5. 评审插件 RFC 与实现差异，提出文档同步方案。 "},{"id":"04-desktop-app","chapterId":"04-desktop-app","kind":"chapter","title":"第四章：Electrobun 桌面应用","description":"桌面应用同时运行两个 JavaScript 世界：","source":"04-desktop-app.md","level":3,"levelLabel":"进阶","prerequisite":"React、RPC、Runtime","duration":"10 分钟","visual":"<section class=\"chapter-guide\"><div class=\"chapter-guide-head\"><div><span>章节导读</span><strong>第四章：Electrobun 桌面应用</strong></div><p>按以下顺序完成本章课程。每一项都对应一篇独立学习材料。</p></div><div class=\"chapter-guide-grid\"><a class=\"chapter-guide-card\" href=\"#04-desktop-app/01-bootstrap-rpc-commands\"><span class=\"chapter-guide-number\">01</span><div><strong>启动、RPC 与 Command Bus</strong><p>src/bun/index.ts 先注入登录 shell 环境、监听可能早到的 Deep Link、seed workspace/skills，再调用 startDesktopApp()。</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#04-desktop-app/02-tabs-files-persistence\"><span class=\"chapter-guide-number\">02</span><div><strong>Thread Tabs、文件树与持久化</strong><p>Thread Tab 包含 path + runtimeId + paneId：</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a><a class=\"chapter-guide-card\" href=\"#04-desktop-app/03-host-settings-lifecycle\"><span class=\"chapter-guide-number\">03</span><div><strong>Host Services、设置与生命周期</strong><p>共享 packages/ui 只依赖 HostServices。桌面实现把接口适配到：</p></div><span class=\"chapter-guide-action\">30 分钟 · 进入课程 →</span></a></div></section>","html":"<h1 id=\"s-0-第四章-Electrobun-桌面应用\">第四章：Electrobun 桌面应用</h1>\n<p>桌面应用同时运行两个 JavaScript 世界：</p>\n<ul><li>Bun 主进程拥有窗口、文件系统、网络、子进程、认证、更新与 Runtime。</li><li>WebView/CEF Renderer 运行 React，拥有页面、标签页和交互状态。</li></ul>\n<p>二者通过单一 typed Electrobun RPC contract 通信。理解这条边界后，<code>apps/desktop</code> 的大体量代码会变得可分解。</p>\n<h2 id=\"s-4-子课程\">子课程</h2>\n<ul><li><a href=\"04-desktop-app/01-bootstrap-rpc-commands.md\" data-wiki-link=\"04-desktop-app/01-bootstrap-rpc-commands.md\">启动、RPC 与 Command Bus</a></li><li><a href=\"04-desktop-app/02-tabs-files-persistence.md\" data-wiki-link=\"04-desktop-app/02-tabs-files-persistence.md\">Thread Tabs、文件树与持久化</a></li><li><a href=\"04-desktop-app/03-host-settings-lifecycle.md\" data-wiki-link=\"04-desktop-app/03-host-settings-lifecycle.md\">Host Services、设置与生命周期</a></li></ul>\n<h2 id=\"s-6-总体路径\">总体路径</h2>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">bun/index.ts\n→ startDesktopApp()\n→ managers / runtime / rpc / window\n→ mainview/main.tsx\n→ app/layout.tsx providers\n→ app/page.tsx\n→ file tree + tabs + shared ThreadPlayground</code></pre></div>\n<p>先阅读组合根与 RPC contract，再阅读具体设置页面。不要从 1500 行 React 页面开始猜系统。</p>","markdown":"# 第四章：Electrobun 桌面应用\n\n桌面应用同时运行两个 JavaScript 世界：\n\n- Bun 主进程拥有窗口、文件系统、网络、子进程、认证、更新与 Runtime。\n- WebView/CEF Renderer 运行 React，拥有页面、标签页和交互状态。\n\n二者通过单一 typed Electrobun RPC contract 通信。理解这条边界后，`apps/desktop` 的大体量代码会变得可分解。\n\n## 子课程\n\n- [启动、RPC 与 Command Bus](04-desktop-app/01-bootstrap-rpc-commands.md)\n- [Thread Tabs、文件树与持久化](04-desktop-app/02-tabs-files-persistence.md)\n- [Host Services、设置与生命周期](04-desktop-app/03-host-settings-lifecycle.md)\n\n## 总体路径\n\n```text\nbun/index.ts\n→ startDesktopApp()\n→ managers / runtime / rpc / window\n→ mainview/main.tsx\n→ app/layout.tsx providers\n→ app/page.tsx\n→ file tree + tabs + shared ThreadPlayground\n```\n\n先阅读组合根与 RPC contract，再阅读具体设置页面。不要从 1500 行 React 页面开始猜系统。\n","text":" 第四章：Electrobun 桌面应用 桌面应用同时运行两个 JavaScript 世界： Bun 主进程拥有窗口、文件系统、网络、子进程、认证、更新与 Runtime。 WebView/CEF Renderer 运行 React，拥有页面、标签页和交互状态。 二者通过单一 typed Electrobun RPC contract 通信。理解这条边界后， apps/desktop 的大体量代码会变得可分解。 子课程 启动、RPC 与 Command Bus 04 desktop app/01 bootstrap rpc commands.md Thread Tabs、文件树与持久化 04 desktop app/02 tabs files persistence.md Host Services、设置与生命周期 04 desktop app/03 host settings lifecycle.md 总体路径 text bun/index.ts → startDesktopApp → managers / runtime / rpc / window → mainview/main.tsx → app/layout.tsx providers → app/page.tsx → file tree + tabs + shared ThreadPlayground 先阅读组合根与 RPC contract，再阅读具体设置页面。不要从 1500 行 React 页面开始猜系统。 "},{"id":"04-desktop-app/01-bootstrap-rpc-commands","chapterId":"04-desktop-app","kind":"lesson","title":"启动、RPC 与 Command Bus","description":"src/bun/index.ts 先注入登录 shell 环境、监听可能早到的 Deep Link、seed workspace/skills，再调用 startDesktopApp()。","source":"04-desktop-app/01-bootstrap-rpc-commands.md","level":3,"levelLabel":"进阶","prerequisite":"React、RPC、Runtime","duration":"30 分钟","visual":"<section class=\"lesson-outline\"><div class=\"lesson-outline-head\"><span>本节脉络</span><strong>启动、RPC 与 Command Bus</strong></div><div class=\"lesson-outline-grid\"><div class=\"lesson-outline-card\"><span>01</span><strong>启动链</strong><p>src/bun/index.ts 先注入登录 shell 环境、监听可能早到的 Deep Link、seed workspace/skills，再调用 startDesktopApp()。</p></div><div class=\"lesson-outline-card\"><span>02</span><strong>Typed RPC</strong><p>shared/rpc.ts 的 DesktopRPCType 是两侧契约。类型分为：</p></div><div class=\"lesson-outline-card\"><span>03</span><strong>用 message 模拟流</strong><p>Electrobun RPC 没有原生 AsyncGenerator。createRpcTransport()：</p></div><div class=\"lesson-outline-card\"><span>04</span><strong>RPC 与 Command 的区别</strong><p>RPC 描述底层能力，如 fsWrite；Command 描述用户意图，如 deleteFile、openSettings、runThread。</p></div></div></section>","html":"<h1 id=\"s-0-启动-RPC-与-Command-Bus\">启动、RPC 与 Command Bus</h1>\n<h2 id=\"s-1-1-启动链\">1. 启动链</h2>\n<p><code>src/bun/index.ts</code> 先注入登录 shell 环境、监听可能早到的 Deep Link、seed workspace/skills，再调用 <code>startDesktopApp()</code>。</p>\n<p>组合根创建 Network、MCP、Models、Skills、Plugins、GitHub Auth、Storage、Trace、Streaming、Tool Host、Local Runtime、Router、Remote Manager、Updater、RPC 与 Window。</p>\n<p>窗口开发时加载 Vite，生产时加载 <code>views://mainview/index.html</code>。Renderer 由 <code>mainview/main.tsx</code> 挂载 React Provider 树。</p>\n<h2 id=\"s-5-2-Typed-RPC\">2. Typed RPC</h2>\n<p><code>shared/rpc.ts</code> 的 <code>DesktopRPCType</code> 是两侧契约。类型分为：</p>\n<ul><li><strong>request/response</strong>：模型、文件、设置、MCP、插件等一次性操作。</li><li><strong>message</strong>：Agent 流、Command、更新状态、远程连接状态等事件。</li></ul>\n<p>Bun 实现在 <code>bun/rpc/index.ts</code>，Renderer 入口在 <code>lib/electrobun.ts</code> 与 <code>client/*</code>。</p>\n<h2 id=\"s-9-3-用-message-模拟流\">3. 用 message 模拟流</h2>\n<p>Electrobun RPC 没有原生 AsyncGenerator。<code>createRpcTransport()</code>：</p>\n<ol><li>生成 UUID <code>streamId</code>。</li><li>注册只接收该 ID 的 listener。</li><li>发送 start message。</li><li>把 event message 放入队列。</li><li>用 wake Promise 让 <code>for await</code> 消费。</li><li>done 结束、error 抛出。</li><li>Abort 或消费者提前 break 时通知 Bun 取消。</li></ol>\n<p>队列消费后清空槽位，并在阈值后 compact，避免长对话一直保留已消费事件引用。</p>\n<h2 id=\"s-13-4-RPC-与-Command-的区别\">4. RPC 与 Command 的区别</h2>\n<p>RPC 描述底层能力，如 <code>fsWrite</code>；Command 描述用户意图，如 <code>deleteFile</code>、<code>openSettings</code>、<code>runThread</code>。</p>\n<p><code>shared/commands.ts</code> 使用 discriminated union 定义 type + args，<code>COMMAND_META</code> 标记目标是 webview 还是 bun。</p>\n<div class=\"code-wrap\"><button class=\"copy-code\">复制</button><pre><code class=\"language-text\">菜单/快捷键/按钮\n→ executeCommand(command)\n→ 当前进程检查 target\n→ 本地执行或转发另一侧</code></pre></div>\n<p>这样原生菜单与 React 按钮共享相同行为，不会形成两套业务逻辑。</p>\n<h2 id=\"s-18-5-Command-Provider\">5. Command Provider</h2>\n<p>Renderer <code>CommandProvider</code> 维护 handler 注册。具体页面挂载时注册处理器，卸载时 disposer 清理。Bun 侧处理窗口缩放、外链、更新等系统能力，并把 UI Command 转发 Renderer。</p>\n<h2 id=\"s-20-6-Deep-Link\">6. Deep Link</h2>\n<p>冷启动 Deep Link 可能早于 Window/RPC，因此入口先缓存；对象图完成后才安装真实 Handler 并 flush。共享 Thread 链接读取 Gist/Storage、写入本地 workspace，再发送 Command 定位文件。</p>\n<h2 id=\"s-22-7-退出握手\">7. 退出握手</h2>\n<p>Electrobun quit 需要两阶段协调：第一次 before-quit 阻止直接退出，等待异步清理；完成后再次允许 app quit。否则 MCP、插件子进程、远程 Server 和 analytics 可能来不及关闭。</p>\n<h2 id=\"s-24-8-实践\">8. 实践</h2>\n<ol><li>新增一个只在 Renderer 处理的 Command，串起类型、metadata、handler 和菜单。</li><li>在 RPC 流中模拟消费者提前 break，验证 Bun Abort。</li><li>解释为何 <code>DesktopRPCType</code> 必须放 shared，而实现不能放 shared。</li><li>跟踪一个冷启动分享 Deep Link，标出缓存和窗口激活时机。</li></ol>","markdown":"# 启动、RPC 与 Command Bus\n\n## 1. 启动链\n\n`src/bun/index.ts` 先注入登录 shell 环境、监听可能早到的 Deep Link、seed workspace/skills，再调用 `startDesktopApp()`。\n\n组合根创建 Network、MCP、Models、Skills、Plugins、GitHub Auth、Storage、Trace、Streaming、Tool Host、Local Runtime、Router、Remote Manager、Updater、RPC 与 Window。\n\n窗口开发时加载 Vite，生产时加载 `views://mainview/index.html`。Renderer 由 `mainview/main.tsx` 挂载 React Provider 树。\n\n## 2. Typed RPC\n\n`shared/rpc.ts` 的 `DesktopRPCType` 是两侧契约。类型分为：\n\n- **request/response**：模型、文件、设置、MCP、插件等一次性操作。\n- **message**：Agent 流、Command、更新状态、远程连接状态等事件。\n\nBun 实现在 `bun/rpc/index.ts`，Renderer 入口在 `lib/electrobun.ts` 与 `client/*`。\n\n## 3. 用 message 模拟流\n\nElectrobun RPC 没有原生 AsyncGenerator。`createRpcTransport()`：\n\n1. 生成 UUID `streamId`。\n2. 注册只接收该 ID 的 listener。\n3. 发送 start message。\n4. 把 event message 放入队列。\n5. 用 wake Promise 让 `for await` 消费。\n6. done 结束、error 抛出。\n7. Abort 或消费者提前 break 时通知 Bun 取消。\n\n队列消费后清空槽位，并在阈值后 compact，避免长对话一直保留已消费事件引用。\n\n## 4. RPC 与 Command 的区别\n\nRPC 描述底层能力，如 `fsWrite`；Command 描述用户意图，如 `deleteFile`、`openSettings`、`runThread`。\n\n`shared/commands.ts` 使用 discriminated union 定义 type + args，`COMMAND_META` 标记目标是 webview 还是 bun。\n\n```text\n菜单/快捷键/按钮\n→ executeCommand(command)\n→ 当前进程检查 target\n→ 本地执行或转发另一侧\n```\n\n这样原生菜单与 React 按钮共享相同行为，不会形成两套业务逻辑。\n\n## 5. Command Provider\n\nRenderer `CommandProvider` 维护 handler 注册。具体页面挂载时注册处理器，卸载时 disposer 清理。Bun 侧处理窗口缩放、外链、更新等系统能力，并把 UI Command 转发 Renderer。\n\n## 6. Deep Link\n\n冷启动 Deep Link 可能早于 Window/RPC，因此入口先缓存；对象图完成后才安装真实 Handler 并 flush。共享 Thread 链接读取 Gist/Storage、写入本地 workspace，再发送 Command 定位文件。\n\n## 7. 退出握手\n\nElectrobun quit 需要两阶段协调：第一次 before-quit 阻止直接退出，等待异步清理；完成后再次允许 app quit。否则 MCP、插件子进程、远程 Server 和 analytics 可能来不及关闭。\n\n## 8. 实践\n\n1. 新增一个只在 Renderer 处理的 Command，串起类型、metadata、handler 和菜单。\n2. 在 RPC 流中模拟消费者提前 break，验证 Bun Abort。\n3. 解释为何 `DesktopRPCType` 必须放 shared，而实现不能放 shared。\n4. 跟踪一个冷启动
